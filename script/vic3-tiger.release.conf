# Release-only Tiger configuration for CI.
# Local development continues to use the repository-root vic3-tiger.conf
# (workshop CMF load). This file is copied into place by script/run-tiger-release.sh.
#
# Known false positive filtered here (Victoria 3 1.13.11 field Tiger 1.19.0
# still flags as unknown-field on culture seals — I-29 / I-11 documented baseline):
#   error(unknown-field): seal_and_signature_texture
# After this filter, release requires fatal=0 and error=0.

languages = {
	check = "english"
	check = "turkish"
}

filter = {
	show_vanilla = no
	show_loaded_mods = no
	trigger = {
		NOT = {
			AND = {
				key = unknown-field
				text = "seal_and_signature_texture"
			}
		}
	}
}
