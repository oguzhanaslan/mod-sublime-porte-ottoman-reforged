# Repository-local Tiger validation policy.
# Keep exceptions narrow: both entries below are verified vanilla 1.13.11 syntax
# that vic3-tiger 1.19.0 (targeting Victoria 3 1.13.5) reports incorrectly.

languages = {
	check = "english"
	check = "turkish"
}

filter = {
	show_vanilla = no
	show_loaded_mods = no

	trigger = {
		ignore_keys_in_files = {
			keys = { unknown-field }
			files = { common/cultures/sp_turkish_names.txt }
		}
		ignore_keys_in_files = {
			keys = { duplicate-field }
			files = { common/history/military_formations/04_military_formations_middle_east.txt }
		}
	}
}
