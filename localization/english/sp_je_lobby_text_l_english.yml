l_english:
 sp_ottoman_balkan_cohesion_guidance_lobby: "Rumelia can be held through reform and integration, order and centralization, or compromise with existing Balkan subjects. These are tools, not exclusive paths."
 sp_je_tanzimat_reforms_lobby: "While Tanzimat is underway, the Porte may issue optional reform decrees from this journal. They support the program but do not complete Tanzimat objectives or add a Tanzimat point."
 sp_egyptian_question_lobby: "The struggle with Egypt can end in a limited European settlement, an expensive maximalist victory, or stalemate. Military success, Great Power backing, or territorial leverage can open mediation."
 sp_je_post_tanzimat_era_lobby: "After Tanzimat, debate turns to representation, constitutional order, and the limits of royal power. This entry tracks that contest; it does not enact laws by itself."
 sp_je_imperial_identity_lobby: "After Tanzimat, choose one course: Ottomanism (citizenship and constitution), Islamism (Caliphate and Muslim geopolitics), or Turkism (the Turanian Ideal). Only one path can be taken."
