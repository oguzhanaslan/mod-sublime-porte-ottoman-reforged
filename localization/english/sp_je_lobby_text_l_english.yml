l_english:
 sp_ottoman_balkan_cohesion_guidance_lobby: "Rumelia can be held through reform and integration, order and centralization, or compromise with existing Balkan subjects. These are tools, not exclusive paths."
 sp_je_tanzimat_reforms_lobby: "While the Tanzimat is underway, the Sublime Porte may issue further reform decrees. They support the wider programme without fulfilling its principal objectives."
 sp_egyptian_question_lobby: "The struggle with Egypt can end in a limited European settlement, an expensive maximalist victory, or stalemate. Military success, Great Power backing, or territorial leverage can open mediation."
 sp_je_post_tanzimat_era_lobby: "After the Tanzimat, debate turns to representation, constitutional order, and the limits of royal power. The outcome will be decided through politics and legislation."
 sp_je_imperial_identity_lobby: "Once the Constitutional Question is resolved, choose one course: Ottomanism (citizenship and constitution), Islamism (Caliphate and Muslim geopolitics), or Turkism (the Turanian Ideal). Only one path can be taken."
