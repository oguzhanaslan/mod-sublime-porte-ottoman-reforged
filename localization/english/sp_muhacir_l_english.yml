l_english:
 sp_muhacir.1.t:0 "The Great Tatar Migration"
 sp_muhacir.1.d:0 "Crimean Tatars and Nogai kin seek refuge under Ottoman protection. The Porte must decide where scarce land, food, and exemption from tax and conscription will be granted."
 sp_muhacir.1.f:0 "They leave the steppe with little but the hope that Rumelia or Anatolia will keep them."
 sp_muhacir.1.a:0 "Settle them chiefly in Rumelia."
 sp_muhacir.1.b:0 "Direct them toward the Anatolian interior."
 sp_muhacir.1.c:0 "Balance Rumelian and Anatolian settlement."
 sp_muhacir.2.t:0 "Circassian Expulsion and Settlement"
 sp_muhacir.2.d:0 "North Caucasian Muslim refugees press upon Ottoman harbors and frontiers. The Muhacirin Commission must choose settlement geography and bear the treasury cost of inland placement."
 sp_muhacir.2.f:0 "The Caucasus empties; the Porte must decide whether the Balkans or Anatolia will absorb the shock."
 sp_muhacir.2.a:0 "Focus settlement in Rumelia."
 sp_muhacir.2.b:0 "Focus settlement in Anatolia."
 sp_muhacir.2.c:0 "Pursue a balanced historical distribution."
 sp_muhacir.2.e:0 "Delay inland settlement and leave landing camps."
 sp_muhacir.3.t:0 "Rumelian Refugee Crisis"
 sp_muhacir.3.d:0 "War and territorial loss drive Muslim populations from the Balkans toward remaining Ottoman soil. Conservation of Turkish, Tatar, and Circassian refugees must be managed without inventing new settlers."
 sp_muhacir.3.f:0 "Those who once settled Rumelia now flee it."
 sp_muhacir.3.a:0 "Concentrate emergency reception near the capital."
 sp_muhacir.3.b:0 "Disperse refugees into Anatolia."
 sp_je_muhacirin_komisyonu:0 "Muhacirin Commission"
 sp_je_muhacirin_komisyonu_desc:0 "A temporary Ottoman commission organizes reception, transport, tax exemption, and inland settlement of Muslim refugees. It strains the treasury and bureaucracy while active."
 sp_je_umum_muhacir:0 "General Muhacir Commission"
 sp_je_umum_muhacir_desc:0 "An emergency commission handles the Rumelian refugee crisis: transport, temporary relief, and resettlement into safer Anatolian provinces."
 sp_i12_commission_wave_a:0 "Muhacir Reception Costs"
 sp_i12_commission_wave_b_rumelia:0 "Circassian Rumelian Settlement Costs"
 sp_i12_commission_wave_b_anatolia:0 "Circassian Anatolian Settlement Costs"
 sp_i12_commission_wave_b_balanced:0 "Circassian Settlement Costs"
 sp_i12_commission_wave_b_refuse:0 "Landing Camp Relief Costs"
 sp_i12_commission_wave_c:0 "Rumelian Refugee Relief"
 sp_i12_exemption_rumelia:0 "Muhacir Tax and Conscription Exemption (Rumelia)"
 sp_i12_exemption_anatolia:0 "Muhacir Tax and Conscription Exemption (Anatolia)"
 sp_i12_exemption_wave_c_anatolia:0 "Emergency Refugee Settlement Relief"
 sp_i12_rumelia_settlement_friction:0 "Muhacir Settlement Friction"
 sp_i12_landing_camp_modifier:0 "Refugee Landing Camps"
 sp_i12_eastern_thrace_refugee_camp:0 "Capital Refugee Congestion"
 sp_je_muhacirin_komisyonu_reason:0 "The Muhacirin Commission remains active while refugee reception and inland settlement are organized."
 sp_je_umum_muhacir_reason:0 "The emergency muhacir commission remains active during the Rumelian refugee crisis."
