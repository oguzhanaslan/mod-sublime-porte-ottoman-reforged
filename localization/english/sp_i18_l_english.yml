l_english:
 sp_i18.1.t:0 "After the Tanzimat"
 sp_i18.1.d:0 "The first wave of Tanzimat reform has already recast offices, schools, or the army. What remains unsettled is not whether the empire must change, but who will govern that change: the reforming ministers of the Porte, or the palace's unshared prerogative."
 sp_i18.1.f:0 "Tanzimat opened the door. It did not decide who would walk through it."
 sp_i18.1.a:0 "Hear the reformers of the Porte"
 sp_i18.1.b:0 "Uphold the sultan's prerogative"
 sp_i18.2.t:0 "The Young Ottomans"
 sp_i18.2.d:0 "A circle of writers and officials in the capital now argues, in journals and private salons, that reform without representation leaves the empire half-finished. They are a press and a conversation, not a ministry and not a new court party. The Porte must decide whether to tolerate their newspapers or warn that agitation will not be indulged."
 sp_i18.2.f:0 "The argument is about how power is constituted, not the appointment of any one man."
 sp_i18.2.a:0 "Tolerate the new press"
 sp_i18.2.b:0 "Warn the Porte against agitation"
 sp_i18.3.t:0 "The Assembly and the Sovereign"
 sp_i18.3.d:0 "The empire has adopted a law of representation. Deputies will sit, and the sovereign remains on the throne. This is not a borrowed European slogan and not yet a named constitution; it is the Porte's own settlement of how power is to be shared."
 sp_i18.3.f:0 "The law is already passed. What remains is to live with it."
 sp_i18.3.a:0 "The Meclis will sit beside the throne"
 sp_i18.4.t:0 "The Kanun-i Esasi"
 sp_i18.4.d:0 "The franchise already in force can now bear its historical name. The Kanun-i Esasi does not create a new law of the land today; it names the constitutional order the empire has already chosen, with the sultan still on the throne and an assembly claiming a share of government."
 sp_i18.4.f:0 "The name follows the fact. The fact was made by law."
 sp_i18.4.a:0 "Proclaim the Kanun-i Esasi"
 sp_i18.5.t:0 "Parliamentary Life Suspended"
 sp_i18.5.d:0 "Having once admitted representation, the Porte now recentralizes authority in the palace. Deputies are sent home; the sultan's government will rule without a sitting assembly. This is a reversal of an order already tried, not the making of a new dynasty."
 sp_i18.5.f:0 "The chamber is closed. The palace is not."
 sp_i18.5.a:0 "Govern from the palace"
 sp_i18_reform_debate:0 "Reform Debate"
 sp_i18_palace_prerogative:0 "Palace Prerogative"
 sp_i18_young_ottoman_press:0 "Young Ottoman Press"
 sp_i18_young_ottoman_warning:0 "Warning Against Agitation"
 sp_i18_hamidian_restoration:0 "Authority Restored to the Palace"
