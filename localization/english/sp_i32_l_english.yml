 # Wave E — Primary European Partner
 sp_i32_btn_primary_partner: "Primary European Partner"
 sp_i32_btn_primary_partner_desc: "Name a preferred European partner for learning programmes. The first choice is free. Later changes cool relations with the dumped partner and take eighteen months to reverse.\n\nProgrammes with that partner cost less upfront, carry a lighter stipend, and finish a year sooner. Other partners remain available at full price."
