 sp_je_learning_from_europe: "Learning from Europe"
 sp_je_learning_from_europe_reason: "The Sublime Porte sends students abroad and invites European expertise to strengthen the empire. These costly programmes remain separate from the Tanzimat.\n\nCapacity begins at 2, rises to 3 with a staffed university or twelve consecutive months of surplus bureaucracy, and reaches 4 once domestic expertise is established. Every active programme uses one place. Existing military assistance reserves the military place until its treaty expires."

 sp_je_learning_from_europe_status_students_fra_ma: "Students are studying in France. Prussian military assistance remains active and reserves the military programme."
 sp_je_learning_from_europe_status_students_gbr_ma: "Students are studying in Britain. Prussian military assistance remains active and reserves the military programme."
