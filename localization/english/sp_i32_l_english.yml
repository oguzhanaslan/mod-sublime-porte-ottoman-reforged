 sp_i32_opinion_moltke: "Prussian Military Assistance — Chief Adviser Helmuth von Moltke"

 sp_i32.12.t: "Which Land Mission?"
 sp_i32.12.d: "With the military programme free of treaty assistance, the Porte may invite a European staff mission. Prussia or Germany offers the deepest staff package; France academies and artillery when the Egyptian crisis does not bar them; Britain a limited observation path only with Britain as primary partner and no naval programme; Austria a secondary organization path. The treasury pays on departure."
 sp_i32.12.f: "Maps, drills, and translations arrive before the men who can teach them."
 sp_i32.12.ger: "Prussia / Germany — Staff Reform"
 sp_i32.12.fra: "France — Academies & Artillery"
 sp_i32.12.gbr: "Britain — Limited Staff Observation"
 sp_i32.12.aus: "Austria — Organization & Artillery"
 sp_i32.12.none: "Not this year"

 sp_i32.33.t: "End the Military Mission?"
 sp_i32.33.d: "Cancelling now ends the stipend, but the partner will take offense. Staff work unfinished will not yield completion rewards."
 sp_i32.33.f: "Advisers can be dismissed. Reputations travel farther than steamers."
 sp_i32.33.a: "End the mission"
 sp_i32.33.b: "Let the mission continue"

 sp_i32.43.t: "The Military Mission Ends"
 sp_i32.43.d: "The staff depart. What they leave behind briefly strengthens qualifications and Armed Forces attraction. The pulse is short; the treaty-era bonuses are not repeated."
 sp_i32.43.f: "Drill books close. The argument over whose methods remain does not."
 sp_i32.43.a: "Institutionalize the results"

 sp_i32.53.t: "Trouble with the Military Mission"
 sp_i32.53.d: "The land military mission is not proceeding as planned. Work continues, but on harder terms."
 sp_i32.53.d_dispute: "Friction with the foreign staff has cooled Armed Forces approval for a time."
 sp_i32.53.d_delay: "Surveys, language, or partner politics have stretched the timetable. The mission will last longer than planned."
 sp_i32.53.d_overrun: "Pay, lodging, or equipment have overrun the budget. Extra costs will weigh on the treasury for a time."
 sp_i32.53.f: "A quarrel over drill can delay a season."
 sp_i32.53.a: "We will manage it"

