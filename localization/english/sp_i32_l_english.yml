l_english:
 sp_je_learning_from_europe: "Learning from Europe"
 sp_je_learning_from_europe_reason: "The Porte already sends students and hosts European advisers. This journal tracks that practice: costly, limited, and independent of Tanzimat. It does not complete or fail on its own.\n\nProgramme capacity is 2 by default, 3 after a staffed university or twelve consecutive months of bureaucracy surplus, and 4 only with established domestic expertise. Inherited military assistance occupies the military programme. This journal never grants a second Moltke or treaty bonus."

 sp_je_learning_from_europe_status_students_fra_ma: "Students are abroad in France. Prussian military assistance is already in force and occupies the military programme. This journal adds no second military bonus."
 sp_je_learning_from_europe_status_students_gbr_ma: "Students are abroad in Britain. Prussian military assistance is already in force and occupies the military programme. This journal adds no second military bonus."
 sp_je_learning_from_europe_status_students_ger_ma: "Students are abroad in Germany. Military assistance is already in force and occupies the military programme. This journal adds no second military bonus."
 sp_je_learning_from_europe_status_students_pru_ma: "Students are abroad in Prussia. Prussian military assistance is already in force and occupies the military programme. This journal adds no second military bonus."
 sp_je_learning_from_europe_status_students_aus_ma: "Students are abroad in Austria. Prussian military assistance is already in force and occupies the military programme. This journal adds no second military bonus."
 sp_je_learning_from_europe_status_students_fra: "Students abroad: France. The programme is underway. Returning cadres will be assigned when it ends."
 sp_je_learning_from_europe_status_students_gbr: "Students abroad: Britain. The programme is underway. Returning cadres will be assigned when it ends."
 sp_je_learning_from_europe_status_students_ger: "Students abroad: Germany. The programme is underway. Returning cadres will be assigned when it ends."
 sp_je_learning_from_europe_status_students_pru: "Students abroad: Prussia. The programme is underway. Returning cadres will be assigned when it ends."
 sp_je_learning_from_europe_status_students_aus: "Students abroad: Austria. The programme is underway. Returning cadres will be assigned when it ends."
 sp_je_learning_from_europe_status_ma_moltke: "Prussian military assistance is already in force. Helmuth von Moltke serves with that treaty mission. This journal presents it; it grants no extra Moltke modifier."
 sp_je_learning_from_europe_status_ma_post_moltke: "Prussian instructors remain under the existing military-assistance treaty (post-Moltke). The military programme stays occupied until that treaty ends. This journal adds no second military bonus."
 sp_je_learning_from_europe_status_students_cooldown: "The students-abroad programme is on cooldown after the last cohort. A new group cannot be sent until that interval expires."
 sp_je_learning_from_europe_status_cap4: "No students are abroad. Programme capacity: 4. A new students programme can be started if gold and diplomacy allow it."
 sp_je_learning_from_europe_status_cap3: "No students are abroad. Programme capacity: 3. A new students programme can be started if gold and diplomacy allow it."
 sp_je_learning_from_europe_status_cap2: "No students are abroad. Programme capacity: 2. Inherited military assistance already uses one programme; students abroad can still be started as the second."

 sp_i32_btn_send_students: "Send Students Abroad"
 sp_i32_btn_send_students_desc: "Dispatch a student mission to France, Britain, Prussia or Germany, or Austria. The destination choice sets the treasury cost. While they remain abroad, a stipend and bureaucracy burden apply as part of the programme modifier.\n\n#bold Capacity:#! 2 programmes by default; 3 after a staffed university or twelve consecutive months of bureaucracy surplus; 4 only with established domestic expertise.\nThis does not grant combat power, construction, or raw research speed."
 sp_i32_btn_send_students_effect_tt: "Opens destination selection. The chosen host applies the treasury cost shown below."

 sp_i32_btn_cancel_students: "Halt Students Programme"
 sp_i32_btn_cancel_students_desc: "Recall the students before the programme ends. The host takes offense and the active effects end. Gold already spent is not refunded."
 sp_i32_btn_cancel_students_effect_tt: "Confirm cancelling the students-abroad programme"

 sp_i32_students_not_active_tt: "Only one students-abroad programme may run at a time"
 sp_i32_students_cooldown_tt: "The students-abroad programme is not on cooldown"
 sp_i32_capacity_allows_tt: "Programme capacity has not been reached"
 sp_i32_students_destination_tt: "At least one eligible European destination exists"
 sp_i32_students_cancel_possible_tt: "A students-abroad programme is active and not already completing"
 sp_i32_students_complete_cooldown_tt: "This programme cannot be restarted for 2 years"
 sp_i32_students_cancel_cooldown_tt: "This programme cannot be restarted for 1 year"
 sp_i32_students_no_refund_tt: "Gold already spent is not refunded"
 sp_i32_students_extend_year_tt: "The students remain abroad for an extra year"

 sp_i32_students_fra_diplo_tt: "France exists, is not at war with us, has better than Poor relations, and is not hostile in attitude"
 sp_i32_students_gbr_diplo_tt: "Great Britain exists, is not at war with us, has better than Poor relations, and is not hostile in attitude"
 sp_i32_students_german_diplo_tt: "Germany, or Prussia if Germany does not exist, is an eligible host: not at war, better than Poor relations, and not hostile in attitude"
 sp_i32_students_aus_diplo_tt: "Austria exists, is not at war with us, has better than Poor relations, and is not hostile in attitude"

 sp_i32_spb_students: "Students Abroad"
 sp_i32_spb_students_desc: "Time remaining on the student mission."
 sp_i32_spb_students_second: "Students remain abroad until the programme timer ends."
 sp_i32_spb_students_tick: "Monthly progress of the students-abroad programme"
 sp_i32_spb_military: "Military Assistance"
 sp_i32_spb_military_desc: "An incoming military-assistance treaty occupies the military programme. This lamp does not count down; vanilla treaty effects remain authoritative."
 sp_i32_spb_military_second: "Vanilla treaty effects remain in force until the article ends."

 sp_i32_students_fra_act: "Students in France"
 sp_i32_students_fra_act_desc: "Ottoman students are studying in France. Society learning and qualifications improve while a stipend and bureaucracy weigh on the state, and the Intelligentsia approve."
 sp_i32_students_gbr_act: "Students in Britain"
 sp_i32_students_gbr_act_desc: "Ottoman students are studying in Britain. Production learning and qualifications improve while a stipend and bureaucracy weigh on the state, and the Industrialists approve."
 sp_i32_students_pru_act_spread: "Students in Prussia"
 sp_i32_students_pru_act_spread_desc: "Ottoman students are studying in Prussia. Military learning and qualifications improve. Used only when no incoming military assistance already owns that spread."
 sp_i32_students_pru_act_qual_only: "Students in Prussia"
 sp_i32_students_pru_act_qual_only_desc: "Ottoman students are studying in Prussia. Qualifications improve, but military technology spread is left to the existing assistance treaty. The Armed Forces still approve the exchange."
 sp_i32_students_aus_act: "Students in Austria"
 sp_i32_students_aus_act_desc: "Ottoman students are studying in Austria. Society learning and administration improve at a lighter stipend and bureaucracy cost."

 sp_i32_students_complete_state: "Returning Cadres: State Service"
 sp_i32_students_complete_state_desc: "Returned students strengthen state administration."
 sp_i32_students_complete_schools: "Returning Cadres: Schools and Universities"
 sp_i32_students_complete_schools_desc: "Returned students strengthen schools and universities."
 sp_i32_students_complete_technical: "Returning Cadres: Technical Institutions"
 sp_i32_students_complete_technical_desc: "Returned students strengthen technical institutions."
 sp_i32_students_complete_military: "Returning Cadres: Military Institutions"
 sp_i32_students_complete_military_desc: "Returned students strengthen military schools and staff offices."

 sp_i32_students_overrun: "Student Stipend Overrun"
 sp_i32_students_overrun_desc: "The student mission is costing more than intended."
 sp_i32_students_overrun_aus: "Student Stipend Overrun"
 sp_i32_students_overrun_aus_desc: "The Austrian student mission is costing more than intended."
 sp_i32_students_radicals: "Returning Radicals"
 sp_i32_students_radicals_desc: "Some returned students have brought unsettling political ideas. The Intelligentsia draw strength from them; the Devout do not."

 sp_i32.11.t: "Where Shall We Send Them?"
 sp_i32.11.d: "The Translation Office and the ministries can spare a cohort, but not four at once. France offers administration and letters; Britain, industry and engineering; Prussia the staff school; Austria a nearer academy. The treasury pays on departure, and a stipend follows them every week they remain abroad."
 sp_i32.11.f: "A list of names sits beside a list of ports. Someone will have to sign both."
 sp_i32.11.fra: "France — Education & Administration"
 sp_i32.11.gbr: "Britain — Industry & Engineering"
 sp_i32.11.ger: "Prussia / Germany — Military Education"
 sp_i32.11.aus: "Austria — Administration & Organization"
 sp_i32.11.none: "Not this year"

 sp_i32.30.t: "Recall the Students?"
 sp_i32.30.d: "Halting the mission now saves the remaining stipend, but the host will take it as a slight. Cadres already abroad will not complete their course."
 sp_i32.30.f: "Steamers can be turned around. Reputations cannot."
 sp_i32.30.a: "Recall them"
 sp_i32.30.b: "Let the programme continue"

 sp_i32.40.t: "The Students Return"
 sp_i32.40.d: "The cohort is home. Their notebooks will gather dust unless the Porte puts them to work. State service, schools, technical offices, or military institutions — each path is a short pulse of capacity, not a permanent privilege."
 sp_i32.40.f: "They have seen another country's order. The question is where that order will sit in ours."
 sp_i32.40.state: "Place them in state service"
 sp_i32.40.schools: "Place them in schools and universities"
 sp_i32.40.technical: "Place them in technical institutions"
 sp_i32.40.military: "Place them in military institutions"

 sp_i32.50.t: "Trouble with the Students Abroad"
 sp_i32.50.d: "Reports from the mission are uneven. The programme continues, but it will not do so on the terms we budgeted."
 sp_i32.50.d_overrun: "The stipend does not cover what the students actually spend. Extra costs will weigh on the treasury for a time."
 sp_i32.50.d_delay: "Examinations, illness, or a closed academy have stretched the course. They will remain abroad longer than planned."
 sp_i32.50.d_remain: "The host has asked them to stay on. An extra stretch abroad will cost time."
 sp_i32.50.d_radicals: "Some of the students have come home early in spirit: more political, less patient. The Intelligentsia will draw strength from them; the Devout will not."
 sp_i32.50.f: "A letter can be answered. A fashion of thought is harder."
 sp_i32.50.a: "We will manage it"
