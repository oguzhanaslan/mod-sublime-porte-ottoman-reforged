 sp_je_learning_from_europe_status_technical_cooldown: "The technical-mission programme is on cooldown after the last engagement. A new mission cannot begin until that interval expires."
 sp_je_learning_from_europe_status_education_cooldown: "Education cooperation is on cooldown after the last programme. A new focus cannot begin until that interval expires."
 sp_je_learning_from_europe_status_cap4: "No programme is active. Programme capacity: 4. A new programme can be started if gold and diplomacy allow it."
 sp_je_learning_from_europe_status_cap3: "No students are abroad. Programme capacity: 3. A new programme can be started if gold and diplomacy allow it."
 sp_je_learning_from_europe_status_cap2: "No students are abroad. Programme capacity: 2. Inherited military assistance already uses one programme; students abroad can still be started as the second."

 sp_i32_btn_send_students: "Send Students Abroad"
 sp_i32_btn_send_students_desc: "Send a cohort to France, Britain, Prussia or Germany, or Austria. The destination determines the initial cost; stipends and administration remain due while the students are abroad.\n\n#bold Capacity:#! 2 programmes by default; 3 with a staffed university or twelve consecutive months of surplus bureaucracy; 4 with established domestic expertise."
 sp_i32_btn_send_students_effect_tt: "Opens destination selection. The chosen host applies the treasury cost shown below."

 sp_i32_btn_cancel_students: "Halt Students Programme"
 sp_i32_btn_cancel_students_desc: "Recall the students before the programme ends. The host takes offense and the active effects end. Gold already spent is not refunded."
 sp_i32_btn_cancel_students_effect_tt: "Confirm cancelling the students-abroad programme"

 sp_i32_btn_send_technical: "Launch Technical Mission"
 sp_i32_btn_send_technical_desc: "Invite European engineers to advise on railways, mining, shipyards, or machinery. Requires mechanical tools, the atmospheric engine, or a university, and a partner with at least Neutral relations. The initial payment is followed by continuing stipends and administrative costs."
 sp_i32_btn_send_technical_effect_tt: "Opens specialization and partner selection. The treasury cost is shown below."

 sp_i32_btn_cancel_technical: "Halt Technical Mission"
 sp_i32_btn_cancel_technical_desc: "End the technical mission early. The partner takes offense and active effects end. Gold already spent is not refunded."
 sp_i32_btn_cancel_technical_effect_tt: "Confirm cancelling the technical mission"

 sp_i32_btn_send_education: "Begin Education Cooperation"
 sp_i32_btn_send_education_desc: "Deepen school and institutional cooperation with Europe. Requires schools investment and either a staffed university or sufficient literacy. Choose Expand, Limit, or Integrate — each locks a different political and administrative path.\n\nExpand is blocked while the Tanzimat education reorganization modifier is still active."
 sp_i32_btn_send_education_effect_tt: "Opens focus and partner selection. The treasury cost is shown below."

 sp_i32_btn_cancel_education: "Halt Education Cooperation"
 sp_i32_btn_cancel_education_desc: "End education cooperation early. The partner takes offense and active effects end. Gold already spent is not refunded."
 sp_i32_btn_cancel_education_effect_tt: "Confirm cancelling education cooperation"

