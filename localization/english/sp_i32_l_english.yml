 sp_i32.11.t: "Where Shall We Send Them?"
 sp_i32.11.d: "The Translation Office and the ministries can spare a cohort, but not four at once. France offers administration and letters; Britain, industry and engineering; Prussia the staff school; Austria a nearer academy. The treasury pays on departure, and a stipend follows them every week they remain abroad."
 sp_i32.11.f: "A list of names sits beside a list of ports. Someone will have to sign both."
 sp_i32.11.fra: "France — Education & Administration"
 sp_i32.11.gbr: "Britain — Industry & Engineering"
 sp_i32.11.ger: "Prussia / Germany — Military Education"
 sp_i32.11.aus: "Austria — Administration & Organization"
 sp_i32.11.none: "Not this year"

 sp_i32.13.t: "Which Technical Path?"
 sp_i32.13.d: "Engineers can be invited for railways, mines, yards, or machinery. Britain and France dominate most paths; German industry suits machinery. Partners must be Neutral or better. The treasury pays on departure."
 sp_i32.13.f: "Plans and gauges arrive before the men who can read them."
 sp_i32.13.rail_gbr: "Railways — Britain"
 sp_i32.13.rail_fra: "Railways — France"
 sp_i32.13.mining_fra: "Mining — France"
 sp_i32.13.mining_gbr: "Mining — Britain"
 sp_i32.13.ship_gbr: "Shipyards — Britain"
 sp_i32.13.ship_fra: "Shipyards — France"
 sp_i32.13.mach_gbr: "Machinery — Britain"
 sp_i32.13.mach_german: "Machinery — Prussia / Germany"
 sp_i32.13.none: "Not this year"

 sp_i32.14.t: "How Shall We Shape the Schools?"
 sp_i32.14.d: "Expand European-style schooling, limit the exchange to technical and military schools, or integrate methods into existing institutions. Each path locks politics and administration for years. France is the natural partner for Expand; Limit may also look to Germany; Integrate may look to Austria."
 sp_i32.14.f: "A curriculum is also a factional map."
 sp_i32.14.expand_fra: "Expand — France"
 sp_i32.14.limit_fra: "Limit — France"
 sp_i32.14.limit_german: "Limit — Prussia / Germany"
 sp_i32.14.integrate_aus: "Integrate — Austria"
 sp_i32.14.integrate_fra: "Integrate — France"
 sp_i32.14.none: "Not this year"

 sp_i32.30.t: "Recall the Students?"
 sp_i32.30.d: "Halting the mission now saves the remaining stipend, but the host will take it as a slight. Cadres already abroad will not complete their course."
 sp_i32.30.f: "Steamers can be turned around. Reputations cannot."
 sp_i32.30.a: "Recall them"
 sp_i32.30.b: "Let the programme continue"

 sp_i32.31.t: "End the Technical Mission?"
 sp_i32.31.d: "Cancelling now ends the stipend, but the partner will take offense. Work unfinished will not yield completion rewards."
 sp_i32.31.f: "Contracts can be torn up. Goodwill is harder to rewrite."
 sp_i32.31.a: "End the mission"
 sp_i32.31.b: "Let the mission continue"

 sp_i32.32.t: "End Education Cooperation?"
 sp_i32.32.d: "Cancelling now ends the programme, but the partner will take offense. Institutional work unfinished will not yield completion rewards."
 sp_i32.32.f: "A school year can be abandoned. A reputation cannot."
 sp_i32.32.a: "End cooperation"
 sp_i32.32.b: "Let cooperation continue"

 sp_i32.40.t: "The Students Return"
 sp_i32.40.d: "The students are home. Their notebooks will gather dust unless the Porte puts them to work. State service, schools, technical offices, or military institutions — each path is a short pulse of capacity, not a permanent privilege."
 sp_i32.40.f: "They have seen another country's order. The question is where that order will sit in ours."
 sp_i32.40.state: "Place them in state service"
 sp_i32.40.schools: "Place them in schools and universities"
 sp_i32.40.technical: "Place them in technical institutions"
 sp_i32.40.military: "Place them in military institutions"

 sp_i32.41.t: "The Technical Mission Ends"
 sp_i32.41.d: "The engineers depart. What they leave behind can strengthen qualifications broadly, or be concentrated in university institutes. Either way the pulse is short."
 sp_i32.41.f: "Blueprints without a place to hang them are only paper."
 sp_i32.41.qual: "Spread the expertise into qualifications"
 sp_i32.41.uni: "Concentrate it in technical institutes"

 sp_i32.42.t: "Education Cooperation Concludes"
 sp_i32.42.d: "The chosen focus has run its course. A short pulse follows: wider school access after Expand, qualifications after Limit, or administration after Integrate."
 sp_i32.42.f: "The classrooms quiet. The argument over what they taught does not."
 sp_i32.42.a: "Institutionalize the results"

 sp_i32.50.t: "Trouble with the Students Abroad"
 sp_i32.50.d: "Reports from the mission are uneven. The programme continues, but it will not do so on the terms we budgeted."
 sp_i32.50.d_overrun: "The stipend does not cover what the students actually spend. Extra costs will weigh on the treasury for a time."
 sp_i32.50.d_delay: "Examinations, illness, or a closed academy have stretched the course. They will remain abroad longer than planned."
 sp_i32.50.d_remain: "The host has asked them to stay on. An extra stretch abroad will cost time."
 sp_i32.50.d_radicals: "Some of the students have come home early in spirit: more political, less patient. The Intelligentsia will draw strength from them; the Devout will not."
 sp_i32.50.f: "A letter can be answered. A fashion of thought is harder."
 sp_i32.50.a: "We will manage it"

 sp_i32.51.t: "Trouble with the Technical Mission"
 sp_i32.51.d: "The technical mission is not proceeding as planned. Work continues, but on harder terms."
 sp_i32.51.d_overrun: "Equipment, wages, or freight have overrun the budget. Extra costs will weigh on the treasury for a time."
 sp_i32.51.d_delay: "Shipments, surveys, or partner politics have stretched the timetable. The mission will last longer than planned."
 sp_i32.51.d_forced_sink: "The work has narrowed toward institutes and schools of engineering. On completion, returning expertise must be concentrated there."
 sp_i32.51.f: "Rust and paperwork arrive on the same steamer."
 sp_i32.51.a: "We will manage it"

 sp_i32.52.t: "Trouble with Education Cooperation"
 sp_i32.52.d: "The education programme faces resistance or delay. Cooperation continues, but not on the terms we budgeted."
 sp_i32.52.d_bur_resist: "Officials are obstructing the reforms. Extra bureaucracy will weigh on the state for a time."
 sp_i32.52.d_radicals: "Some of those trained under the programme have become more political and less patient. The Intelligentsia will draw strength from them; the Devout will not."
 sp_i32.52.d_delay: "Examinations, staffing, or partner politics have stretched the timetable. Cooperation will last longer than planned."
 sp_i32.52.d_overrun: "The programme is costing more than intended. Extra expenses will weigh on the treasury for a time."
 sp_i32.52.f: "A syllabus can be amended. A faction cannot."
 sp_i32.52.a: "We will manage it"
