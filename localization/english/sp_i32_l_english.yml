 sp_i32.15.t: "Which Industrial Partner?"
 sp_i32.15.d: "With mechanical tools and a domestic industrial foothold, the Porte may invite European industrial advisers. Britain, France, or Prussia or Germany can host. The treasury pays on departure."
 sp_i32.15.f: "Plans for mills arrive before the men who can keep them running."
