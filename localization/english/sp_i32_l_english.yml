 sp_je_learning_from_europe_status_students_aus: "Students abroad: Austria. The programme is underway. Returning cadres will be assigned when it ends."
 sp_je_learning_from_europe_status_technical_fra: "A technical mission is underway with France. Production learning and qualifications improve while the stipend and bureaucracy weigh on the state."
 sp_je_learning_from_europe_status_technical_gbr: "A technical mission is underway with Britain. Production learning and qualifications improve while the stipend and bureaucracy weigh on the state."
 sp_je_learning_from_europe_status_technical_ger: "A technical mission is underway with Germany. Production learning and qualifications improve while the stipend and bureaucracy weigh on the state."
 sp_je_learning_from_europe_status_technical_pru: "A technical mission is underway with Prussia. Production learning and qualifications improve while the stipend and bureaucracy weigh on the state."
