 sp_i32.20.t: "Primary European Partner"
 sp_i32.20.d: "The Porte may lean toward one European capital for learning programmes. The first designation is free. Changing later cools relations with the dumped partner and locks the choice for eighteen months. Preferential rates apply only to programmes started with the named partner; others remain at full price."
 sp_i32.20.f: "A lean is not an alliance. It is a habit of the purse and the timetable."
