l_english:
 sp_je_tanzimat_reforms: "Tanzimat Reforms"
 sp_je_tanzimat_reforms_reason: "While the Tanzimat is underway, the Sublime Porte may issue further reform decrees. These measures support the wider programme but do not fulfil its principal objectives."
 sp_je_tanzimat_reforms_status_opening: "No named reform decree has yet been issued. Each decree requires a stable government and the weakening of the interest groups that would resist it."
 sp_je_tanzimat_reforms_status_partial: "Some named reform decrees have been issued. Remaining decrees still require political conditions that the conservative opposition cannot block."
 sp_je_tanzimat_reforms_status_complete: "Every available Tanzimat reform decree has been issued or otherwise resolved."

 sp_i24_abolish_cizye_button: "Abolish the Cizye"
 sp_i24_abolish_cizye_button_desc: "End the named poll tax levied on non-Muslim subjects. The Devout must leave government, and the Porte must command enough legitimacy to carry the decree. Conservative landowners will also resent the loss of a communal fiscal distinction.\n\n#bold Requires:#! government legitimacy of at least 60, and the Devout out of government.\n#bold Result:#! a five-year reduction in religious tax, small loyalist gains among Christian and Jewish communities, Devout approval −3, Landowners approval −2.\nThis does not complete a Tanzimat objective."
 sp_i24_reform_ciftlik_button: "Reform the Çiftlik System"
 sp_i24_reform_ciftlik_button_desc: "Curtail the old provincial agrarian order that lets landed notables mediate tax and local power. This is not the Land Code event, and it does not grant agricultural output.\n\n#bold Requires:#! government legitimacy of at least 60, and the Landowners either out of government or no longer powerful.\n#bold Result:#! five years of modest bureaucracy and tax-capacity, a very small loyalist gain among peasants, and Landowners approval −4.\nThis does not complete a Tanzimat objective."
 sp_i24_reorganize_education_button: "Reorganize Imperial Education"
 sp_i24_reorganize_education_button_desc: "Place existing schools under a more regular imperial administration. This does not found a new education institution or enact an education law by itself; a schools law other than No Schools must already be in force.\n\n#bold Requires:#! government legitimacy of at least 60, the Devout out of government, and an education law other than No Schools.\n#bold Result:#! five years of small education access and bureaucracy, Devout approval −3, Intelligentsia approval +2.\nThis does not complete the Tanzimat education objective."
 sp_i24_suppress_slave_markets_button: "Suppress the Slave Markets"
 sp_i24_suppress_slave_markets_button_desc: "Close the public slave markets of the capital and provincial towns. This does not ban slavery as a law; the slavery law must still be changed through ordinary enactment if the Porte wants Slavery Banned.\n\n#bold Requires:#! government legitimacy of at least 60, and the Landowners out of government. Hidden if slavery is already banned.\n#bold Result:#! five years of reduced slave imports, a small prestige gain, Landowners and Devout disapproval, Intelligentsia approval, and a shift in public agitation against the slave trade. That pressure only registers if the relevant political movements already exist.\nThis does not complete a Tanzimat objective."

 sp_i24_legitimacy_60_tt: "Government legitimacy is at least 60"
 sp_i24_devout_out_of_government_tt: "The Devout are not in government"
 sp_i24_landowners_out_of_government_tt: "The Landowners are not in government"
 sp_i24_landowners_resistance_weak_tt: "The Landowners are not in government, or are no longer powerful"
 sp_i24_has_education_law_tt: "An education law other than No Schools is in force"
 sp_i24_no_tanzimat_point_tt: "This decree does not grant a Tanzimat objective point."
 sp_i24_cizye_complete_tt: "The cizye has been abolished by decree"
 sp_i24_ciftlik_complete_tt: "The çiftlik order has been reformed by decree"
 sp_i24_education_complete_tt: "Imperial education has been reorganized by decree"
 sp_i24_slave_markets_complete_tt: "The slave markets have been suppressed, or slavery has already been banned"

 sp_i24_cizye_abolished_mod: "Cizye Abolished"
 sp_i24_cizye_abolished_mod_desc: "The named poll tax on non-Muslim subjects has been abolished by Tanzimat decree. Religious tax revenue falls while conservative elites remain displeased."
 sp_i24_ciftlik_reformed_mod: "Çiftlik Order Reformed"
 sp_i24_ciftlik_reformed_mod_desc: "Provincial landed intermediaries have been curtailed. Administration and tax capacity improve modestly while the Landowners resent the loss of local fiscal power."
 sp_i24_education_reorganized_mod: "Imperial Education Reorganized"
 sp_i24_education_reorganized_mod_desc: "Existing schools have been placed under a more regular imperial administration. Access and bureaucracy improve slightly, at the expense of the Devout."
 sp_i24_slave_markets_suppressed_mod: "Slave Markets Suppressed"
 sp_i24_slave_markets_suppressed_mod_desc: "Public slave markets have been closed by decree. Slave imports fall, prestige rises slightly, and the climate of opinion shifts against the trade. The slavery law itself is unchanged."
