l_english:
 sp_je_imperial_identity: "Ottoman Reborn"
 sp_je_imperial_identity_reason: "After the Tanzimat struggle, the Porte must choose one imperial course: Ottomanism (equal citizenship and constitutional government), Islamism (Caliphate and Muslim geopolitics), or Turkism (unlocking the Turanian Ideal). Only one path can be taken."
 sp_je_hunkar_iskelesi: "Treaty of Hünkâr İskelesi"
 sp_je_hunkar_iskelesi_reason: "Russia presently guarantees Ottoman independence under the Treaty of Hünkâr İskelesi. The arrangement is diplomatic, temporary, and tied to the balance of power on the Bosporus — not a permanent alliance."
 sp_je_hunkar_iskelesi_status_active: "The Russian guarantee remains in force. Historically, its binding term pointed toward a lapse in 1841."
 sp_je_hunkar_iskelesi_status_lapse_window: "The treaty's binding period has reached its historical end. Its lapse will be a matter of diplomacy, not automatic expiry."

 sp_je_eastern_provinces: "The Eastern Provinces"
 sp_je_eastern_provinces_reason: "In Diyarbakır and Mosul, imperial authority still depends on local intermediaries. Extending direct rule will require the central government to overcome entrenched provincial power."
 sp_je_eastern_provinces_status_opening: "The eastern provinces begin the century under uneven central reach and durable local authority."
 sp_je_eastern_provinces_status_local_authority: "Local authority in the eastern provinces remains a visible fact of imperial rule."
 sp_je_eastern_provinces_status_porte_reach: "The Porte is extending its administrative reach into the eastern provinces."
 sp_je_eastern_provinces_status_bedirhan: "The question of Bedirhan Bey has entered the eastern provincial balance."
 sp_je_eastern_provinces_status_bedirhan_accommodated: "The Porte has sought accommodation with Bedirhan Bey rather than open confrontation."
 sp_je_eastern_provinces_status_bedirhan_enforced: "The Porte has pressed direct authority against Bedirhan Bey's local power."
 sp_je_eastern_provinces_status_direct_admin: "Direct provincial administration is being asserted in the eastern core."

 sp_je_post_tanzimat_era: "The Constitutional Question"
 sp_je_post_tanzimat_era_reason: "After the domestic reforms of the Tanzimat, political debate turns toward representation, constitutional order, and the limits of royal prerogative. Reformers and the palace must now decide how power will be shared."
 sp_je_post_tanzimat_era_status_opening: "The empire enters a season in which representation and the constitution are openly debated."
 sp_je_post_tanzimat_era_status_debate: "Reformers and the palace are contesting how power is to be shared after Tanzimat."
 sp_je_post_tanzimat_era_status_young_ottomans: "The Young Ottoman current is shaping public argument over representation and constitutional order."
 sp_je_post_tanzimat_era_status_constitution: "Parliament and the sovereign are being discussed as paired institutions of rule."
 sp_je_post_tanzimat_era_status_kanun_i_esasi: "The Kanun-i Esasi has named a constitutional order within the monarchy."
 sp_je_post_tanzimat_era_status_palace: "Without a franchise, the Porte has closed the Constitutional Question under palace prerogative."
 sp_je_post_tanzimat_era_status_hamidian: "Hamidian restoration has entered the political conversation after prior constitutional experiments."
 sp_je_post_tanzimat_era_complete_kanun: "Kanun-i Esasi has been proclaimed"
 sp_je_post_tanzimat_era_complete_hamidian: "Hamidian restoration has occurred"
 sp_je_post_tanzimat_era_complete_palace: "The palace path has closed the question without a franchise"
