l_english:
 sp_muhacir_flavor.1.t:0 "Miri Land and Village Claims"
 sp_muhacir_flavor.1.d:0 "Commission surveyors mark miri plots for muhacir farms. Local villagers lose pasture and cartage to the new allotments, and the Porte must decide how hard to press the assignment."
 sp_muhacir_flavor.1.f:0 "The land is the state's; the village remembers otherwise."
 sp_muhacir_flavor.1.a:0 "Compensate the villagers."
 sp_muhacir_flavor.1.b:0 "Enforce the assignment."
 sp_muhacir_flavor.1.c:0 "Delay the survey."
 sp_muhacir_flavor.2.t:0 "The Commission's Ledger"
 sp_muhacir_flavor.2.d:0 "Rations, tents, and port transport have overrun the voted muhacir packet. The commission asks for another outlay before camps and inland colonies starve."
 sp_muhacir_flavor.2.d.wave_b:0 "Circassian landings strain every harbor account. Trabzon and the interior routes report overruns far beyond the last appropriation; tents and grain must be found somehow."
 sp_muhacir_flavor.2.f:0 "A ledger may close; a hungry camp does not."
 sp_muhacir_flavor.2.a:0 "Pay from the treasury."
 sp_muhacir_flavor.2.b:0 "Open donations and a local levy."
 sp_muhacir_flavor.2.c:0 "Cut the ration."
 sp_muhacir_flavor.3.t:0 "Villages on the Plateau"
 sp_muhacir_flavor.3.d:0 "Interior muhacir colonies in the Anatolian plateau have taken root. Registers, mosques, and fields speak of settlement that is imperfect but enduring."
 sp_muhacir_flavor.3.f:0 "Neither glory nor collapse—only villages that stay."
 sp_muhacir_flavor.3.a:0 "Register the villages quietly."
 sp_muhacir_flavor.3.b:0 "Publicize the colony."
 sp_muhacir_flavor.3.c:0 "Leave them to themselves."
 sp_muhacir_flavor.4.t:0 "The Capital Cannot Sleep"
 sp_muhacir_flavor.4.d:0 "Rumelian refugees pack Eastern Thrace after the latest flight. Housing, tents, and crowding press the capital aggregate; this is congestion, not a second colonization."
 sp_muhacir_flavor.4.f:0 "The city hears every footfall of those who fled the lost provinces."
 sp_muhacir_flavor.4.a:0 "Send extra tents and rations."
 sp_muhacir_flavor.4.b:0 "Requisition houses."
 sp_muhacir_flavor.4.c:0 "Endure the overcrowding."
 sp_i13_land_dispute:0 "Muhacir Land Dispute"
 sp_i13_ration_strain:0 "Muhacir Ration Levy"
 sp_i13_capital_overcrowding:0 "Capital Refugee Overcrowding"
