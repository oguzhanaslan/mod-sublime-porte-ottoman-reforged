l_english:
 sp_i21.1.t:0 "Eastern Local Authority"
 sp_i21.1.d:0 "Across Diyarbakır and Mosul, the writ of the Porte still runs through emirs, tribal chiefs, and local notables who collect revenue, settle disputes, and raise levies in their own names. The Baban emirate in Sulaymaniyah is one such intermediary among many. This is not yet a question of rebellion, but of who holds practical authority in the eastern provinces."
 sp_i21.1.f:0 "The sultan's name is spoken everywhere. His officers are not."
 sp_i21.1.a:0 "The east is ruled through local hands"
 sp_i21.2.t:0 "The Reach of the Porte"
 sp_i21.2.d:0 "Tanzimat reform is no longer confined to the capital. New tax registers, provincial councils, and the slow extension of government administration are reaching Diyarbakır and Mosul. The Porte's administrative access is widening — not by proclamation alone, but through the same bureaucracy and institutions the empire is building elsewhere."
 sp_i21.2.f:0 "Paper travels east before armies do."
 sp_i21.2.a:0 "Let the reform reach the provinces"
 sp_i21.3.t:0 "Bedirhan: Cooperation or Command"
 sp_i21.3.d:0 "Bedirhan Bey of Bohtan stands among the most powerful local notables of the Diyarbakır countryside. He is not a declared rebel against the throne, but his authority over routes, levies, and local justice rivals that of any governor the Porte might appoint. Ministers must decide whether to integrate such intermediaries or replace them with direct imperial command."
 sp_i21.3.f:0 "A notable who governs like a prince is still, for now, a subject of the sultan."
 sp_i21.3.a:0 "Accommodate local intermediaries"
 sp_i21.3.b:0 "Enforce direct Porte authority"
 sp_i21.4.t:0 "Direct Provincial Administration"
 sp_i21.4.d:0 "The empire has tightened its hold on eastern Anatolia. What historians will call the Kurdistan Eyalet is, in practice, the extension of direct Ottoman provincial administration into Diyarbakır — governors appointed from the Porte, revenue flowing through imperial channels, and local emirates folded into the provincial order. This is central rule, not a grant of self-government."
 sp_i21.4.f:0 "The eyalet bears an old name. The authority is new."
 sp_i21.4.a:0 "Acknowledge direct provincial rule"
