l_english:
 pmg_sp_topkapi_palace:0 "Palace Status"
 pmg_sp_dolmabahce_palace:0 "Palace Status"
 sp_building_topkapi_palace:0 "Topkapı Palace"
 sp_building_topkapi_palace_desc:0 "The historic imperial palace complex on the Seraglio Point: ceremonial dynastic centre, treasury, and remaining administrative-symbolic seat of the Ottoman court."
 sp_building_dolmabahce_palace:0 "Dolmabahçe Palace"
 sp_building_dolmabahce_palace_desc:0 "A modern Bosphorus palace for the imperial court. Completing it is only the beginning; the court must still be transferred from Topkapı."
 sp_pm_topkapi_imperial_complex:0 "Imperial Palace Complex"
 sp_pm_topkapi_former_palace:0 "Former Imperial Palace"
 sp_pm_topkapi_imperial_museum:0 "Imperial Museum"
 sp_pm_dolmabahce_new_palace:0 "New Imperial Palace"
 sp_pm_dolmabahce_imperial_court:0 "Seat of the Imperial Court"
 sp_decision_transfer_imperial_court:0 "Move the Imperial Court to Dolmabahçe"
 sp_decision_transfer_imperial_court_desc:0 "Transfer the ceremonial and administrative seat of the dynasty from the Topkapı complex to Dolmabahçe Palace."
 sp_decision_transfer_imperial_court_tooltip:0 "Topkapı becomes the Former Imperial Palace. Dolmabahçe becomes the Seat of the Imperial Court."
 sp_decision_topkapi_imperial_museum:0 "Open Topkapı as an Imperial Museum"
 sp_decision_topkapi_imperial_museum_desc:0 "Open the former palace complex as an Imperial Museum for collections, display, and cultural prestige."
 sp_decision_topkapi_imperial_museum_tooltip:0 "Topkapı switches from Former Imperial Palace to Imperial Museum."
 sp_i27.1.t:0 "The Court at Dolmabahçe"
 sp_i27.1.d:0 "The imperial household and offices have moved to Dolmabahçe. Topkapı remains on the Seraglio Point as the former palace complex—still a dynastic monument, no longer the seat of daily court."
 sp_i27.1.f:0 "The Bosphorus takes the court. The Point keeps the memory."
 sp_i27.1.a:0 "So it is ordered"
