 sp_i10b.1.t:0 "A Mind for the Defensive Line"
 sp_i10b.1.d:0 "A methodical young staff officer has drawn notice for disciplined planning and an instinct for preserving the army under pressure. Fevzi Çakmak offers patience and professional rigor rather than battlefield spectacle."
 sp_i10b.1.f:0 "Careful preparation can preserve an army when courage alone cannot."
 sp_i10b.1.a:0 "Accept his commission."
 sp_i10b.2.t:0 "An Officer of Uncommon Initiative"
 sp_i10b.2.d:0 "A young officer combines careful staff work with an unusual willingness to revise doctrine and seize opportunity. Mustafa Kemal promises an adaptable and reform-minded approach to command."
 sp_i10b.2.f:0 "Doctrine serves the army best when it can answer changing conditions."
 sp_i10b.2.a:0 "Accept his commission."
 sp_i10b.3.t:0 "Steadfast in Command"
 sp_i10b.3.d:0 "Reports identify a dependable organizer whose troops hold together when plans and morale begin to fail. Kâzım Karabekir brings preparation, reliability, and defensive resolve."
 sp_i10b.3.f:0 "The surest commander is often the one whose formations endure."
 sp_i10b.3.a:0 "Accept his commission."
