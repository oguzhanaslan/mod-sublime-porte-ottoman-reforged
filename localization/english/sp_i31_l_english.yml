l_english:
 sp_je_ottomanism: "The Ottoman Nation"
 sp_je_ottomanism_reason: "Having chosen Ottomanism, the Porte pursues equal citizenship, constitutional government, and a stable multi-ethnic empire. No conquest claims are granted. Reforms must be enacted by the player."
 sp_je_ottomanism_status_stage_1: "Stage I — Equality of the Subjects: enact inclusive citizenship (Racial Segregation, Cultural Exclusion, or Multiculturalism) and Freedom of Conscience or Total Separation."
 sp_je_ottomanism_status_stage_2: "Stage II — Constitutional Government: keep the monarchy with a voting franchise, open the press (Right of Assembly or Protected Speech), and hold legitimacy at least 50."
 sp_je_ottomanism_status_stage_3: "Stage III — The Ottoman Nation: keep inclusive citizenship, hold secession progress below 20%, and avoid widespread incorporated turmoil."
 sp_je_ottomanism_status_stage_4: "Stage IV — A Modern Imperial State: Great Power rank, literacy 35%+, key institutions, legitimacy 60+, inclusive citizenship, and wealth, census, or universal suffrage (landed voting alone is not enough)."
 sp_je_ottomanism_status_final: "The Ottoman Nation path is complete."
 sp_je_ottomanism_complete_tt: "A liberal constitutional Ottoman Empire has been secured."

 sp_je_pan_islamic_unity: "Pan-Islamic Unity"
 sp_je_pan_islamic_unity_reason: "Having chosen Islamism, the Porte strengthens the Caliphate and builds a Muslim geopolitical sphere through claims, subjects, and diplomacy — not free annexation. Christian Great Powers grow wary as the path advances."
 sp_je_pan_islamic_unity_status_stage_1: "Stage I — Strengthen the Caliphate: hold Istanbul and Hedjaz (Mecca and Medina), remain a monarchy under an Islamic church-state order, and keep legitimacy at least 50."
 sp_je_pan_islamic_unity_status_stage_2: "Stage II — Arabia: control Hedjaz, Nejd, Hail, and Yemen (own or through subjects)."
 sp_je_pan_islamic_unity_status_stage_3: "Stage III — Nile and Maghreb: control Lower Egypt, Upper Egypt, and Sinai; at least two of Dongola, Kordofan, and Blue Nile; plus Tripoli and Tunisia (own or subjects)."
 sp_je_pan_islamic_unity_status_stage_4: "Stage IV — Protector of the Muslim World: at least eight Muslim countries aligned as Ottoman subjects, allies, defensive partners, or members of a TUR-led Power Bloc."
 sp_je_pan_islamic_unity_status_final: "The Great Caliphate path is complete."
 sp_je_pan_islamic_unity_complete_tt: "The Great Caliphate objective is realized. The tag remains TUR."

 sp_ottoman_constitutional_empire: "Constitutional Ottoman Empire"
 sp_ottoman_constitutional_empire_desc: "A successful liberal Ottoman constitutional project."
 sp_protector_of_the_faithful: "Protector of the Faithful"
 sp_protector_of_the_faithful_desc: "The Porte completed the Pan-Islamic Unity campaign as Great Caliphate."
 sp_i31_stage_complete_prestige: "Imperial Path Progress"
 sp_i31_stage_complete_prestige_desc: "A stage of a Three Policies grand path has been secured."
 sp_i31_isolation_s2: "Pan-Islamic Suspicion"
 sp_i31_isolation_s2_desc: "Christian Great Powers view Ottoman Pan-Islamic ambition with mild suspicion."
 sp_i31_isolation_s3: "Caliphal Unease"
 sp_i31_isolation_s3_desc: "Christian Great Powers find Ottoman Pan-Islamic expansion diplomatically costly."
 sp_i31_isolation_s4: "Pan-Islamic Hegemon"
 sp_i31_isolation_s4_desc: "A successful Pan-Islamic Ottoman hegemon is difficult for Christian Great Powers to align with."
 sp_i31_muslim_affinity_s2: "Caliphal Prestige"
 sp_i31_muslim_affinity_s2_desc: "Muslim polities notice the Porte's caliphal course."
 sp_i31_muslim_affinity_s3: "Islamic Solidarity"
 sp_i31_muslim_affinity_s3_desc: "Muslim governments are more receptive to Ottoman diplomatic influence."
 sp_i31_muslim_affinity_s4: "Center of the Muslim World"
 sp_i31_muslim_affinity_s4_desc: "The Porte stands as a recognized Pan-Islamic center."
 sp_i31_caliph_support_prestige: "Answered the Caliph's Call"
 sp_i31_caliph_support_prestige_desc: "A Muslim government expressed solidarity with the Caliphate."

 sp_i31o.2.t: "The Ottoman Nation"
 sp_i31o.2.d: "Ottomanist circles open a domestic campaign: equality of subjects, constitutional government, imperial cohesion, and a modern great-power state."
 sp_i31o.2.f: "No claims are issued. Laws must be enacted; turmoil must be managed. Success is a liberal multi-ethnic empire, not conquest."
 sp_i31o.2.a: "Pin the path"
 sp_i31o.2.a_tt: "Begins Stage I — Equality of the Subjects."

 sp_i31o.10.t: "Equality of the Subjects"
 sp_i31o.10.d: "Inclusive citizenship and civic religious law place non-Muslim subjects inside the Ottoman political project."
 sp_i31o.10.f: "Attention turns to constitutional government and representative institutions."
 sp_i31o.10.a: "Toward the constitution"

 sp_i31o.11.t: "Constitutional Government"
 sp_i31o.11.d: "The monarchy now rests on a franchise and a freer press, with enough legitimacy to sustain representative politics."
 sp_i31o.11.f: "The harder test is whether a multi-ethnic empire can remain stable without coercion."
 sp_i31o.11.a: "Build the Ottoman Nation"

 sp_i31o.12.t: "The Ottoman Nation"
 sp_i31o.12.d: "Secession pressure is contained and incorporated turmoil is not rampant. The empire can pursue a modern imperial state."
 sp_i31o.12.f: "Final success still demands democratic franchise beyond landed voting alone, literacy, institutions, and Great Power standing."
 sp_i31o.12.a: "Modernize the Empire"

 sp_i31o.20.t: "A Liberal Ottoman Empire"
 sp_i31o.20.d: "Wealth, census, or universal suffrage; Great Power rank; literacy and institutions; legitimacy and inclusive citizenship — the Ottomanist project is complete."
 sp_i31o.20.f: "This is an alternative-history constitutional empire. The tag remains TUR. No country is renamed."
 sp_i31o.20.a: "The Ottoman Nation endures"
 sp_i31o.20.a_tt: "Gain Constitutional Ottoman Empire. Complete the Ottomanism journal."

 sp_i31i.2.t: "Pan-Islamic Unity"
 sp_i31i.2.d: "Islamist circles open a caliphal campaign: secure the Holy Cities, claim Arabia, consolidate Nile and Maghreb influence, then gather a Muslim geopolitical sphere."
 sp_i31i.2.f: "Claims aid expansion; subjects and diplomacy count. Nothing is annexed for free. Christian Great Powers will grow wary."
 sp_i31i.2.a: "Pin İttihad-ı İslam"
 sp_i31i.2.a_tt: "Begins Stage I — Strengthen the Caliphate."

 sp_i31i.10.t: "The Caliphate Strengthened"
 sp_i31i.10.d: "Istanbul and Hedjaz answer to the Porte or its subjects. Arabia becomes the next objective."
 sp_i31i.10.f: "Claims on Hedjaz, Nejd, Hail, and Yemen are issued where missing."
 sp_i31i.10.a: "Toward Arabia"

 sp_i31i.11.t: "Arabia Secured"
 sp_i31i.11.d: "Hedjaz, Nejd, Hail, and Yemen are under Ottoman ownership or subject control."
 sp_i31i.11.f: "The Nile and Maghreb follow. Claims on lost Egyptian or Sudanese lands are issued only where the Porte no longer holds them through subjects."
 sp_i31i.11.a: "Nile and Maghreb"
 sp_i31i.11.a_tt: "Grants Darfur claim if needed, plus conditional Nile/Sudan claims only for states outside Ottoman or subject control."

 sp_i31i.12.t: "Nile and Maghreb Held"
 sp_i31i.12.d: "Egypt, enough of Sudan, Tripoli, and Tunis answer to the Porte or its subjects."
 sp_i31i.12.f: "The final test is a real Pan-Islamic sphere: subjects, alliances, defensive pacts, or a TUR-led Power Bloc — not mere good relations."
 sp_i31i.12.a: "Protect the Muslim World"

 sp_i31i.20.t: "The Great Caliphate"
 sp_i31i.20.d: "At least eight Muslim countries stand with the Porte as subjects, allies, defensive partners, or members of an Ottoman-led Power Bloc."
 sp_i31i.20.f: "The Great Caliphate is the objective title. The country tag remains TUR. No automatic rename."
 sp_i31i.20.a: "Proclaim the Great Caliphate"
 sp_i31i.20.a_tt: "Gain Protector of the Faithful. Complete Pan-Islamic Unity. Tag stays TUR."

 sp_i31i.30.t: "The Caliph Calls"
 sp_i31i.30.d: "At war with a Christian Great Power, the Porte appeals to independent Muslim governments for solidarity."
 sp_i31i.30.f: "They may support, remain neutral, or reject the call. No government is forced into the war."
 sp_i31i.30.a: "Send the call"
 sp_i31i.30.a_tt: "Up to five eligible Muslim countries receive the Call. Global cooldown: five years. No forced war entry."

 sp_i31i.31.t: "The Caliph Calls"
 sp_i31i.31.d: "The Ottoman Caliphate, at war with a Christian Great Power, asks this government for solidarity."
 sp_i31i.31.f: "Support means diplomatic backing, not an automatic entry into the war."
 sp_i31i.31.a: "Support the Caliph"
 sp_i31i.31.a_tt: "Improve relations with the Ottoman Empire. No forced war join."
 sp_i31i.31.b: "Remain Neutral"
 sp_i31i.31.b_tt: "No diplomatic change."
 sp_i31i.31.c: "Reject the Call"
 sp_i31i.31.c_tt: "Worsen relations with the Ottoman Empire."
