l_english:
 company_sp_sirket_i_hayriye:0 "Şirket-i Hayriye"
 sp_i14.1.t:0 "The Imperial Ottoman Bank"
 sp_i14.1.d:0 "London and Paris houses offer to reorganize the 1856 Ottoman Bank as Bank-ı Osmanî-i Şahane. The 1863 concession would grant Anglo-French capital exclusive note issue and make the bank the Porte's treasury agent—cheaper credit at the price of foreign committees over the mint."
 sp_i14.1.f:0 "A concession may fill the treasury; it also writes London and Paris onto the note."
 sp_i14.1.a:0 "Grant the Anglo-French concession"
 sp_i14.1.b:0 "Keep the treasury in Ottoman hands"
 sp_i14_imperial_ottoman_bank:0 "Imperial Ottoman Bank"
