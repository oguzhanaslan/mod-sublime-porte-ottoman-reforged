 sp_ct_node_placeholder_tt: "Campaign objective"
 sp_ct_tt_tanzimat: "#bold Tanzimat#!\n#I Complete the core reform objectives.#!\n#bold Need#! Bureaucracy, education, army, economy, and separatism.\n#bold Reward#! Unlocks the Constitutional Question."
 sp_ct_tt_post_tanzimat: "#bold The Constitutional Question#!\n#I Representation, constitution, and royal prerogative after reform.#!\n#bold Need#! Domestic Tanzimat reform far enough along.\n#bold Reward#! Political events and temporary modifiers."
 sp_ct_tt_identity: "#bold Three Policies#!\n#I Choose Ottomanism, Islamism, or Turkism.#!\n#bold Need#! The Constitutional Question resolved.\n#bold Reward#! Locks in one policy."
 sp_ct_tt_ottomanism: "#bold Ottomanism#!\n#I Constitutional imperial reform without Turan conquests.#!\n#bold Need#! Ottomanism chosen.\n#bold Reward#! The Ottoman Nation; Constitutional Ottoman Empire."
 sp_ct_tt_islamism: "#bold Islamism#!\n#I Strengthen the Caliphate; Arabia, Nile, Maghreb, and Muslim alignment.#!\n#bold Need#! Islamism chosen.\n#bold Reward#! Pan-Islamic Unity; Protector of the Faithful."
 sp_ct_tt_turkism: "#bold Turkism#!\n#I A national course; the only identity that can open Turan.#!\n#bold Need#! Turkism chosen.\n#bold Reward#! Turanian Ideal once Pan-Nationalism is researched."
 sp_ct_tt_turan: "#bold Turanian Ideal#!\n#I Expand eastward through Azerbaijan, Iran, the Caspian, and Turkestan.#!\n#bold Need#! Turkism; Pan-Nationalism.\n#bold Reward#! Stage claims; Unifier of Turan."
 sp_ct_tt_turan_s1: "#bold Stage I — Azerbaijan#!\n#I Control Azerbaijan, Elizavetpol, Tabriz, and Urmia.#!\n#bold Reward#! Next claims; Stage II."
 sp_ct_tt_turan_s2: "#bold Stage II — Iran#!\n#I Dominate nine plateau states, or hold them through subject Persia.#!\n#bold Reward#! Next claims; Stage III."
 sp_ct_tt_turan_s3: "#bold Stage III — Caspian#!\n#I Control Turkmenia, Merz, Khiva, and Uzbekia.#!\n#bold Reward#! Turkestan claims; Stage IV."
 sp_ct_tt_turan_s4: "#bold Stage IV — Turkestan#!\n#I Control at least eight Central Asian Turkic lands.#!\n#bold Reward#! Great Turan event."
 sp_ct_tt_great_ottoman: "#bold Great Ottoman Empire#!\n#I Remain Ottoman, or proclaim Great Ottoman.#!\n#bold Need#! Stage IV complete.\n#bold Reward#! Unifier of Turan; optional rename."
 sp_ct_tt_constitutional_ottoman: "#bold Constitutional Ottoman Empire#!\n#I Final Ottomanism reward after a modern imperial state.#!\n#bold Reward#! Prestige +15; legitimacy +5."
 sp_ct_tt_great_caliphate: "#bold Great Caliphate#!\n#I Final Islamism reward after Protector of the Muslim World.#!\n#bold Reward#! Prestige +20; legitimacy +5."

