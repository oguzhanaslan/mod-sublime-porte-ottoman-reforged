 # --- Inspector copy (derived from implemented JE/events; no invented history) ---
 sp_ct_insp_tanzimat_desc: "The Sick Man of Europe arc: complete the core Tanzimat journal objectives that stabilize administration, schooling, the army, the economy, and separatism."
 sp_ct_insp_tanzimat_flavor: "Domestic reform is the gate to later political debate and imperial identity. Syria/Egypt content may appear alongside but does not replace a core objective."
 sp_ct_insp_tanzimat_rewards: "Completing the Sick Man main journal marks Tanzimat as finished for Sublime Porte progression (`sick_man_complete`)."

 sp_ct_insp_post_tanzimat_desc: "Informational Post-Tanzimat Era journal and I-18 political flavor: debate, Young Ottomans, constitutional acknowledgement, Kanun-i Esasi naming, and Hamidian suspension."
 sp_ct_insp_post_tanzimat_flavor: "This arc follows argument over representation and royal prerogative after domestic Tanzimat reform. It does not enact new laws by itself."
 sp_ct_insp_post_tanzimat_complete_note: "Arc complete when Hamidian restoration has fired, or when Kanun-i Esasi has fired and the date is 1886.1.1 or later."
 sp_ct_insp_post_tanzimat_rewards: "Timed flavor modifiers from I-18 options; no new institutions. Presentation JE tracks status only."

 sp_ct_insp_identity_desc: "After Post-Tanzimat eligibility, the Porte chooses a guiding imperial identity: Ottomanism, Islamism, or Turkism."
 sp_ct_insp_identity_flavor: "Pamphlets and palace memoranda circulate the same three answers. The choice shapes which later ambitions the state can pursue."
 sp_ct_insp_identity_rewards: "Sets `sp_imperial_identity_chosen` and one path flag. Turkism can open the Turanian Ideal once Pan-Nationalism is researched."

 sp_ct_insp_ottomanism_desc: "Path: a common Ottoman citizenship course. No Turan conquest content."
 sp_ct_insp_ottomanism_flavor: "Ottomanism answers the identity question without unlocking the staged Turanian Ideal campaign."
 sp_ct_insp_ottomanism_path: "Selected when the Imperial Identity event takes the Ottomanism option."
 sp_ct_insp_ottomanism_rewards: "Sets `sp_ottomanism_selected`. No Turanian Ideal journal."

 sp_ct_insp_islamism_desc: "Path: an Islamic imperial mission. No Turan conquest content."
 sp_ct_insp_islamism_flavor: "Islamism answers the identity question without unlocking the staged Turanian Ideal campaign."
 sp_ct_insp_islamism_path: "Selected when the Imperial Identity event takes the Islamism option."
 sp_ct_insp_islamism_rewards: "Sets `sp_islamism_selected`. No Turanian Ideal journal."

 sp_ct_insp_turkism_desc: "Path: a Turkish national course. Unlocks the Turanian Ideal once Pan-Nationalism is researched."
 sp_ct_insp_turkism_flavor: "Turkism is the only identity that can open the staged claims campaign toward Azerbaijan, Iran, the Caspian steppe, and Turkestan."
 sp_ct_insp_turkism_path: "Selected when the Imperial Identity event takes the Turkism option."
 sp_ct_insp_turkism_rewards: "Sets `sp_turkism_selected` and attempts to add the Turanian Ideal journal when eligible."

 sp_ct_insp_turan_desc: "Umbrella journal: staged claims and control toward Azerbaijan, Iranian dominion, the Caspian steppe, and Turkestan. Turan is the objective — not a new country name."
 sp_ct_insp_turan_flavor: "Claims aid conquest; wars and subject control must still be won. Progress uses the journal's existing stage progress and goal variables."
 sp_ct_insp_turan_rewards: "Stage claims, stage prestige modifiers, Unifier of Turan on completion, and the Great Turan resolution event."

 sp_ct_insp_turan_s1_desc: "Unification of Azerbaijan: control Azerbaijan, Elizavetpol, Tabriz, and Urmia (own or through subjects)."
 sp_ct_insp_turan_s1_flavor: "Stage I opens with claims on those four state regions where missing."
 sp_ct_insp_turan_s1_rewards: "On completion: advances to Stage II and grants the next claim wave."

 sp_ct_insp_turan_s2_desc: "Iranian Plateau: dominate at least nine Iranian plateau states by conquest or through an Ottoman subject Persia. Goal uses the journal progress bar (9 of the listed targets)."
 sp_ct_insp_turan_s2_flavor: "Iran is framed as imperial dominion, not a Turkic homeland."
 sp_ct_insp_turan_s2_alt_note: "Subject Persia ownership counts through the same country-or-subject control checks used by the journal."
 sp_ct_insp_turan_s2_rewards: "On completion: advances to Stage III and grants the next claim wave."

 sp_ct_insp_turan_s3_desc: "Beyond the Caspian: control Turkmenia, Merz, Khiva, and Uzbekia (own or through subjects)."
 sp_ct_insp_turan_s3_flavor: "Stage III bridges Iranian dominion to Turkestan."
 sp_ct_insp_turan_s3_rewards: "On completion: advances to Stage IV and grants nearer Turkestan claims."

 sp_ct_insp_turan_s4_desc: "Turkestan: control at least eight Central Asian Turkic lands (own or through subjects). Goal uses the journal progress bar."
 sp_ct_insp_turan_s4_flavor: "Further claims may follow as control advances during Stage IV."
 sp_ct_insp_turan_s4_claims_note: "Second Stage IV claim wave flag: `sp_turan_claims_4b_granted` (after enough control or months, per I-28)."
 sp_ct_insp_turan_s4_rewards: "On completion: opens the Great Turan resolution toward Ideal completion / Great Ottoman proclamation."

 sp_ct_insp_great_ottoman_desc: "Final resolution after Stage IV: remain the Ottoman Empire, or proclaim the Great Ottoman Empire (same tag; no Turan country rename)."
 sp_ct_insp_great_ottoman_flavor: "Turan was the objective. The state remains Ottoman — or Great Ottoman — under continuity of tag and banner."
 sp_ct_insp_great_ottoman_rewards: "Unifier of Turan. Optional rename to Great Ottoman Empire and related presentation; Ideal completion flag."

