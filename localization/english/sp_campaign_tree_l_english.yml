 sp_ct_insp_ottomanism_s1_desc: "Enact inclusive citizenship (Racial Segregation, Cultural Exclusion, or Multiculturalism) and Freedom of Conscience or Total Separation."
 sp_ct_insp_ottomanism_s1_flavor: "Places non-Muslim subjects inside the Ottoman political project without conquest claims."
 sp_ct_insp_ottomanism_s1_rewards: "Advances to Constitutional Government."
 sp_ct_insp_ottomanism_s2_desc: "Keep the monarchy with a voting franchise, open the press (Right of Assembly or Protected Speech), and hold legitimacy at least 50."
 sp_ct_insp_ottomanism_s2_flavor: "Representative institutions must rest on enough legitimacy to endure."
 sp_ct_insp_ottomanism_s2_rewards: "Advances to The Ottoman Nation cohesion test."
 sp_ct_insp_ottomanism_s3_desc: "Keep inclusive citizenship, hold secession progress below 20%, and avoid widespread incorporated turmoil."
 sp_ct_insp_ottomanism_s3_flavor: "Tests whether a multi-ethnic empire can remain stable without coercion."
 sp_ct_insp_ottomanism_s3_rewards: "Advances to A Modern Imperial State."
 sp_ct_insp_ottomanism_s4_desc: "Great Power rank, literacy 35%+, key institutions, legitimacy 60+, inclusive citizenship, and wealth, census, or universal suffrage (landed voting alone is not enough)."
 sp_ct_insp_ottomanism_s4_flavor: "Final success of the liberal constitutional Ottoman project."
 sp_ct_insp_ottomanism_s4_rewards: "Completing A Modern Imperial State advances to the Constitutional Ottoman Empire capstone."
 sp_ct_insp_islamism_s1_desc: "Hold Istanbul and Hedjaz (Mecca and Medina), remain a monarchy under an Islamic church-state order, and keep legitimacy at least 50."
 sp_ct_insp_islamism_s1_flavor: "Secures the Holy Cities as the Caliphate’s foundation before Arabian expansion."
 sp_ct_insp_islamism_s1_rewards: "Advances to Arabia; grants Arabian claims where missing."
 sp_ct_insp_islamism_s2_desc: "Control Hedjaz, Nejd, Hail, and Yemen (own or through subjects)."
 sp_ct_insp_islamism_s2_flavor: "Arabia secured opens Nile and Maghreb objectives."
 sp_ct_insp_islamism_s2_rewards: "Advances to Nile and Maghreb; conditional claims where needed."
 sp_ct_insp_islamism_s3_desc: "Control Lower Egypt, Upper Egypt, and Sinai; at least two of Dongola, Kordofan, and Blue Nile; plus Tripoli and Tunisia (own or subjects)."
 sp_ct_insp_islamism_s3_flavor: "Builds a contiguous African-Islamic sphere under Ottoman or subject control."
 sp_ct_insp_islamism_s3_rewards: "Advances to Protector of the Muslim World."
 sp_ct_insp_islamism_s4_desc: "At least eight Muslim countries aligned as Ottoman subjects, allies, defensive partners, or members of an Ottoman-led Power Bloc."
 sp_ct_insp_islamism_s4_flavor: "The Great Caliphate is the objective title. The Ottoman state continues under its existing banner."
 sp_ct_insp_islamism_s4_rewards: "Completing Protector of the Muslim World advances to the Great Caliphate capstone."
