 # --- Inspector copy (derived from implemented JE/events; no invented history) ---
 sp_ct_insp_tanzimat_desc: "Complete the five core reform objectives: bureaucracy, education, army, economy, and separatism."
 sp_ct_insp_tanzimat_flavor: "Domestic reform must come first. Optional Syria and Egypt journals do not replace a core objective."
 sp_ct_insp_tanzimat_rewards: "Completing the core reforms finishes Tanzimat and opens the Constitutional Question."

 sp_ct_insp_post_tanzimat_desc: "Follow the struggle over who is to govern after Tanzimat: the Young Ottomans, the constitution, the Kanun-i Esasi, and the Hamidian restoration."
 sp_ct_insp_post_tanzimat_flavor: "These events argue over representation and royal prerogative. They do not pass new laws by themselves."
 sp_ct_insp_post_tanzimat_complete_note: "Resolved when Kanun-i Esasi is proclaimed, the palace path is taken without a franchise, or the optional Hamidian restoration occurs."
 sp_ct_insp_post_tanzimat_rewards: "Event choices grant temporary political modifiers. No new institutions are created."

 sp_ct_insp_identity_desc: "Once the Constitutional Question is resolved, choose the empire's course: Ottomanism, Islamism, or Turkism."
 sp_ct_insp_identity_flavor: "The same three answers circulate in the press and at the palace. The choice decides which later ambitions the state can pursue."
 sp_ct_insp_identity_rewards: "The chosen policy is fixed for the rest of the campaign. Turkism can open the Turanian Ideal once Pan-Nationalism is researched."

 sp_ct_insp_ottomanism_desc: "Ottomanism seeks a common Ottoman identity: equality of subjects, constitutional government, imperial cohesion, and a modern great power. It grants no Turan conquest claims."
 sp_ct_insp_ottomanism_flavor: "This is a civic imperial course. It does not unlock the Turanian Ideal."
 sp_ct_insp_ottomanism_path: "Chosen in Three Policies."
 sp_ct_insp_ottomanism_rewards: "Opens the Ottoman Nation journal. Completing Stage IV grants Constitutional Ottoman Empire."

 sp_ct_insp_islamism_desc: "Islamism strengthens the Caliphate and makes the empire a political center of the Muslim world, from Arabia to the Nile and Maghreb. It grants no Turan conquest claims."
 sp_ct_insp_islamism_flavor: "This is a caliphal course. It does not unlock the Turanian Ideal."
 sp_ct_insp_islamism_path: "Chosen in Three Policies."
 sp_ct_insp_islamism_rewards: "Opens the Pan-Islamic Unity journal. Completing Stage IV grants Protector of the Faithful."

 sp_ct_insp_turkism_desc: "Turkism sets a Turkish national course. It is the only identity that can open the Turanian Ideal."
 sp_ct_insp_turkism_flavor: "Once Pan-Nationalism is researched, this path can open an eastward campaign through Azerbaijan, Iran, the Caspian steppe, and Turkestan."
 sp_ct_insp_turkism_path: "Chosen in Three Policies."
 sp_ct_insp_turkism_rewards: "Opens the Turanian Ideal journal when eligible."

 sp_ct_insp_turan_desc: "Expand Ottoman influence eastward through Azerbaijan, Iran, the Caspian steppe, and Turkestan. Turan is the objective — not a new country name."
 sp_ct_insp_turan_flavor: "Claims provide a path to conquest, but victory and lasting control must still be secured. Each stage measures the territory held directly or through subjects."
 sp_ct_insp_turan_rewards: "Each stage grants claims and prestige. Completing the Ideal grants Unifier of Turan and opens the Great Turan event."

 sp_ct_insp_turan_s1_desc: "Control Azerbaijan, Elizavetpol, Tabriz, and Urmia — directly or through subjects."
 sp_ct_insp_turan_s1_flavor: "This stage opens with claims on those four state regions."
 sp_ct_insp_turan_s1_rewards: "Completing this stage unlocks Stage II and grants claims for the next phase of expansion."

 sp_ct_insp_turan_s2_desc: "Dominate at least nine Iranian plateau states by conquest, or through an Ottoman subject Persia."
 sp_ct_insp_turan_s2_flavor: "Iran is to be brought under Ottoman rule; it is not considered part of the Turkish homeland."
 sp_ct_insp_turan_s2_alt_note: "If Persia is an Ottoman subject, its holdings count toward the plateau goal."
 sp_ct_insp_turan_s2_rewards: "Completing this stage unlocks Stage III and grants claims for the next phase of expansion."

 sp_ct_insp_turan_s3_desc: "Control Turkmenia, Merz, Khiva, and Uzbekia — directly or through subjects."
 sp_ct_insp_turan_s3_flavor: "This stage links Iranian dominion to Turkestan."
 sp_ct_insp_turan_s3_rewards: "Completing this stage unlocks Stage IV and grants claims on nearer Turkestan lands."

 sp_ct_insp_turan_s4_desc: "Control at least eight Central Asian Turkic lands — directly or through subjects."
 sp_ct_insp_turan_s4_flavor: "Further claims may be granted as more of Central Asia is held."
 sp_ct_insp_turan_s4_claims_note: "A second set of Stage IV claims may be granted once enough Central Asian territory is held, or enough time has passed in Stage IV."
 sp_ct_insp_turan_s4_rewards: "Completing this stage opens the Great Turan event: finish the Ideal and choose whether to proclaim the Great Ottoman Empire."

 sp_ct_insp_great_ottoman_desc: "After Stage IV, remain the Ottoman Empire or proclaim the Great Ottoman Empire. The country is not renamed Turan."
 sp_ct_insp_great_ottoman_flavor: "Turan was the objective. The state remains Ottoman — or Great Ottoman — under the same banner."
 sp_ct_insp_great_ottoman_rewards: "Unifier of Turan. Optionally rename to Great Ottoman Empire."

