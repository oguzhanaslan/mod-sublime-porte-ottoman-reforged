 sp_ct_tt_ottomanism_s1: "#bold Equality of the Subjects#!\n#I Inclusive citizenship and civic religious law.#!\n#bold Reward#! Unlocks Constitutional Government."
 sp_ct_tt_ottomanism_s2: "#bold Constitutional Government#!\n#I Monarchy with a franchise, freer press, legitimacy 50+.#!\n#bold Reward#! Unlocks The Ottoman Nation."
 sp_ct_tt_ottomanism_s3: "#bold The Ottoman Nation#!\n#I Keep cohesion: low secession and limited turmoil.#!\n#bold Reward#! Unlocks A Modern Imperial State."
 sp_ct_tt_ottomanism_s4: "#bold A Modern Imperial State#!\n#I A Great Power modern imperial state.#!\n#bold Reward#! Constitutional Ottoman Empire."
 sp_ct_tt_islamism_s1: "#bold Strengthen the Caliphate#!\n#I Istanbul and Hedjaz under Caliphal order.#!\n#bold Reward#! Unlocks Arabia."
 sp_ct_tt_islamism_s2: "#bold Arabia#!\n#I Control Hedjaz, Nejd, Hail, and Yemen.#!\n#bold Reward#! Unlocks Nile and Maghreb."
 sp_ct_tt_islamism_s3: "#bold Nile and Maghreb#!\n#I Control Egypt, enough of Sudan, Tripoli, and Tunisia.#!\n#bold Reward#! Unlocks Protector of the Muslim World."
 sp_ct_tt_islamism_s4: "#bold Protector of the Muslim World#!\n#I Eight Muslim countries aligned with the Porte.#!\n#bold Reward#! Great Caliphate."
 sp_ct_insp_ottomanism_s1_desc: "Enact inclusive citizenship (Racial Segregation, Cultural Exclusion, or Multiculturalism) and Freedom of Conscience or Total Separation."
 sp_ct_insp_ottomanism_s1_flavor: "Non-Muslim subjects are to be included in the Ottoman political community. This path grants no conquest claims."
 sp_ct_insp_ottomanism_s1_rewards: "Unlocks Constitutional Government."
 sp_ct_insp_ottomanism_s1_rewards_tt: "Unlocks Constitutional Government."
 sp_ct_insp_ottomanism_s2_desc: "Keep the monarchy with a voting franchise, open the press (Right of Assembly or Protected Speech), and hold legitimacy at least 50."
 sp_ct_insp_ottomanism_s2_flavor: "Representative institutions cannot last without enough legitimacy to sustain them."
 sp_ct_insp_ottomanism_s2_rewards: "Unlocks The Ottoman Nation."
 sp_ct_insp_ottomanism_s2_rewards_tt: "Unlocks The Ottoman Nation."
 sp_ct_insp_ottomanism_s3_desc: "Keep inclusive citizenship, hold secession progress below 20%, and avoid widespread incorporated turmoil."
 sp_ct_insp_ottomanism_s3_flavor: "A multi-ethnic empire must hold together without relying on force alone."
 sp_ct_insp_ottomanism_s3_rewards: "Unlocks A Modern Imperial State."
 sp_ct_insp_ottomanism_s3_rewards_tt: "Unlocks A Modern Imperial State."
 sp_ct_insp_ottomanism_s4_desc: "Great Power rank, literacy 35%+, key institutions, legitimacy 60+, inclusive citizenship, and wealth, census, or universal suffrage. Landed voting alone is not enough."
 sp_ct_insp_ottomanism_s4_flavor: "This is the completed constitutional Ottoman state: a modern great power under a surviving monarchy."
 sp_ct_insp_ottomanism_s4_rewards: "Completing A Modern Imperial State unlocks the Constitutional Ottoman Empire title."
 sp_ct_insp_ottomanism_s4_rewards_tt: "Unlocks the Constitutional Ottoman Empire title."
 sp_ct_insp_islamism_s1_desc: "Hold Istanbul and Hedjaz (Mecca and Medina), remain a monarchy under an Islamic church-state order, and keep legitimacy at least 50."
 sp_ct_insp_islamism_s1_flavor: "The Holy Cities are the Caliphate's foundation before any Arabian expansion."
 sp_ct_insp_islamism_s1_rewards: "Unlocks Arabia and grants Arabian claims if they are not already held."
 sp_ct_insp_islamism_s1_rewards_tt: "Unlocks Arabia and grants Arabian claims where missing."
 sp_ct_insp_islamism_s2_desc: "Control Hedjaz, Nejd, Hail, and Yemen — directly or through subjects."
 sp_ct_insp_islamism_s2_flavor: "With Arabia in hand, attention turns to the Nile and the Maghreb."
 sp_ct_insp_islamism_s2_rewards: "Unlocks Nile and Maghreb and grants claims where they are still needed."
 sp_ct_insp_islamism_s2_rewards_tt: "Unlocks Nile and Maghreb and grants needed claims."
 sp_ct_insp_islamism_s3_desc: "Control Lower Egypt, Upper Egypt, and Sinai; at least two of Dongola, Kordofan, and Blue Nile; plus Tripoli and Tunisia — directly or through subjects."
 sp_ct_insp_islamism_s3_flavor: "This stage binds Egypt, Sudan, and the Maghreb to the Caliphate."
 sp_ct_insp_islamism_s3_rewards: "Unlocks Protector of the Muslim World."
 sp_ct_insp_islamism_s3_rewards_tt: "Unlocks Protector of the Muslim World."
 sp_ct_insp_islamism_s4_desc: "At least eight Muslim countries aligned as Ottoman subjects, allies, defensive partners, or members of an Ottoman-led Power Bloc."
 sp_ct_insp_islamism_s4_flavor: "The Great Caliphate is a title. The Ottoman state continues under its existing banner."
 sp_ct_insp_islamism_s4_rewards: "Completing Protector of the Muslim World unlocks the Great Caliphate."
 sp_ct_insp_islamism_s4_rewards_tt: "Unlocks the Great Caliphate."
