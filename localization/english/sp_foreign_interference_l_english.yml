l_english:
 sp_fi.1.t:0 "The Russian Note to the Porte"
 sp_fi.1.d:0 "The Russian ambassador has delivered a note concerning the Orthodox subjects of the empire: their churches, their courts, and St Petersburg's claimed right to speak on their behalf. Beneath the diplomatic language lies an attempt to turn an internal affair into a European question. The Sublime Porte may concede, refuse the interference, or answer with reforms of its own."
 sp_fi.1.f:0 "The note is a paper. The claim behind it is not."
 sp_fi.1.a:0 "Accept limited concessions"
 sp_fi.1.b:0 "Reject foreign interference"
 sp_fi.1.c:0 "Handle it through reform"
 sp_fi.2.t:0 "The Tsar's Claim of Protection"
 sp_fi.2.d:0 "St Petersburg now claims a standing right to intervene on behalf of the empire's Orthodox subjects. Accepting such a protectorship would surrender part of the Sublime Porte's authority; refusing it would leave the quarrel unresolved. A narrower settlement may still be purchased through reform and diplomacy."
 sp_fi.2.f:0 "Protection, once admitted, does not remain a courtesy."
 sp_fi.2.a:0 "Admit a limited protectorship"
 sp_fi.2.b:0 "Refuse the Tsar's claim"
 sp_fi.2.c:0 "Negotiate a narrower settlement"
 sp_fi.3.t:0 "Reform Demands in the Eastern Provinces"
 sp_fi.3.d:0 "European chancelleries, led by Russia, are demanding reforms in the eastern vilayets. They cite the insecurity of the Armenian population, inequitable taxation, and corrupt provincial administration. The Sublime Porte may invest in genuine reform, reject foreign pressure, or offer a limited administrative settlement."
 sp_fi.3.f:0 "The vilayet is not a Russian province. The grievance in it is still a grievance."
 sp_fi.3.a:0 "Reform the provinces"
 sp_fi.3.b:0 "Reject foreign pressure"
 sp_fi.3.c:0 "Limited administrative reform"
 sp_fi_note_concession:0 "Concessions to the Russian Note"
 sp_fi_note_sovereignty:0 "The Porte Stands on Sovereignty"
 sp_fi_note_reform:0 "Reform in Answer to the Note"
 sp_fi_prot_concession:0 "Limited Protectorship Admitted"
 sp_fi_prot_refuse:0 "Protectorship Refused"
 sp_fi_prot_negotiate:0 "Narrow Settlement with Russia"
 sp_fi_arm_reform:0 "Eastern Provincial Reform"
 sp_fi_arm_reject:0 "Foreign Reform Brief Refused"
 sp_fi_arm_limited:0 "Limited Eastern Administration"
