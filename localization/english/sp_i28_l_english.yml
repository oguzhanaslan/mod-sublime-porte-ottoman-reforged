l_english:
 sp_je_turanian_ideal: "The Turanian Ideal"
 sp_je_turanian_ideal_reason: "Having chosen Turkism, the Porte pursues a long campaign of staged claims toward Azerbaijan, Iran, the Caspian steppe, and Turkestan. Claims aid conquest; wars and subject control must still be won. Turan is the objective — not a new country name."
 sp_je_turanian_ideal_status_stage_1: "Stage I — Unification of Azerbaijan: control Azerbaijan, Elizavetpol, Tabriz, and Urmia (own or through subjects)."
 sp_je_turanian_ideal_status_stage_2: "Stage II — Iranian Plateau: dominate at least nine Iranian plateau states by conquest or through an Ottoman subject Persia. Iran is framed as imperial dominion, not a Turkic homeland."
 sp_je_turanian_ideal_status_stage_3: "Stage III — Beyond the Caspian: control Turkmenia, Merz, Khiva, and Uzbekia (own or through subjects)."
 sp_je_turanian_ideal_status_stage_4: "Stage IV — Turkestan: control at least eight Central Asian Turkic lands (own or through subjects)."
 sp_je_turanian_ideal_status_final: "The stages are complete. Resolve Great Turan to finish the Ideal."
 sp_je_turanian_ideal_complete_tt: "The Turanian Ideal is realized."

 sp_unifier_of_turan: "Unifier of Turan"
 sp_unifier_of_turan_desc: "The Porte completed the Turanian Ideal campaign objective."
 sp_i28_stage_complete_prestige: "Turanian Progress"
 sp_i28_stage_complete_prestige_desc: "A stage of the Turanian Ideal has been secured."

 dyn_c_sp_great_ottoman_empire: "Great Ottoman Empire"
 dyn_c_sp_great_ottoman_empire_adj: "Great Ottoman"

 sp_i28.1.t: "The Question of Imperial Identity"
 sp_i28.1.d: "After the Tanzimat struggle, factions at the Porte press for a clear political course: a common Ottoman citizenship, an Islamic imperial mission, or a Turkish national path."
 sp_i28.1.f: "Pamphlets and palace memoranda circulate the same three answers. The choice will shape which grand ambitions the state can later pursue."
 sp_i28.1.a: "Ottomanism will guide the Empire"
 sp_i28.1.a_tt: "Selects Ottomanism. No Turan conquest content."
 sp_i28.1.b: "Islamism will guide the Empire"
 sp_i28.1.b_tt: "Selects Islamism. No Turan conquest content."
 sp_i28.1.c: "Turkism will guide the Empire"
 sp_i28.1.c_tt: "Selects Turkism."

 sp_i28.2.t: "The Turanian Ideal"
 sp_i28.2.d: "Turkist circles open a long campaign: first Azerbaijan, then dominion over the Iranian plateau, then beyond the Caspian, and finally Turkestan."
 sp_i28.2.f: "Claims are granted stage by stage. Nothing is annexed for free; the Ideal is an opportunity, not a cheat."
 sp_i28.2.a: "Pin the Ideal"
 sp_i28.2.a_tt: "Stage I claims on Azerbaijan, Elizavetpol, Tabriz, and Urmia are granted where missing."

 sp_i28.10.t: "Azerbaijan United"
 sp_i28.10.d: "Azerbaijani lands are under Ottoman ownership or subject control. Attention turns to the Iranian plateau."
 sp_i28.10.f: "The Ideal frames Iran as Seljuk and Turco-Persian imperial dominion — the road east — not as ethnically Turkic soil."
 sp_i28.10.a: "Toward the plateau"

 sp_i28.11.t: "Dominion over Iran"
 sp_i28.11.d: "Sufficient control of the Iranian plateau has been secured by conquest or through a subject Persia."
 sp_i28.11.f: "Beyond the Caspian lie Turkmen and Uzbek horizons."
 sp_i28.11.a: "Beyond the Caspian"

 sp_i28.12.t: "Beyond the Caspian"
 sp_i28.12.d: "Turkmenia, Merz, Khiva, and Uzbekia answer to the Porte or its subjects. Turkestan remains."
 sp_i28.12.f: "Claims on the nearer Turkestan states are issued; further claims follow as control advances."
 sp_i28.12.a: "On to Turkestan"

 sp_i28.20.t: "Great Turan"
 sp_i28.20.d: "The staged Turanian Ideal is complete. The Porte may keep its Ottoman style of rule, or proclaim a Great Ottoman Empire — without discarding the Ottoman tag or renaming the country Turan."
 sp_i28.20.f: "Turan was the objective. The state remains Ottoman — or Great Ottoman — under the same banner of continuity."
 sp_i28.20.a: "Remain the Ottoman Empire"
 sp_i28.20.a_tt: "Keep the Ottoman Empire name. Gain Unifier of Turan."
 sp_i28.20.b: "Proclaim the Great Ottoman Empire"
 sp_i28.20.b_tt: "Rename to Great Ottoman Empire (tag TUR). Optional map color. No Turan country name; custom flag deferred."
