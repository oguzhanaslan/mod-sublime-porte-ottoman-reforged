l_english:
 sp_mod_name: "Sublime Porte: Ottoman Reforged"
 sp_mod_description: "A historical Ottoman flavor and rework for Victoria 3: a more grounded 1836 setup and a deeper Tanzimat-era campaign, without turning the empire into an overpowered faction."
 sp_egypt_followup_no_tanzimat_point_tt: "The Egyptian follow-up is completed, but does not grant an additional Tanzimat objective point."
 sp_je_sick_man_egypt_complete_settlement: "A limited European settlement of the Eastern Question has been concluded"
 sp_tanzimat_sound_finance_12_months_tt: "Maintain a positive fixed national income while not in default for 12 consecutive months."
 sp_tanzimat_funded_administration_12_months_tt: "Maintain positive Bureaucracy without approaching a Bureaucracy shortage for 12 consecutive months."
 je_sick_man_egypt: "The Egyptian Question"
 je_sick_man_egypt_reason: "With Syria restored, Egypt remains an optional question of Ottoman sovereignty. Resolving it does not grant another Tanzimat objective point."
 sickman_syria_egypt: "Claims on Lower Egypt, Middle Egypt, Upper Egypt, and Sinai have been restored. Resolving the Egyptian follow-up does not grant another Tanzimat objective point."
 je_sick_man_economy: "Tanzimat: Economic Reform"
 je_sick_man_economy_reason: "A stronger Ottoman economy requires sustained growth, sound public finances, and reliable access between the incorporated provinces and the national market."
 je_sick_man_economy_goal: "Grow [concept_gdp] to @money![JournalEntry.GetTotalGoalValue|K]#!"
 je_sick_man_education_goal: "Increase literacy by 10 percentage points from its level when this objective began."
 je_sick_man_separatism_goal: "Maintain safety from secession for 10 years, or for 5 years through equality or coercive administration. Home Affairs directly slows secession progress. Police is an indirect order tool: it limits turmoil effects, while Dedicated and Militarized Police reduce radicals generated by political movements. The accelerated route accepts either institution with sufficient Government Administration; their mechanical effects are not identical."
 sp_ottoman_balkan_cohesion_guidance: "Balkan Development"
 sp_ottoman_balkan_cohesion_guidance_reason: "#title Reform / Integration#!\nBroader cultural and religious acceptance can reduce discrimination and the radicalism of minority movements. Protect living standards in Balkan homelands, contain radical growth, and fund institutions that turn legal equality into effective administration. Education can also raise Cultural Fervor, so schools are not a stand-alone cure for nationalism.\n\n#title Order / Centralization#!\nHome Affairs directly slows revolution and secession progress. Police instead limits the consequences of turmoil and, under Dedicated or Militarized Police, reduces radicals generated by political movements. Maintain administrative capacity and institution funding, avoid fiscal collapse, and watch for foreign support to separatists.\n\n#title Autonomy / Compromise#!\nSerbia, Moldavia, and Wallachia already possess subject relationships that can be managed through relations, liberty desire, autonomy, and economic dependence. This route does not create new autonomous provinces inside incorporated Ottoman lands."
 sp_balkan_cohesion.1.t: "Governing Rumelia"
 sp_balkan_cohesion.1.d: "The Porte can govern its Balkan provinces through reform and integration, order and centralization, or compromise with its existing subjects. These approaches are compatible tools, not exclusive paths. Their results remain visible in discrimination, radicals, political movements, turmoil, secession, and liberty desire."
 sp_balkan_cohesion.1.f: "Rumelia cannot be reduced to a single decree. Law, administration, prosperity, coercion, and diplomacy will together determine whether imperial rule commands cooperation or resistance."
 sp_balkan_cohesion.1.a: "The Porte must balance its instruments."
 sp_i08_rumelian_instruments: "Balanced Instruments in Rumelia"
 sp_rejuvenated_sublime_porte: "Rejuvenated Sublime Porte"
 sp_tanzimat_army_doctrine: "General Staff Ascendant"
 sp_tanzimat_army_logistics: "Arsenals of the Porte"
 sp_tanzimat_economy_industry: "Workshops of the Empire"
 sp_tanzimat_economy_public_works: "Imperial Public Works"
 sp_tanzimat_education_academies: "Academies of Reform"
 sp_tanzimat_education_access: "Schools of the Porte"
 sp_tanzimat_bureaucracy_chancery: "Central Chancery"
 sp_tanzimat_bureaucracy_revenue: "Provincial Revenue Service"
 sp_tanzimat_separatism_reconciliation: "Imperial Reconciliation"
 sp_tanzimat_separatism_order: "Order in the Provinces"
 sp_tanzimat_syria_diplomacy: "Restored Eastern Standing"
 sp_egyptian_question: "The Eastern Question"
 sp_egyptian_question_reason: "The struggle with Egypt can end in a limited European settlement, an expensive maximalist victory, or an unresolved balance. Any one of military success, firm Great Power backing, or territorial leverage can open the historical settlement."
 sp_egyptian_question_status_coalition: "A committed Great Power coalition gives the Porte sufficient diplomatic leverage for mediation."
 sp_egyptian_question_status_battlefield: "Egyptian reverses give the Porte sufficient military leverage for mediation."
 sp_egyptian_question_status_territorial: "Ottoman recovery of at least three disputed regions gives the Porte sufficient territorial leverage for mediation."
 sp_egyptian_question_status_no_leverage: "Secure one leverage route: Egyptian battlefield reverses, committed backing from at least two of Britain, Austria, Russia, and Prussia, or full Ottoman control of at least three disputed regions."
 sp_egyptian_question_historical_settlement: "Settlement of the Eastern Question"
 sp_egyptian_question_maximalist_victory: "Maximalist Egyptian Settlement"
 sp_egyptian_question_stalemate: "Eastern Question Stalemate"
 sp_egyptian_question_egyptian_advantage: "Egyptian Ascendancy"
 sp_egyptian_question_historical_terms_tt: "Egyptian-held portions of Aleppo, Syria, Lebanon, Palestine, Transjordan, and Adana return to the Ottoman Empire. Egypt remains an Ottoman Protectorate with its own market. Crete is not transferred and no Tanzimat objective point is awarded."
 sp_egyptian_question_no_crete_no_tanzimat_tt: "This settlement neither transfers Crete nor awards a Tanzimat objective point."
 sp_egyptian_question_vanilla_sandbox_tt: "Ordinary puppet, conquest, and peace terms remain available through diplomacy."
 sp_egyptian_question_nizip_flavor_only_tt: "This records Egyptian success in the field; it does not by itself impose a historical defeat or a change of succession."
 sp_egyptian_question.1.t: "A Settlement for the Levant"
 sp_egyptian_question.1.d: "The conflict has ended with enough leverage for the Porte to seek a limited European settlement. The Levant may be restored without attempting the complete subjugation of Egypt."
 sp_egyptian_question.1.d.mahmud: "Mahmud II has survived to face the crisis that his centralizing reign helped bring to a head. The Porte now has enough leverage to recover the Levant through a limited settlement."
 sp_egyptian_question.1.d.abdulmecid: "Under the young Abdülmecid, the Porte has gained enough leverage to seek a European settlement restoring the Levant while leaving Egypt's internal administration intact."
 sp_egyptian_question.1.f: "The powers are prepared to mediate, but they will not hand Egypt to Constantinople without limit."
 sp_egyptian_question.1.a: "Accept the limited settlement"
 sp_egyptian_question.1.b: "Reject compromise and pursue maximalist terms"
 sp_egyptian_question.2.t: "Terms from Constantinople"
 sp_egyptian_question.2.d: "The proposed settlement restores the Levant and the disputed parts of Adana to Ottoman administration, while preserving Egypt as a protectorate with its own market."
 sp_egyptian_question.2.f: "Mehmed Ali must decide whether preserving his dynasty in Egypt is worth surrendering his northern conquests."
 sp_egyptian_question.2.a: "Accept the settlement"
 sp_egyptian_question.2.b: "Reject the terms"
 sp_egyptian_question.3.t: "An Echo of Nizip"
 sp_egyptian_question.3.d: "Egyptian battlefield success has shaken Ottoman confidence and strengthened Cairo's bargaining position. This reversal came from the campaign itself."
 sp_egyptian_question.3.f: "The memory of Nizip is written by armies in the field, not forced upon them by the calendar."
 sp_egyptian_question.3.a: "The campaign has turned against us"
 sp_egyptian_question.4.t: "Egypt Brought to Heel"
 sp_egyptian_question.4.d: "The Porte has imposed a settlement far beyond the limited compromise contemplated by the European powers. Its greater gains were purchased through the ordinary risks and costs of war."
 sp_egyptian_question.4.f: "A maximal victory is possible, but it is no gift of diplomacy."
 sp_egyptian_question.4.a: "The strongest terms have prevailed"
 sp_egyptian_question.5.t: "The Crisis Subsides"
 sp_egyptian_question.5.d: "The immediate conflict has ended without the leverage needed for a durable Ottoman settlement. Egypt retains its position, while the Porte absorbs a limited loss of standing."
 sp_egyptian_question.5.f: "The Eastern Question remains answered only for the moment."
 sp_egyptian_question.5.a: "We must live with the result"
 sp_egyptian_question.6.t: "Cairo Rejects Mediation"
 sp_egyptian_question.6.d: "Egypt has rejected the proposed compromise. The Porte cannot impose the settlement through mediation alone and suffers a limited diplomatic reverse."
 sp_egyptian_question.6.f: "European backing can open a conference; it cannot guarantee Cairo's signature."
 sp_egyptian_question.6.a: "The settlement has failed"
 sp_sick_man_success_army_doctrine: "Entrust the future to the General Staff."
 sp_sick_man_success_army_logistics: "Forge the empire's arsenals and supply lines."
 sp_sick_man_success_economy_industry: "Let the workshops of the empire prosper."
 sp_sick_man_success_economy_public_works: "Bind the provinces with imperial public works."
 sp_sick_man_success_education_academies: "Entrust reform to the academies."
 sp_sick_man_success_education_access: "Open the schools of the Porte."
 sp_sick_man_success_bureaucracy_chancery: "Strengthen the central chancery."
 sp_sick_man_success_bureaucracy_revenue: "Make provincial revenues answer to the Porte."
 sp_sick_man_success_separatism_reconciliation: "Reconcile the peoples of the empire."
 sp_sick_man_success_separatism_order: "Restore order in the provinces."
 sp_sick_man_success_syria_diplomacy: "Proclaim our restored eastern standing."
 sp_sick_man_success_syria_crete: "Reassert the Cretan Question."
 sick_man.3.f: "The Sublime Porte falls silent. Reform decrees lie unfinished while provincial authority frays, foreign powers circle, and subjects once held by imperial prestige prepare to chart their own course. The empire endures, but the promise of reorganization has given way to a struggle for survival."
