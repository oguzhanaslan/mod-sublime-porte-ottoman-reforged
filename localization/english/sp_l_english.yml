 sick_man.3.f: "The Sublime Porte falls silent. Reform decrees lie unfinished while provincial authority frays, foreign powers circle, and subjects once held by imperial prestige prepare to chart their own course. The empire endures, but the promise of reorganization has given way to a struggle for survival."
