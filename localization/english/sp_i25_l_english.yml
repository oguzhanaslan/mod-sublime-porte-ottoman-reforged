l_english:
 sp_i25.1.t:0 "The Men of the Porte"
 sp_i25.1.d:0 "A new generation of salaried clerks, trained in the capital's schools rather than born to office, now fills the corridors of the Sublime Porte. They keep registers, draft circulars, and expect promotion by service. The old households still hold provincial weight. The Porte must decide whether to advance these new men or keep the old balance of patronage."
 sp_i25.1.f:0 "The office does not yet belong to any one minister. It belongs to whoever can fill it."
 sp_i25.1.a:0 "Advance the new men"
 sp_i25.1.b:0 "Keep the old balance"
 sp_i25.2.t:0 "The New Schools"
 sp_i25.2.d:0 "In the capital, new mektebs are no longer a decree on paper. Boys sit at desks, maps hang on the wall, and the Porte's schools compete with communal and religious provision that still teaches most of the empire. What is visible now is a result of earlier choices, not a second founding of education."
 sp_i25.2.d_maarif:0 "After the Maarif reorganization, the capital's new mektebs are easier to see: desks, maps, and a timetable that belongs to the state. Communal and religious schools still teach most of the empire. The Porte must decide whether to expand the new classrooms or keep that older provision central."
 sp_i25.2.f:0 "The schoolroom is a result, not a second decree."
 sp_i25.2.a:0 "Expand the new mektebs"
 sp_i25.2.b:0 "Keep communal provision central"
 sp_i25.3.t:0 "The Telegraph Reaches the Provinces"
 sp_i25.3.d:0 "The electric telegraph, once a capital novelty, now carries correspondence beyond the Bosphorus. Provincial offices receive orders in hours instead of weeks. Local notables still expect to digest the traffic in their own time. The Porte can tighten the wire, or leave the offices to manage it."
 sp_i25.3.f:0 "The wire does not replace the governor. It only shortens his excuses."
 sp_i25.3.a:0 "Tighten the correspondence"
 sp_i25.3.b:0 "Let local offices digest the traffic"
 sp_i25.4.t:0 "The Istanbul Press"
 sp_i25.4.d:0 "Private and semi-private papers now circulate in Dersaadet. They print shipping lists, court news, and arguments that used to stay in salons. The Porte already has a law of speech; this is not a new statute. It is a question of how tightly the existing supervision will sit on the compositors' benches."
 sp_i25.4.f:0 "The press is a conversation. It is not yet a party."
 sp_i25.4.a:0 "Tolerate discussion"
 sp_i25.4.b:0 "Maintain supervision"
 sp_i25.5.t:0 "Foreign Advisers"
 sp_i25.5.d:0 "European engineers, instructors, and technical clerks have been hired into Ottoman service. They draw plans, correct drills, and sit in ministry rooms without holding the seals. The armed services resent being schooled from outside; the Intelligentsia wants the expertise kept. This is a domestic quarrel about whose cadres will modernize the state."
 sp_i25.5.f:0 "The expert leaves a drawing. He does not leave a treaty."
 sp_i25.5.a:0 "Keep the experts"
 sp_i25.5.b:0 "Prefer domestic cadres"
 sp_i25.6.t:0 "Railway Concessions"
 sp_i25.6.d:0 "A railway already runs on Ottoman soil. Foreign houses now offer capital to extend the concession, with terms that would put the line's purse beyond the Porte's daily reach. Industrialists want the iron laid; clerks and urban traders want the concession watched. No new track is granted today. The argument is who will own the next mile."
 sp_i25.6.f:0 "The locomotive is already here. The concession is the question."
 sp_i25.6.a:0 "Accept foreign capital"
 sp_i25.6.b:0 "Keep tighter Porte oversight"
 sp_i25.7.t:0 "Petitions from the Provinces"
 sp_i25.7.d:0 "Sealed arzuhals have reached the Porte from [SCOPE.sState('sp_i25_petition_state').GetName]. The complaints are administrative: tax, roads, a local office that answers too slowly or too sharply. They name no nation and ask for no new law. The Porte can hear the petition in the capital, or refer it back to the governor who already sits there."
 sp_i25.7.f:0 "The petition is a request, not a revolt."
 sp_i25.7.a:0 "Hear the petition"
 sp_i25.7.b:0 "Refer it to the governor"
 sp_i25.8.t:0 "The Port Cities"
 sp_i25.8.d:0 "Trade has thickened on the quay at [SCOPE.sState('sp_i25_port_state').GetCityHubName]. Steamers, bales, and custom-house clerks now share the waterfront with older urban trades. Merchant houses want the harbor run for cargo; traditional shopkeepers and guilds want the city's older interests protected."
 sp_i25.8.d_port:0 "Trade has thickened on the quay at [SCOPE.sState('sp_i25_port_state').GetPortHubName]. Steamers, bales, and custom-house clerks now share the waterfront with older urban trades. Merchant houses want the harbor run for cargo; traditional shopkeepers and guilds want the city's older interests protected."
 sp_i25.8.f:0 "The quay is not a company charter. It is a city arguing with itself."
 sp_i25.8.a:0 "Favor the merchant houses"
 sp_i25.8.b:0 "Protect traditional urban interests"
 sp_i25.9.t:0 "The New Street"
 sp_i25.9.d:0 "In Pera and Galata the Şehremaneti experiment is visible as paving, lighting, and a commercial street that no longer looks like a mahalle lane. The Porte can fund the new street as a capital improvement, or leave the work to local notables who already claim the district."
 sp_i25.9.f:0 "The street is a municipal habit, not a new institution."
 sp_i25.9.a:0 "Fund the new street"
 sp_i25.9.b:0 "Leave it to local notables"
 sp_i25.10.t:0 "Translation and the New Knowledge"
 sp_i25.10.d:0 "The Translation Office has long rendered treaties. What is new is the circulation of technical and legal books among clerks and students: manuals, codes, and primers copied into Ottoman. The Porte can sponsor that work as official knowledge, or leave it to private scholars who already translate for themselves."
 sp_i25.10.f:0 "The bureau does not invent a science. It only copies one."
 sp_i25.10.a:0 "Sponsor the translations"
 sp_i25.10.b:0 "Leave it to private scholars"
