l_english:
 sp_i23.1.t:0 "Authority Restored in Tripoli"
 sp_i23.1.d:0 "In 1835 the Porte ended the long Karamanlı household's de facto rule and sent an Ottoman governor to [SCOPE.sCountry('sp_i23_tri_scope').GetName]. Direct imperial authority has been restored along the coast. The desert hinterland is another matter: Fezzan remains unsettled, and the Cyrenaican interior does not obey the coastal administration as a province would. Holding the shore is not the same as ruling the Sahara."
 sp_i23.1.f:0 "The sultan's governor sits in Tripoli. The desert does not sit still."
 sp_i23.1.a:0 "Acknowledge"
 sp_i23.2.t:0 "The Bey and the Porte"
 sp_i23.2.d:0 "The Husaynid Bey of [SCOPE.sCountry('sp_i23_tun_scope').GetName] still recites the sultan's name in the Friday prayer, yet the household rules the regency as if it were its own. After the restoration of direct authority in Tripoli, ministers ask whether Tunis should be pressed toward tighter obedience — tribute, consultation, and a firmer recognition of the Porte — or left in the practical autonomy it has long enjoyed."
 sp_i23.2.f:0 "Suzerainty is a legal fact. The Bey's household is a political one."
 sp_i23.2.a:0 "Press the Bey"
 sp_i23.2.b:0 "Accommodate the Bey"
 sp_i23.3.t:0 "French Pressure in Tunis"
 sp_i23.3.d:0 "Paris watches Tunis. [SCOPE.sCountry('sp_i23_fra_scope').GetAdjective] counsel, already familiar at the Husaynid court, now presses the Porte to leave the Bey's household undisturbed. Yielding would cool the argument with France and ease friction with Tunis; holding the Porte's position would remind both Paris and the Bey that Ottoman suzerainty is not an empty phrase."
 sp_i23.3.d.pretension:0 "Paris watches Tunis, and [SCOPE.sCountry('sp_i23_fra_scope').GetAdjective] designs on the regency are no longer a rumour. Counsel from Paris asks the Porte to stand aside. Yielding would accommodate France; holding the Porte's position would refuse to treat Tunis as a French concern."
 sp_i23.3.d.pressed:0 "Paris watches Tunis. The Porte has already demanded tighter obedience from the Bey; [SCOPE.sCountry('sp_i23_fra_scope').GetAdjective] envoys now warn against pressing further. Yielding would ease the quarrel with France and with the Husaynid court; holding firm would show that the Porte does not recant."
 sp_i23.3.d.accommodated:0 "Paris watches Tunis. The Porte has already chosen to live with the Bey's practical autonomy; [SCOPE.sCountry('sp_i23_fra_scope').GetAdjective] counsel now asks that this forbearance become policy. Yielding would please Paris and the Husaynid court; holding the Porte's position would keep a door open to firmer suzerainty later."
 sp_i23.3.f:0 "A friendly word from Paris is still a word about who may speak in Tunis."
 sp_i23.3.a:0 "Yield to French counsel"
 sp_i23.3.b:0 "Maintain the Porte's position"
 sp_i23.4.t:0 "Britain in the Red Sea"
 sp_i23.4.d:0 "Reports from the southern approaches speak of a [SCOPE.sCountry('sp_i23_gbr_scope').GetAdjective] station at Aden, on the road to India. Whether London already holds the town or merely seeks it, the Red Sea is no longer a quiet Ottoman horizon. The Porte is informed; it is not hereby summoned to a campaign in Yemen."
 sp_i23.4.d.present:0 "[SCOPE.sCountry('sp_i23_gbr_scope').GetName] is already present on the Arabian and Yemeni shores. Aden is spoken of as a station on the Indian route, not a rumour from a distant chancellery. The Red Sea has become a British concern. The Porte is informed; it is not hereby summoned to reconquer Yemen."
 sp_i23.4.f:0 "A coaling station at the gate of the Red Sea is a fact of empire, even when it is not yet a fact of the map."
 sp_i23.4.a:0 "Acknowledge"
