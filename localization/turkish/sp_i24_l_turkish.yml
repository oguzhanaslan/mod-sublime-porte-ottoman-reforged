l_turkish:
 sp_je_tanzimat_reforms: "Tanzimat Islahatları"
 sp_je_tanzimat_reforms_reason: "Tanzimat sürerken Bâbıâli yeni ıslahat fermanları çıkarabilir. Bu düzenlemeler ana programı destekler, ancak Tanzimat'ın temel hedeflerini tamamlamaz."
 sp_je_tanzimat_reforms_status_opening: "Henüz adlı bir ıslahat kararı çıkarılmamıştır. Her karar, istikrarlı bir hükûmet ve buna direnecek çıkar gruplarının zayıflamasını gerektirir."
 sp_je_tanzimat_reforms_status_partial: "Bazı adlı ıslahat kararları çıkarılmıştır. Kalan kararlar hâlâ muhafazakâr muhalefetin engelleyemeyeceği siyasi şartlara bağlıdır."
 sp_je_tanzimat_reforms_status_complete: "Çıkarılabilecek bütün Tanzimat ıslahat fermanları yayımlandı veya başka yoldan sonuçlandı."

 sp_i24_abolish_cizye_button: "Cizyeyi Kaldır"
 sp_i24_abolish_cizye_button_desc: "Gayrimüslim tebaa üzerindeki adlı başvergisini sona erdir. Muhafazakâr büyük toprak sahipleri cemaate dayalı mali ayrıcalığın kaybına tepki gösterecektir.\nBu bir Tanzimat hedefini tamamlamaz."
 sp_i24_reform_ciftlik_button: "Çiftlik Düzenini Islah Et"
 sp_i24_reform_ciftlik_button_desc: "Vergi ve yerel iktidarı aracı eşrafa bırakan eski taşra tarım düzenini sınırla. Bu, Arazi Kanunnamesi olayı değildir ve tarımsal üretim vermez.\nBu bir Tanzimat hedefini tamamlamaz."
 sp_i24_reorganize_education_button: "Maarifi Yeniden Teşkilatlandır"
 sp_i24_reorganize_education_button_desc: "Mevcut okulları daha düzenli bir imparatorluk idaresine bağla. Bu, yeni bir eğitim kurumu kurmaz ve kendi başına bir eğitim yasası çıkarmaz.\nBu, Tanzimat eğitim hedefini tamamlamaz."
 sp_i24_suppress_slave_markets_button: "Esir Pazarlarını Kapat"
 sp_i24_suppress_slave_markets_button_desc: "Payitaht ve taşra kasabalarındaki açık esir pazarlarını kapat. Bu, köleliği yasa olarak yasaklamaz; Kölelik Yasaklansın isteniyorsa kölelik yasası hâlâ olağan yasama yoluyla değiştirilmelidir. Kölelik zaten yasaksa görünmez.\nBu bir Tanzimat hedefini tamamlamaz."

 sp_i24_no_tanzimat_point_tt: "Bu karar bir Tanzimat hedef puanı vermez."
 sp_i24_cizye_complete_tt: "Cizyeyi Kaldır fermanı çıkarıldı"
 sp_i24_ciftlik_complete_tt: "Çiftlik Düzenini Islah Et fermanı çıkarıldı"
 sp_i24_education_complete_tt: "Maarifi Yeniden Teşkilatlandır fermanı çıkarıldı"
 sp_i24_slave_markets_complete_tt: "Esir Pazarlarını Kapat fermanı çıkarıldı veya Kölelik Yasaklansın zaten yürürlükte"

 sp_i24_cizye_abolished_mod: "Cizye Kaldırıldı"
 sp_i24_cizye_abolished_mod_desc: "Gayrimüslim tebaa üzerindeki adlı başvergisi Tanzimat kararıyla kaldırılmıştır. Din vergisi geliri düşer; muhafazakâr seçkinler hoşnutsuz kalır."
 sp_i24_ciftlik_reformed_mod: "Çiftlik Düzeni Islah Edildi"
 sp_i24_ciftlik_reformed_mod_desc: "Taşradaki topraklı aracılar sınırlandırılmıştır. İdare ve vergi kapasitesi mütevazı biçimde iyileşir; Büyük Toprak Sahipleri yerel mali gücün kaybına tepki gösterir."
 sp_i24_education_reorganized_mod: "Maarif Yeniden Teşkilatlandırıldı"
 sp_i24_education_reorganized_mod_desc: "Mevcut okullar daha düzenli bir imparatorluk idaresine bağlanmıştır. Erişim ve bürokrasi hafifçe iyileşir; bedeli Dindarlar öder."
 sp_i24_slave_markets_suppressed_mod: "Esir Pazarları Kapatıldı"
 sp_i24_slave_markets_suppressed_mod_desc: "Açık esir pazarları kararnameyle kapatılmıştır. Köle ithalatı düşer, prestij hafifçe yükselir ve kamuoyu ticarete karşı kayar; kölelik yasasının kendisi değişmez."
