 sp_i14.1.t:0 "Bank-ı Osmanî-i Şahane"
 sp_i14.1.d:0 "Londra ve Paris evleri, 1856 Osmanlı Bankası'nı Bank-ı Osmanî-i Şahane olarak yeniden kurmayı teklif eder. 1863 imtiyazı Anglo-Fransız sermayesine münhasır emisyon hakkı verir ve bankayı Bâb-ı Âli'nin hazine vekili yapar—daha ucuz kredi, darphane üzerinde yabancı komiteler pahasına."
 sp_i14.1.f:0 "İmtiyaz hazineyi doldurabilir; kâğıda Londra ve Paris adlarını da yazar."
 sp_i14.1.a:0 "Anglo-Fransız imtiyazını ver"
 sp_i14.1.b:0 "Hazineyi Osmanlı elinde tut"
