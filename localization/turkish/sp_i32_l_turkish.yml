l_turkish:
 sp_je_learning_from_europe: "Avrupa'dan Öğrenmek"
 sp_je_learning_from_europe_reason: "Bab-ı Ali zaten talebe göndermekte ve Avrupalı müşavirler barındırmaktadır. Bu günlük o âdeti izler: masraflı, sınırlı ve Tanzimat'tan bağımsızdır. Kendi başına tamamlanmaz veya başarısız olmaz.\n\nProgram kapasitesi varsayılan 2, kadrolu üniversite veya on iki ay üst üste bürokrasi fazlasından sonra 3, yerleşik yerli ihtisasla 4'tür. Devralınan askerî yardım askerî programı doldurur. Bu günlük ikinci bir Moltke veya antlaşma bonusu vermez."

 sp_je_learning_from_europe_status_students_fra_ma: "Talebeler Fransa'dadır. Prusya askerî yardımı zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_gbr_ma: "Talebeler Britanya'dadır. Prusya askerî yardımı zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_ger_ma: "Talebeler Almanya'dadır. Askerî yardım zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_pru_ma: "Talebeler Prusya'dadır. Prusya askerî yardımı zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_aus_ma: "Talebeler Avusturya'dadır. Prusya askerî yardımı zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_fra: "Avrupa'daki talebeler: Fransa. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_gbr: "Avrupa'daki talebeler: Britanya. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_ger: "Avrupa'daki talebeler: Almanya. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_pru: "Avrupa'daki talebeler: Prusya. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_aus: "Avrupa'daki talebeler: Avusturya. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_ma_moltke: "Prusya askerî yardımı zaten yürürlüktedir. Helmuth von Moltke bu antlaşma heyetindedir. Bu günlük onu tanıtır; ekstra bir Moltke düzenleyicisi vermez."
 sp_je_learning_from_europe_status_ma_post_moltke: "Prusyalı eğitmenler mevcut askerî yardım antlaşması altında kalır (Moltke sonrası). Askerî program, antlaşma bitene kadar dolu sayılır. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_cooldown: "Avrupa'ya talebe programı son kohorttan sonra beklemededir. Bu süre dolmadan yeni bir grup gönderilemez."
 sp_je_learning_from_europe_status_cap4: "Avrupa'da talebe yoktur. Program kapasitesi: 4. Altın ve diplomasi izin verirse yeni bir talebe programı başlatılabilir."
 sp_je_learning_from_europe_status_cap3: "Avrupa'da talebe yoktur. Program kapasitesi: 3. Altın ve diplomasi izin verirse yeni bir talebe programı başlatılabilir."
 sp_je_learning_from_europe_status_cap2: "Avrupa'da talebe yoktur. Program kapasitesi: 2. Devralınan askerî yardım bir programı zaten kullanır; Avrupa'ya talebe hâlâ ikinci program olarak başlatılabilir."

 sp_i32_btn_send_students: "Avrupa'ya Talebe Gönder"
 sp_i32_btn_send_students_desc: "Fransa, Britanya, Prusya veya Almanya ya da Avusturya'ya bir talebe heyeti gönder. Peşin hazine masrafını güzergâh seçimi belirler. Yurtdışındayken harcırah ve bürokrasi yükü program düzenleyicisinin parçasıdır.\n\n#bold Kapasite:#! varsayılan 2 program; kadrolu üniversite veya on iki ay üst üste bürokrasi fazlasından sonra 3; 4 yalnızca yerleşik yerli ihtisasla.\nBu, muharebe gücü, inşaat veya ham araştırma hızı vermez."
 sp_i32_btn_send_students_effect_tt: "Güzergâh seçimini açar. Seçilen ev sahibi, aşağıda gösterilen hazine masrafını uygular."

 sp_i32_btn_cancel_students: "Talebe Programını Durdur"
 sp_i32_btn_cancel_students_desc: "Program bitmeden talebeleri geri çağır. Ev sahibi bunu hakaret sayar ve aktif etkiler biter. Harcanmış altın iade edilmez."
 sp_i32_btn_cancel_students_effect_tt: "Avrupa'ya talebe programını durdurmayı onayla"

 sp_i32_students_not_active_tt: "Aynı anda yalnızca bir Avrupa'ya talebe programı yürüyebilir"
 sp_i32_students_cooldown_tt: "Avrupa'ya talebe programı beklemede değil"
 sp_i32_capacity_allows_tt: "Program kapasitesine henüz ulaşılmadı"
 sp_i32_students_destination_tt: "En az bir uygun Avrupa güzergâhı var"
 sp_i32_students_cancel_possible_tt: "Avrupa'ya talebe programı aktif ve henüz tamamlanma aşamasında değil"
 sp_i32_students_complete_cooldown_tt: "Bu program 2 yıl boyunca yeniden başlatılamaz"
 sp_i32_students_cancel_cooldown_tt: "Bu program 1 yıl boyunca yeniden başlatılamaz"
 sp_i32_students_no_refund_tt: "Harcanmış altın iade edilmez"
 sp_i32_students_extend_year_tt: "Talebeler bir yıl daha yurtdışında kalır"

 sp_i32_students_fra_diplo_tt: "Fransa var, bizimle savaşta değil, ilişkileri Zayıf'tan iyi ve tavrı düşmanca değil"
 sp_i32_students_gbr_diplo_tt: "Büyük Britanya var, bizimle savaşta değil, ilişkileri Zayıf'tan iyi ve tavrı düşmanca değil"
 sp_i32_students_german_diplo_tt: "Almanya — yoksa Prusya — uygun bir ev sahibidir: savaşta değil, ilişkiler Zayıf'tan iyi ve tavır düşmanca değil"
 sp_i32_students_aus_diplo_tt: "Avusturya var, bizimle savaşta değil, ilişkileri Zayıf'tan iyi ve tavrı düşmanca değil"

 sp_i32_spb_students: "Avrupa'daki Talebeler"
 sp_i32_spb_students_desc: "Talebe heyetinin kalan süresi."
 sp_i32_spb_students_second: "Talebeler, program sayacı bitene kadar yurtdışında kalır."
 sp_i32_spb_students_tick: "Avrupa'ya talebe programının aylık ilerlemesi"
 sp_i32_spb_military: "Askerî Yardım"
 sp_i32_spb_military_desc: "Gelen bir askerî yardım antlaşması askerî programı doldurur. Bu lamba geri saymaz; mevcut antlaşma etkileri geçerlidir."
 sp_i32_spb_military_second: "Mevcut antlaşma etkileri madde bitene kadar yürürlükte kalır."

 sp_i32_students_fra_act: "Fransa'daki Talebeler"
 sp_i32_students_fra_act_desc: "Osmanlı talebeleri Fransa'da okumaktadır. Toplum öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur. Aydınlar memnundur."
 sp_i32_students_gbr_act: "Britanya'daki Talebeler"
 sp_i32_students_gbr_act_desc: "Osmanlı talebeleri Britanya'da okumaktadır. Üretim öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur. Sanayiciler memnundur."
 sp_i32_students_pru_act_spread: "Prusya'daki Talebeler"
 sp_i32_students_pru_act_spread_desc: "Osmanlı talebeleri Prusya'da okumaktadır. Askerî öğrenim ve vasıf iyileşir. Yalnızca gelen askerî yardım o yayılımı henüz elinde tutmuyorsa kullanılır."
 sp_i32_students_pru_act_qual_only: "Prusya'daki Talebeler"
 sp_i32_students_pru_act_qual_only_desc: "Osmanlı talebeleri Prusya'da okumaktadır. Vasıf iyileşir; askerî teknoloji yayılımı mevcut yardım antlaşmasına bırakılır. Ordunun onayı yine de yükselir."
 sp_i32_students_aus_act: "Avusturya'daki Talebeler"
 sp_i32_students_aus_act_desc: "Osmanlı talebeleri Avusturya'da okumaktadır. Toplum öğrenimi ve idare iyileşir; harcırah ve bürokrasi yükü daha hafiftir."

 sp_i32_students_complete_state: "Dönen Kadrolar: Devlet Hizmeti"
 sp_i32_students_complete_state_desc: "Dönen talebeler devlet idaresini güçlendirir."
 sp_i32_students_complete_schools: "Dönen Kadrolar: Mektepler ve Üniversiteler"
 sp_i32_students_complete_schools_desc: "Dönen talebeler mektep ve üniversiteleri güçlendirir."
 sp_i32_students_complete_technical: "Dönen Kadrolar: Teknik Müesseseler"
 sp_i32_students_complete_technical_desc: "Dönen talebeler teknik müesseseleri güçlendirir."
 sp_i32_students_complete_military: "Dönen Kadrolar: Askerî Müesseseler"
 sp_i32_students_complete_military_desc: "Dönen talebeler askerî mektep ve erkân-ı harp dairelerini güçlendirir."

 sp_i32_students_overrun: "Talebe Stipendi Aşımı"
 sp_i32_students_overrun_desc: "Talebe heyeti beklenenden pahalıya mal olmaktadır."
 sp_i32_students_overrun_aus: "Talebe Stipendi Aşımı"
 sp_i32_students_overrun_aus_desc: "Avusturya talebe heyeti beklenenden pahalıya mal olmaktadır."
 sp_i32_students_radicals: "Dönen Radikaller"
 sp_i32_students_radicals_desc: "Dönen talebelerin bir kısmı tedirgin edici siyasi fikirler getirmiştir. Aydınlar bundan güç alır; Dindarlar almaz."

 sp_i32.11.t: "Nereye Gönderelim?"
 sp_i32.11.d: "Tercüme Odası ve nezaretler bir kohort ayırabilir, dördünü birden değil. Fransa idare ve edebiyât; Britanya sanayi ve mühendislik; Prusya erkân-ı harp mektebi; Avusturya daha yakın bir akademi sunar. Hazine hareket günü öder; kaldıkları her hafta harcırah onları izler."
 sp_i32.11.f: "Bir yanda isim listesi, öbür yanda liman listesi. İkisini de birinin imzalaması gerekir."
 sp_i32.11.fra: "Fransa — Eğitim ve İdare"
 sp_i32.11.gbr: "Britanya — Sanayi ve Mühendislik"
 sp_i32.11.ger: "Prusya / Almanya — Askerî Eğitim"
 sp_i32.11.aus: "Avusturya — İdare ve Teşkilat"
 sp_i32.11.none: "Bu yıl değil"

 sp_i32.30.t: "Talebeler Geri Çağrılsın mı?"
 sp_i32.30.d: "Heyeti şimdi durdurmak kalan harcırahı kurtarır, fakat ev sahibi bunu hakaret sayar. Yurtdışındaki kadrolar tahsillerini bitirmez."
 sp_i32.30.f: "Vapur geri döndürülebilir. İtibar döndürülemez."
 sp_i32.30.a: "Geri çağır"
 sp_i32.30.b: "Program devam etsin"

 sp_i32.40.t: "Talebeler Dönüyor"
 sp_i32.40.d: "Kohort vatana döndü. Defterleri, Bab-ı Ali onları işe koymadıkça tozlanır. Devlet hizmeti, mektepler, teknik daireler veya askerî müesseseler — her yol kısa bir kapasite nabzıdır, kalıcı imtiyaz değil."
 sp_i32.40.f: "Başka bir ülkenin nizamını gördüler. Soru, o nizamın bizde nereye oturacağıdır."
 sp_i32.40.state: "Devlet hizmetine yerleştir"
 sp_i32.40.schools: "Mektep ve üniversitelere yerleştir"
 sp_i32.40.technical: "Teknik müesseselere yerleştir"
 sp_i32.40.military: "Askerî müesseselere yerleştir"

 sp_i32.50.t: "Yurtdışındaki Talebelerde Sıkıntı"
 sp_i32.50.d: "Heyetten gelen raporlar düzensiz. Program sürer, fakat bütçelediğimiz şartlarda değil."
 sp_i32.50.d_overrun: "Harcırah, talebelerin gerçek harcamasını karşılamıyor. Ek masraflar bir süre hazineye yük olacak."
 sp_i32.50.d_delay: "İmtihanlar, hastalık veya kapanan bir akademi kursu uzattı. Planlanandan daha uzun yurtdışında kalacaklar."
 sp_i32.50.d_remain: "Ev sahibi onların kalmasını istedi. Fazladan bir süre zaman kaybettirir."
 sp_i32.50.d_radicals: "Talebelerin bir kısmı ruhen erken döndü: daha siyasi, daha sabırsız. Aydınlar bundan güç alır; Dindarlar almaz."
 sp_i32.50.f: "Bir mektuba cevap verilir. Bir fikir modasına zor."
 sp_i32.50.a: "İdare ederiz"
