 sp_i32_btn_cancel_industrial_desc: "Sanayi heyetini erken bitir. Ortak bunu hakaret sayar ve aktif etkiler biter. Harcanmış altın iade edilmez."
 sp_i32_btn_cancel_industrial_effect_tt: "Sanayi heyetini durdurmayı onayla"

 sp_i32_btn_send_naval: "Bahriye Islahı Başlat"
 sp_i32_btn_send_naval_desc: "Çarklı vapur veya vida firkateyni araştırıldıktan sonra Avrupalı bir bahriye heyeti davet et. Britanya Samimi ilişkiler veya birincil ortak olmayı ister; Fransa Tarafsız ister. Hazine hareket günü öder; harcırah ve bürokrasi izler.\n\nGemi taarruzu veya muharebe gücü vermez. Askerî teknoloji yayılımı yalnızca kara heyeti veya yardım o kanalı doldurmadığında uygulanır."
 sp_i32_btn_send_naval_effect_tt: "Ortak seçimini açar. Hazine masrafı aşağıda gösterilir."

