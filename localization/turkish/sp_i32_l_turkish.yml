 sp_i32.14.t: "Mektepleri Nasıl Şekillendirelim?"
 sp_i32.14.d: "Avrupa tarzı mektepleri genişlet, mübadeleyi teknik ve askerî mekteplerle sınırla veya yöntemleri mevcut müesseselere entegre et. Her yol yıllarca siyaseti ve idareyi kilitler. Genişlet için Fransa doğal ortaktır; Sınırla Almanya'ya da bakabilir; Entegre Avusturya'ya bakabilir."
 sp_i32.14.f: "Bir müfredat aynı zamanda bir hizip haritasıdır."
 sp_i32.14.expand_fra: "Genişlet — Fransa"
 sp_i32.14.limit_fra: "Sınırla — Fransa"
 sp_i32.14.limit_german: "Sınırla — Prusya / Almanya"
 sp_i32.14.integrate_aus: "Entegre — Avusturya"
 sp_i32.14.integrate_fra: "Entegre — Fransa"
 sp_i32.14.none: "Bu yıl değil"

 sp_i32.30.t: "Talebeler Geri Çağrılsın mı?"
 sp_i32.30.d: "Heyeti şimdi durdurmak kalan harcırahı kurtarır, fakat ev sahibi bunu hakaret sayar. Yurtdışındaki kadrolar tahsillerini bitirmez."
 sp_i32.30.f: "Vapur geri döndürülebilir. İtibar döndürülemez."
 sp_i32.30.a: "Geri çağır"
 sp_i32.30.b: "Program devam etsin"

 sp_i32.31.t: "Teknik Heyet Bitsin mi?"
 sp_i32.31.d: "Şimdi iptal etmek harcırahı bitirir, fakat ortak bunu hakaret sayar. Bitmemiş iş tamamlanma ödülü vermez."
 sp_i32.31.f: "Sözleşmeler yırtılabilir. İyi niyet yeniden yazılamaz."
 sp_i32.31.a: "Heyeti bitir"
 sp_i32.31.b: "Heyet devam etsin"

 sp_i32.32.t: "Eğitim İşbirliği Bitsin mi?"
 sp_i32.32.d: "Şimdi iptal etmek programı bitirir, fakat ortak bunu hakaret sayar. Bitmemiş müessese işi tamamlanma ödülü vermez."
 sp_i32.32.f: "Bir okul yılı terk edilebilir. İtibar edilemez."
 sp_i32.32.a: "İşbirliğini bitir"
 sp_i32.32.b: "İşbirliği devam etsin"

 sp_i32.40.t: "Talebeler Dönüyor"
 sp_i32.40.d: "Kohort vatana döndü. Defterleri, Bab-ı Ali onları işe koymadıkça tozlanır. Devlet hizmeti, mektepler, teknik daireler veya askerî müesseseler — her yol kısa bir kapasite nabzıdır, kalıcı imtiyaz değil."
 sp_i32.40.f: "Başka bir ülkenin nizamını gördüler. Soru, o nizamın bizde nereye oturacağıdır."
 sp_i32.40.state: "Devlet hizmetine yerleştir"
 sp_i32.40.schools: "Mektep ve üniversitelere yerleştir"
 sp_i32.40.technical: "Teknik müesseselere yerleştir"
 sp_i32.40.military: "Askerî müesseselere yerleştir"

 sp_i32.41.t: "Teknik Heyet Bitiyor"
 sp_i32.41.d: "Mühendisler ayrılıyor. Geride bıraktıkları vasıfları genişçe güçlendirebilir veya üniversite müesseselerinde toplanabilir. Her iki halde nabız kısadır."
 sp_i32.41.f: "Asılacak yeri olmayan planlar yalnızca kâğıttır."
 sp_i32.41.qual: "İhtisası vasıflara yay"
 sp_i32.41.uni: "Teknik müesseselerde topla"

 sp_i32.42.t: "Eğitim İşbirliği Sonlanıyor"
 sp_i32.42.d: "Seçilen odak yolunu tamamladı. Kısa bir nabız izler: Genişlet sonrası daha geniş mektep erişimi, Sınırla sonrası vasıf veya Entegre sonrası idare."
 sp_i32.42.f: "Sınıflar susar. Ne öğrettikleri üzerine tartışma susmaz."
 sp_i32.42.a: "Sonuçları müesseselleştir"

 sp_i32.50.t: "Yurtdışındaki Talebelerde Sıkıntı"
 sp_i32.50.d: "Heyetten gelen raporlar düzensiz. Program sürer, fakat bütçelediğimiz şartlarda değil."
 sp_i32.50.d_overrun: "Harcırah, talebelerin gerçek harcamasını karşılamıyor. Ek masraflar bir süre hazineye yük olacak."
 sp_i32.50.d_delay: "İmtihanlar, hastalık veya kapanan bir akademi kursu uzattı. Planlanandan daha uzun yurtdışında kalacaklar."
 sp_i32.50.d_remain: "Ev sahibi onların kalmasını istedi. Fazladan bir süre zaman kaybettirir."
 sp_i32.50.d_radicals: "Talebelerin bir kısmı ruhen erken döndü: daha siyasi, daha sabırsız. Aydınlar bundan güç alır; Dindarlar almaz."
 sp_i32.50.f: "Bir mektuba cevap verilir. Bir fikir modasına zor."
 sp_i32.50.a: "İdare ederiz"

 sp_i32.51.t: "Teknik Heyette Sıkıntı"
 sp_i32.51.d: "Teknik heyet planlandığı gibi ilerlememektedir. İş sürer, fakat daha ağır şartlarda."
 sp_i32.51.d_overrun: "Donanım, ücret veya navlun bütçeyi aştı. Ek masraflar bir süre hazineye yük olacak."
 sp_i32.51.d_delay: "Sevkiyat, keşif veya ortak siyaseti takvimi uzattı. Heyet planlanandan uzun sürecek."
 sp_i32.51.d_forced_sink: "İş mühendislik mektepleri ve müesseselerine daraldı. Tamamlanınca dönen ihtisas orada toplanmalıdır."
 sp_i32.51.f: "Pas ve evrak aynı vapurda gelir."
 sp_i32.51.a: "İdare ederiz"

 sp_i32.52.t: "Eğitim İşbirliğinde Sıkıntı"
 sp_i32.52.d: "Eğitim programı direnç veya gecikmeyle karşılaştı. İşbirliği sürer, fakat bütçelediğimiz şartlarda değil."
 sp_i32.52.d_bur_resist: "Memurlar ıslahatı engellemektedir. Ek bürokrasi bir süre devlete yük olacak."
 sp_i32.52.d_radicals: "Program altında yetişenlerin bir kısmı daha siyasi ve daha sabırsız oldu. Aydınlar bundan güç alır; Dindarlar almaz."
 sp_i32.52.d_delay: "İmtihanlar, kadro veya ortak siyaseti takvimi uzattı. İşbirliği planlanandan uzun sürecek."
 sp_i32.52.d_overrun: "Program beklenenden pahalıya mal olmaktadır. Ek masraflar bir süre hazineye yük olacak."
 sp_i32.52.f: "Bir müfredat düzeltilebilir. Bir hizip düzeltilemez."
 sp_i32.52.a: "İdare ederiz"
sp_je_learning_from_europe_status_military_fra: "Fransız kara askerî heyeti sürmektedir. Kurmay ve akademi öğrenimi iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_military_gbr: "Sınırlı bir Britanya kurmay gözlem heyeti sürmektedir. Vasıf iyileşir; harcırah ile bürokrasi devlete yük olur. Askerî teknoloji yayılımı verilmez."
 sp_je_learning_from_europe_status_military_ger: "Alman kara askerî heyeti sürmektedir. Kurmay ıslahı ilerler; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_military_pru: "Prusya kara askerî heyeti sürmektedir. Kurmay ıslahı ilerler; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_military_aus: "Avusturya kara askerî heyeti sürmektedir. Teşkilat ve topçu öğrenimi iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_military_cooldown: "Kara askerî heyet programı son görevden sonra beklemededir. Bu süre dolmadan yeni bir heyet başlatılamaz."

 sp_i32_btn_send_military: "Askerî Heyet Davet Et"
 sp_i32_btn_send_military_desc: "Devralınan askerî yardım bittikten sonra Avrupa kara kurmay heyeti davet et. Prusya veya Almanya en güçlü kurmay paketini sunar; Fransa akademi ve topçu; Britanya yalnızca başlıca ortak Britanya ise ve bahriye programı yoksa sınırlı gözlem yolu; Avusturya ikincil teşkilat yolu.\n\nOrtaklar en az Tarafsız olmalıdır. Muharebe gücü, eğitim hızı, tecrübe veya malzeme indirimi vermez."
 sp_i32_btn_send_military_effect_tt: "Ortak seçimini açar. Hazine masrafı aşağıda gösterilir."

 sp_i32_btn_cancel_military: "Askerî Heyeti Durdur"
 sp_i32_btn_cancel_military_desc: "Kara askerî heyeti erken bitir. Ortak bunu hakaret sayar ve aktif etkiler biter. Harcanmış altın iade edilmez."
 sp_i32_btn_cancel_military_effect_tt: "Kara askerî heyeti durdurmayı onayla"

