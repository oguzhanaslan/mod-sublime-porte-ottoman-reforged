 sp_i32_military_naval_empty_tt: "Aktif bir bahriye ıslah programı yok"

 sp_i32_mil_pru_act: "Prusya Askerî Müşavir Heyeti"
 sp_i32_mil_pru_act_desc: "Prusyalı veya Alman kurmaylar Osmanlı ıslahına danışmanlık eder. Askerî öğrenim ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur. Silahlı Kuvvetler onaylar ve çekim gücü artar."
 sp_i32_mil_fra_act: "Fransız Askerî Müşavir Heyeti"
 sp_i32_mil_fra_act_desc: "Fransız akademi ve topçu müşavirleri vardır. Askerî öğrenim ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur. Silahlı Kuvvetler ve Aydınlar onaylar."
 sp_i32_mil_gbr_act: "Britanya Kurmay Gözlemi"
 sp_i32_mil_gbr_act_desc: "Sınırlı bir Britanya kurmay gözlem heyeti vardır. Vasıf iyileşir; harcırah ile bürokrasi devlete yük olur. Askerî teknoloji yayılımı verilmez."
 sp_i32_mil_aus_act: "Avusturya Askerî Müşavir Heyeti"
 sp_i32_mil_aus_act_desc: "Avusturyalı teşkilat ve topçu müşavirleri vardır. Askerî öğrenim ve vasıf, daha hafif harcırah ve bürokrasi bedeliyle iyileşir."
 sp_i32_mil_complete_qual: "Askerî Kadrolar: Vasıf"
 sp_i32_mil_complete_qual_desc: "Son kurmay işbirliği kısa süre vasıfı güçlendirir."
 sp_i32_mil_complete_af: "Askerî Kadrolar: Silahlı Kuvvetler"
 sp_i32_mil_complete_af_desc: "Son kurmay işbirliği kısa süre Silahlı Kuvvetler çekimini güçlendirir."
 sp_i32_mil_dispute: "Kurmay Heyeti Anlaşmazlığı"
 sp_i32_mil_dispute_desc: "Yabancı kurmaylarla sürtüşme bir süre Silahlı Kuvvetler onayını soğutmuştur."
 sp_i32_mil_overrun: "Askerî Heyet Aşımı"
 sp_i32_mil_overrun_desc: "Kara askerî heyet planlanandan pahalıya mal olmaktadır."
 sp_i32_mil_overrun_aus: "Askerî Heyet Aşımı"
 sp_i32_mil_overrun_aus_desc: "Avusturya kara askerî heyeti planlanandan pahalıya mal olmaktadır."

 sp_i32_opinion_moltke: "Prusya Askerî Yardımı — Baş Müşavir (Helmuth von Moltke). Yalnızca sunum; bu günlük ekstra Moltke düzenleyicisi vermez."

 sp_i32.12.t: "Hangi Kara Heyeti?"
 sp_i32.12.d: "Askerî program antlaşma yardımından boşalınca Bab-ı Ali Avrupa kurmay heyeti davet edebilir. Prusya veya Almanya en derin kurmay paketini sunar; Fransa, Mısır krizi engellemediğinde akademi ve topçu; Britanya yalnızca başlıca ortak Britanya ise ve bahriye programı yoksa sınırlı gözlem; Avusturya ikincil teşkilat yolu. Hazine hareket günü öder."
 sp_i32.12.f: "Haritalar, talimler ve tercümeler, onları öğretecek adamlardan önce gelir."
 sp_i32.12.ger: "Prusya / Almanya — Kurmay Islahı"
 sp_i32.12.fra: "Fransa — Akademiler ve Topçu"
 sp_i32.12.gbr: "Britanya — Sınırlı Kurmay Gözlemi"
 sp_i32.12.aus: "Avusturya — Teşkilat ve Topçu"
 sp_i32.12.none: "Bu yıl değil"

 sp_i32.33.t: "Askerî Heyeti Bitir?"
 sp_i32.33.d: "Şimdi iptal harcırahı bitirir ama ortak bunu hakaret sayar. Bitmemiş kurmay işi tamamlanma ödülü vermez."
 sp_i32.33.f: "Müşavirler azledilebilir. İtibar buharlılardan daha uzağa gider."
 sp_i32.33.a: "Heyeti bitir"
 sp_i32.33.b: "Heyet sürsün"

 sp_i32.43.t: "Askerî Heyet Sona Erer"
 sp_i32.43.d: "Kurmaylar ayrılır. Geride bıraktıkları kısa süre vasıfı ve Silahlı Kuvvetler çekimini güçlendirir. Nabız kısadır; antlaşma dönemi bonusları tekrarlanmaz."
 sp_i32.43.f: "Talim defterleri kapanır. Kimin usulünün kalacağı tartışması kapanmaz."
 sp_i32.43.a: "Sonuçları kurumsallaştır"

 sp_i32.53.t: "Askerî Heyette Sıkıntı"
 sp_i32.53.d: "Kara askerî heyet planlandığı gibi ilerlememektedir. İş sürer, fakat daha ağır şartlarda."
 sp_i32.53.d_dispute: "Yabancı kurmaylarla sürtüşme bir süre Silahlı Kuvvetler onayını soğutmuştur."
 sp_i32.53.d_delay: "Keşif, dil veya ortak siyaseti takvimi uzatmıştır. Heyet planlanandan uzun sürecektir."
 sp_i32.53.d_overrun: "Ücret, konak veya teçhizat bütçeyi aşmıştır. Ek masraflar bir süre hazineye yük olacaktır."
 sp_i32.53.f: "Talim üzerine bir kavga bir mevsimi geciktirebilir."
 sp_i32.53.a: "İdare ederiz"

 sp_je_learning_from_europe_status_industrial_fra: "Fransa ile bir sanayi heyeti sürmektedir. Üretim öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_industrial_gbr: "Britanya ile bir sanayi heyeti sürmektedir. Üretim öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_industrial_ger: "Almanya ile bir sanayi heyeti sürmektedir. Üretim öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_industrial_pru: "Prusya ile bir sanayi heyeti sürmektedir. Üretim öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_industrial_cooldown: "Sanayi heyet programı son görevden sonra beklemededir. Bu süre dolmadan yeni bir heyet başlatılamaz."
 sp_je_learning_from_europe_status_naval_gbr: "Britanya ile bir bahriye ıslah heyeti sürmektedir. Bahriye öğrenimi sürer; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_naval_fra: "Fransa ile bir bahriye ıslah heyeti sürmektedir. Bahriye öğrenimi sürer; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_naval_cooldown: "Bahriye ıslah programı son görevden sonra beklemededir. Bu süre dolmadan yeni bir heyet başlatılamaz."

 sp_i32_btn_send_industrial: "Sanayi Heyeti Başlat"
 sp_i32_btn_send_industrial_desc: "Mekanik aletler araştırıldıktan ve kadrolu üniversite veya birleşik bir imalat tesisi mevcut olduktan sonra Avrupalı sanayi müşavirleri davet et. Ortaklar en az Tarafsız olmalıdır. Hazine hareket günü öder; harcırah ve bürokrasi izler.\n\nFabrika üretkenliği, inşaat, basım veya vergi gücü vermez."
 sp_i32_btn_send_industrial_effect_tt: "Ortak seçimini açar. Hazine masrafı aşağıda gösterilir."

