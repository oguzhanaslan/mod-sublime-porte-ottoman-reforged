 sp_i32.15.t: "Hangi Sanayi Ortağı?"
 sp_i32.15.d: "Mekanik aletler ve yerli bir sanayi dayanağıyla Bab-ı Ali Avrupalı sanayi müşavirleri davet edebilir. Britanya, Fransa veya Prusya ya da Almanya ev sahipliği yapabilir. Hazine hareket günü öder."
 sp_i32.15.f: "Değirmen planları, onları işler tutacak adamlardan önce gelir."
 sp_i32.15.gbr: "Britanya — Sanayi Müşavirleri"
 sp_i32.15.fra: "Fransa — Sanayi Müşavirleri"
 sp_i32.15.german: "Prusya / Almanya — Sanayi Müşavirleri"
 sp_i32.15.none: "Bu yıl değil"

 sp_i32.34.t: "Sanayi Heyetini Bitir?"
 sp_i32.34.d: "Şimdi iptal harcırahı bitirir, fakat ortak bunu hakaret sayar. Bitmemiş iş tamamlanma ödülü vermez."
 sp_i32.34.f: "Mühendisler kovulabilir. İtibar makineden uzağa gider."
 sp_i32.34.a: "Heyeti bitir"
 sp_i32.34.b: "Heyet sürsün"

 sp_i32.44.t: "Sanayi Heyeti Sona Erer"
 sp_i32.44.d: "Müşavirler ayrılır. Geride bıraktıkları kısa süre vasıfı güçlendirir. Nabız kısadır; fabrikalar yine de inşa edilmelidir."
 sp_i32.44.f: "Planlar kalır. Kimin usulünün kalacağı tartışması kapanmaz."
 sp_i32.44.a: "Sonuçları kurumsallaştır"

 sp_i32.54.t: "Sanayi Heyetinde Sıkıntı"
 sp_i32.54.d: "Sanayi heyeti planlandığı gibi ilerlememektedir. İş sürer, fakat daha ağır şartlarda."
 sp_i32.54.d_overrun: "Ücret, konak veya teçhizat bütçeyi aşmıştır. Ek masraflar bir süre hazineye yük olacaktır."
 sp_i32.54.d_chill: "Diplomatik sürtüşme ortaklığı soğutmuştur. Tamamlanma ilişkileri ısıtmayacaktır."
 sp_i32.54.f: "Sözleşmeler üzerine bir kavga bir mevsimi bozabilir."
 sp_i32.54.a: "İdare ederiz"

 sp_i32.16.t: "Hangi Bahriye Ortağı?"
 sp_i32.16.d: "Buhar veya vida teknolojisi eldeyken Bab-ı Ali Avrupalı bir bahriye heyeti davet edebilir. Britanya Samimi ilişkiler veya birincil ortak olmayı ister; Fransa Tarafsız ister. Hazine hareket günü öder."
 sp_i32.16.f: "Haritalar ve makineler, onları öğretecek adamlardan önce gelir."
 sp_i32.16.gbr: "Britanya — Bahriye Islahı"
 sp_i32.16.fra: "Fransa — Bahriye Islahı"
 sp_i32.16.none: "Bu yıl değil"

 sp_i32.35.t: "Bahriye Islahını Bitir?"
 sp_i32.35.d: "Şimdi iptal harcırahı bitirir, fakat ortak bunu hakaret sayar. Bitmemiş iş tamamlanma ödülü vermez."
 sp_i32.35.f: "Müşavirler kovulabilir. İtibar vapurdan uzağa gider."
 sp_i32.35.a: "Heyeti bitir"
 sp_i32.35.b: "Heyet sürsün"

 sp_i32.45.t: "Bahriye Heyeti Sona Erer"
 sp_i32.45.d: "Bahriye heyeti ayrılır. Geride bıraktığı kısa süre vasıfı güçlendirir. Nabız kısadır; tersaneler yine de inşa edilmelidir."
 sp_i32.45.f: "Seyir defterleri kapanır. Kimin usulünün kalacağı tartışması kapanmaz."
 sp_i32.45.a: "Sonuçları kurumsallaştır"

 sp_i32.55.t: "Bahriye Islahında Sıkıntı"
 sp_i32.55.d: "Bahriye heyeti planlandığı gibi ilerlememektedir. İş sürer, fakat daha ağır şartlarda."
 sp_i32.55.d_overrun: "Ücret, konak veya teçhizat bütçeyi aşmıştır. Ek masraflar bir süre hazineye yük olacaktır."
 sp_i32.55.d_delay: "Keşif, dil veya ortak siyaseti takvimi uzatmıştır. Heyet planlanandan uzun sürecektir."
 sp_i32.55.f: "Talim üzerine bir kavga bir mevsimi geciktirebilir."
 sp_i32.55.a: "İdare ederiz"
