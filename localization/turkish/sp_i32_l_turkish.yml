l_turkish:
 sp_je_learning_from_europe: "Avrupa'dan Öğrenmek"
 sp_je_learning_from_europe_reason: "Bab-ı Ali zaten talebe göndermekte ve Avrupalı müşavirler barındırmaktadır. Bu günlük o âdeti izler: masraflı, sınırlı ve Tanzimat'tan bağımsızdır. Kendi başına tamamlanmaz veya başarısız olmaz.\n\nProgram kapasitesi varsayılan 2, kadrolu üniversite veya on iki ay üst üste bürokrasi fazlasından sonra 3, yerleşik yerli ihtisasla 4'tür. Devralınan askerî yardım askerî aileyi doldurur. Bu günlük ikinci bir Moltke veya antlaşma bonusu vermez."

 sp_je_learning_from_europe_status_students_fra_ma: "Talebeler Fransa'dadır. Mevcut Prusya askerî yardım antlaşması askerî aileyi zaten doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_gbr_ma: "Talebeler Britanya'dadır. Mevcut Prusya askerî yardım antlaşması askerî aileyi zaten doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_ger_ma: "Talebeler Almanya'dadır. Mevcut askerî yardım antlaşması askerî aileyi zaten doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_pru_ma: "Talebeler Prusya'dadır. Mevcut Prusya askerî yardım antlaşması askerî aileyi zaten doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_aus_ma: "Talebeler Avusturya'dadır. Mevcut Prusya askerî yardım antlaşması askerî aileyi zaten doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_fra: "Avrupa'daki talebeler: Fransa. Beş yıllık program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_gbr: "Avrupa'daki talebeler: Britanya. Beş yıllık program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_ger: "Avrupa'daki talebeler: Almanya. Beş yıllık program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_pru: "Avrupa'daki talebeler: Prusya. Beş yıllık program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_aus: "Avrupa'daki talebeler: Avusturya. Beş yıllık program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_ma_moltke: "Prusya askerî yardımı zaten yürürlüktedir. Helmuth von Moltke bu antlaşma heyetindedir. Bu günlük onu tanıtır; ekstra bir Moltke düzenleyicisi vermez."
 sp_je_learning_from_europe_status_ma_post_moltke: "Prusyalı eğitmenler mevcut askerî yardım antlaşması altında kalır (Moltke sonrası). Askerî aile, antlaşma bitene kadar dolu sayılır. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_cooldown: "Avrupa'ya talebe programı son kohorttan sonra beklemededir. Bu süre dolmadan yeni bir grup gönderilemez."
 sp_je_learning_from_europe_status_cap4: "Avrupa'da talebe yoktur. Program kapasitesi 4'tür. Altın, diplomasi ve boş bir aile yeri izin verirse yeni bir talebe programı başlatılabilir."
 sp_je_learning_from_europe_status_cap3: "Avrupa'da talebe yoktur. Program kapasitesi 3'tür. Altın, diplomasi ve boş bir aile yeri izin verirse yeni bir talebe programı başlatılabilir."
 sp_je_learning_from_europe_status_cap2: "Avrupa'da talebe yoktur. Program kapasitesi 2'dir; devralınan askerî yardım bir aileyi zaten kullanır. Avrupa'ya talebe hâlâ ikinci program olarak başlatılabilir."

 sp_i32_btn_send_students: "Avrupa'ya Talebe Gönder"
 sp_i32_btn_send_students_desc: "Fransa, Britanya, Prusya veya Almanya ya da Avusturya'ya beş yıllık bir talebe heyeti gönder.\n\n#bold Masraf:#! 8.000 £ (Avusturya için 6.000 £); yurtdışındayken haftalık harcırah ve bürokrasi yükü.\n#bold Kapasite:#! varsayılan 2 aile; kadrolu üniversite veya on iki ay bürokrasi fazlasından sonra 3; 4 yalnızca yerleşik yerli ihtisasla.\nBu, muharebe gücü, inşaat veya ham araştırma hızı vermez."
 sp_i32_btn_send_students_effect_tt: "Avrupa'ya talebe programı için güzergâh seçimini açar"

 sp_i32_btn_cancel_students: "Talebe Programını Durdur"
 sp_i32_btn_cancel_students_desc: "Beş yıl dolmadan talebeleri geri çağır. Ev sahibi bunu hakaret sayar, aktif etkiler biter ve aile bir yıl beklemeye girer. Harcanmış altın iade edilmez."
 sp_i32_btn_cancel_students_effect_tt: "Avrupa'ya talebe programını durdurmayı onayla"

 sp_i32_students_not_active_tt: "Avrupa'ya talebe programı zaten yürümüyor"
 sp_i32_students_cooldown_tt: "Avrupa'ya talebe ailesi beklemede değil"
 sp_i32_capacity_allows_tt: "Program kapasitesinde boş bir aile yeri var"
 sp_i32_students_destination_tt: "En az bir uygun Avrupa güzergâhı var"
 sp_i32_students_cancel_possible_tt: "Avrupa'ya talebe programı aktif ve henüz tamamlanma aşamasında değil"

 sp_i32_students_fra_eligible_tt: "Fransa var, bizimle savaşta değil, ilişkileri Zayıf'tan iyi, tavrı düşmanca değil ve en az 8.000 £'imiz var"
 sp_i32_students_gbr_eligible_tt: "Büyük Britanya var, bizimle savaşta değil, ilişkileri Zayıf'tan iyi, tavrı düşmanca değil ve en az 8.000 £'imiz var"
 sp_i32_students_german_eligible_tt: "Almanya — yoksa Prusya — uygun bir ev sahibidir: savaşta değil, ilişkiler Zayıf'tan iyi, tavır düşmanca değil ve en az 8.000 £ var"
 sp_i32_students_aus_eligible_tt: "Avusturya var, bizimle savaşta değil, ilişkileri Zayıf'tan iyi, tavrı düşmanca değil ve en az 6.000 £'imiz var"

 sp_i32_spb_students: "Avrupa'daki Talebeler"
 sp_i32_spb_students_desc: "Beş yıllık talebe heyetinin kalan süresi. Çubuk yalnızca göstergedir; asıl sayaç saklanan ay sayısıdır."
 sp_i32_spb_students_second: "Talebeler, program sayacı bitene kadar yurtdışında kalır."
 sp_i32_spb_students_tick: "Avrupa'ya talebe programının aylık ilerlemesi"
 sp_i32_spb_military: "Askerî Yardım"
 sp_i32_spb_military_desc: "Mevcut gelen askerî yardım antlaşması askerî aileyi doldurur. Bu lamba geri saymaz ve bu günlükten ekstra askerî düzenleyici vermez."
 sp_i32_spb_military_second: "Mevcut antlaşma etkileri madde bitene kadar yürürlükte kalır."

 sp_i32_students_fra_act: "Fransa'daki Talebeler"
 sp_i32_students_fra_act_desc: "Osmanlı talebeleri Fransa'da okumaktadır. Toplum teknolojisi biraz daha hızlı yayılır ve vasıf biraz artar; karşılığı harcırah ile bürokrasidir. Aydınlar memnundur."
 sp_i32_students_gbr_act: "Britanya'daki Talebeler"
 sp_i32_students_gbr_act_desc: "Osmanlı talebeleri Britanya'da okumaktadır. Üretim teknolojisi biraz daha hızlı yayılır ve vasıf biraz artar; karşılığı harcırah ile bürokrasidir. Sanayiciler memnundur."
 sp_i32_students_pru_act_spread: "Prusya'daki Talebeler"
 sp_i32_students_pru_act_spread_desc: "Osmanlı talebeleri Prusya'da okumaktadır. Askerî teknoloji biraz daha hızlı yayılır ve vasıf biraz artar. Bu çeşit yalnızca gelen askerî yardım o yayılımı henüz elinde tutmuyorsa kullanılır."
 sp_i32_students_pru_act_qual_only: "Prusya'daki Talebeler"
 sp_i32_students_pru_act_qual_only_desc: "Osmanlı talebeleri Prusya'da okumaktadır. Vasıf biraz artar; askerî teknoloji yayılımı mevcut yardım antlaşmasına bırakılır. Ordunun onayı yine de yükselir."
 sp_i32_students_aus_act: "Avusturya'daki Talebeler"
 sp_i32_students_aus_act_desc: "Osmanlı talebeleri Avusturya'da okumaktadır. Toplum teknolojisi mütevazı yayılır ve idare biraz toparlanır; harcırah ve bürokrasi yükü daha küçüktür."

 sp_i32_students_complete_state: "Dönen Kadrolar: Devlet Hizmeti"
 sp_i32_students_complete_state_desc: "Dönen talebeler devlet hizmetine yerleştirilmiştir. Bürokrasi iki yıl biraz daha verimlidir."
 sp_i32_students_complete_schools: "Dönen Kadrolar: Mektepler ve Üniversiteler"
 sp_i32_students_complete_schools_desc: "Dönen talebeler mektep ve üniversitelere yerleştirilmiştir. Eğitim erişimi iki yıl hafifçe artar."
 sp_i32_students_complete_technical: "Dönen Kadrolar: Teknik Müesseseler"
 sp_i32_students_complete_technical_desc: "Dönen talebeler teknik müesseselere yerleştirilmiştir. Vasıf iki yıl hafifçe artar."
 sp_i32_students_complete_military: "Dönen Kadrolar: Askerî Müesseseler"
 sp_i32_students_complete_military_desc: "Dönen talebeler askerî mektep ve erkân-ı harp dairelerine yerleştirilmiştir. Vasıf iki yıl hafifçe artar."

 sp_i32_students_overrun: "Talebe Stipendi Aşımı"
 sp_i32_students_overrun_desc: "Talebe heyeti beklenenden pahalıya mal olmaktadır. Bir yıl ekstra harcırah ödenir."
 sp_i32_students_overrun_aus: "Talebe Stipendi Aşımı"
 sp_i32_students_overrun_aus_desc: "Avusturya talebe heyeti beklenenden pahalıya mal olmaktadır. Bir yıl ekstra harcırah ödenir."
 sp_i32_students_radicals: "Dönen Radikaller"
 sp_i32_students_radicals_desc: "Dönen talebelerin bir kısmı tedirgin edici siyasi fikirler getirmiştir. Aydınlar iki yıl daha fazla taraftar çeker; Dindarlar hoşnutsuzdur."

 sp_i32.11.t: "Nereye Gönderelim?"
 sp_i32.11.d: "Tercüme Odası ve nezaretler bir kohort ayırabilir, dördünü birden değil. Fransa idare ve edebiyât; Britanya sanayi ve mühendislik; Prusya erkân-ı harp mektebi; Avusturya daha yakın ve ucuz bir akademi sunar. Hazine hareket günü öder; kaldıkları her hafta harcırah onları izler."
 sp_i32.11.f: "Bir yanda isim listesi, öbür yanda liman listesi. İkisini de birinin imzalaması gerekir."
 sp_i32.11.fra: "Fransa'ya gönder"
 sp_i32.11.gbr: "Britanya'ya gönder"
 sp_i32.11.ger: "Prusya veya Almanya'ya gönder"
 sp_i32.11.aus: "Avusturya'ya gönder"
 sp_i32.11.none: "Bu yıl değil"

 sp_i32.30.t: "Talebeler Geri Çağrılsın mı?"
 sp_i32.30.d: "Heyeti şimdi durdurmak kalan harcırahı kurtarır, fakat ev sahibi bunu hakaret sayar. Yurtdışındaki kadrolar tahsillerini bitirmez ve aile bir yıl yeniden başlatılamaz."
 sp_i32.30.f: "Vapur geri döndürülebilir. İtibar döndürülemez."
 sp_i32.30.a: "Geri çağır"
 sp_i32.30.b: "Program devam etsin"

 sp_i32.40.t: "Talebeler Dönüyor"
 sp_i32.40.d: "Kohort vatana döndü. Defterleri, Bab-ı Ali onları işe koymadıkça tozlanır. Devlet hizmeti, mektepler, teknik daireler veya askerî müesseseler — her yol kısa bir kapasite nabzıdır, kalıcı imtiyaz değil."
 sp_i32.40.f: "Başka bir ülkenin nizamını gördüler. Soru, o nizamın bizde nereye oturacağıdır."
 sp_i32.40.state: "Devlet hizmetine yerleştir"
 sp_i32.40.schools: "Mektep ve üniversitelere yerleştir"
 sp_i32.40.technical: "Teknik müesseselere yerleştir"
 sp_i32.40.military: "Askerî müesseselere yerleştir"

 sp_i32.50.t: "Yurtdışındaki Talebelerde Sıkıntı"
 sp_i32.50.d: "Heyetten gelen raporlar düzensiz. Program sürer, fakat bütçelediğimiz şartlarda değil."
 sp_i32.50.d_overrun: "Harcırah, talebelerin gerçek harcamasını karşılamıyor. Hazine bir yıl yarım kat daha fazla ödeyecek."
 sp_i32.50.d_delay: "İmtihanlar, hastalık veya kapanan bir akademi kursu uzattı. Bir yıl daha yurtdışında kalacaklar."
 sp_i32.50.d_remain: "Ev sahibi onların kalmasını istedi. Fazladan bir yıl zaman kaybettirir, fakat ilişkileri biraz ısıtır."
 sp_i32.50.d_radicals: "Talebelerin bir kısmı ruhen erken döndü: daha siyasi, daha sabırsız. Aydınlar bundan güç alır; Dindarlar almaz."
 sp_i32.50.f: "Bir mektuba cevap verilir. Bir fikir modasına zor."
 sp_i32.50.a: "İdare ederiz"
