l_turkish:
 sp_je_learning_from_europe: "Avrupa'dan Öğrenmek"
 sp_je_learning_from_europe_reason: "Bab-ı Ali zaten talebe göndermekte ve Avrupalı müşavirler barındırmaktadır. Bu günlük o âdeti izler: masraflı, sınırlı ve Tanzimat'tan bağımsızdır. Kendi başına tamamlanmaz veya başarısız olmaz.\n\nProgram kapasitesi varsayılan 2, kadrolu üniversite veya on iki ay üst üste bürokrasi fazlasından sonra 3, yerleşik yerli ihtisasla 4'tür. Devralınan askerî yardım, antlaşma bitene kadar askerî programı doldurur; sonrasında kara askerî heyeti davet edilebilir. Teknik, eğitim, sanayi ve bahriye programları da aktifken birer program yerini tutar. Bu günlük ikinci bir Moltke veya antlaşma bonusu vermez."

 sp_je_learning_from_europe_status_students_fra_ma: "Talebeler Fransa'dadır. Prusya askerî yardımı zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_gbr_ma: "Talebeler Britanya'dadır. Prusya askerî yardımı zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_ger_ma: "Talebeler Almanya'dadır. Askerî yardım zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_pru_ma: "Talebeler Prusya'dadır. Prusya askerî yardımı zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_aus_ma: "Talebeler Avusturya'dadır. Prusya askerî yardımı zaten yürürlüktedir ve askerî programı doldurur. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_fra: "Avrupa'daki talebeler: Fransa. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_gbr: "Avrupa'daki talebeler: Britanya. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_ger: "Avrupa'daki talebeler: Almanya. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_pru: "Avrupa'daki talebeler: Prusya. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_students_aus: "Avrupa'daki talebeler: Avusturya. Program sürmektedir. Dönen kadrolar program bitince yerleştirilecektir."
 sp_je_learning_from_europe_status_technical_fra: "Fransa ile bir teknik heyet sürmektedir. Üretim öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_technical_gbr: "Britanya ile bir teknik heyet sürmektedir. Üretim öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_technical_ger: "Almanya ile bir teknik heyet sürmektedir. Üretim öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_technical_pru: "Prusya ile bir teknik heyet sürmektedir. Üretim öğrenimi ve vasıf iyileşir; harcırah ile bürokrasi devlete yük olur."
 sp_je_learning_from_europe_status_education_expand: "Eğitim işbirliği Avrupa tarzı mektepleri genişletmektedir. Toplum öğrenimi iyileşir; Dindarlar ve Eşraf bedeli ağır bulur."
 sp_je_learning_from_europe_status_education_limit: "Eğitim işbirliği teknik ve askerî mekteplerle sınırlıdır. Toplum öğrenimi ve vasıf, daha hafif bir siyasi bedelle iyileşir."
 sp_je_learning_from_europe_status_education_integrate: "Eğitim işbirliği mevcut müesseselere entegre edilmektedir. Toplum öğrenimi ve idare iyileşir."
 sp_je_learning_from_europe_status_ma_moltke: "Prusya askerî yardımı zaten yürürlüktedir. Helmuth von Moltke bu antlaşma heyetindedir. Bu günlük onu tanıtır; ekstra bir Moltke düzenleyicisi vermez."
 sp_je_learning_from_europe_status_ma_post_moltke: "Prusyalı eğitmenler mevcut askerî yardım antlaşması altında kalır (Moltke sonrası). Askerî program, antlaşma bitene kadar dolu sayılır. Bu günlük ikinci bir askerî bonus eklemez."
 sp_je_learning_from_europe_status_students_cooldown: "Avrupa'ya talebe programı son kohorttan sonra beklemededir. Bu süre dolmadan yeni bir grup gönderilemez."
 sp_je_learning_from_europe_status_technical_cooldown: "Teknik heyet programı son görevden sonra beklemededir. Bu süre dolmadan yeni bir heyet başlatılamaz."
 sp_je_learning_from_europe_status_education_cooldown: "Eğitim işbirliği son programdan sonra beklemededir. Bu süre dolmadan yeni bir odak başlatılamaz."
 sp_je_learning_from_europe_status_cap4: "Avrupa'da talebe yoktur. Program kapasitesi: 4. Altın ve diplomasi izin verirse yeni bir program başlatılabilir."
 sp_je_learning_from_europe_status_cap3: "Avrupa'da talebe yoktur. Program kapasitesi: 3. Altın ve diplomasi izin verirse yeni bir program başlatılabilir."
 sp_je_learning_from_europe_status_cap2: "Avrupa'da talebe yoktur. Program kapasitesi: 2. Devralınan askerî yardım bir programı zaten kullanır; Avrupa'ya talebe hâlâ ikinci program olarak başlatılabilir."

 sp_i32_btn_send_students: "Avrupa'ya Talebe Gönder"
 sp_i32_btn_send_students_desc: "Fransa, Britanya, Prusya veya Almanya ya da Avusturya'ya bir talebe heyeti gönder. Peşin hazine masrafını güzergâh seçimi belirler. Yurtdışındayken harcırah ve bürokrasi yükü program düzenleyicisinin parçasıdır.\n\n#bold Kapasite:#! varsayılan 2 program; kadrolu üniversite veya on iki ay üst üste bürokrasi fazlasından sonra 3; 4 yalnızca yerleşik yerli ihtisasla.\nBu, muharebe gücü, inşaat veya ham araştırma hızı vermez."
 sp_i32_btn_send_students_effect_tt: "Güzergâh seçimini açar. Seçilen ev sahibi, aşağıda gösterilen hazine masrafını uygular."

 sp_i32_btn_cancel_students: "Talebe Programını Durdur"
 sp_i32_btn_cancel_students_desc: "Program bitmeden talebeleri geri çağır. Ev sahibi bunu hakaret sayar ve aktif etkiler biter. Harcanmış altın iade edilmez."
 sp_i32_btn_cancel_students_effect_tt: "Avrupa'ya talebe programını durdurmayı onayla"

 sp_i32_btn_send_technical: "Teknik Heyet Başlat"
 sp_i32_btn_send_technical_desc: "Demiryolu, madencilik, tersane veya makine için Avrupalı mühendisler davet et. Mekanik aletler, atmosferik motor veya bir üniversite gerekir. Ortaklar en az Tarafsız olmalıdır. Hazine hareket günü öder; harcırah ve bürokrasi izler.\n\nİnşaat verimliliği veya fabrika üretkenliği vermez."
 sp_i32_btn_send_technical_effect_tt: "Uzmanlık ve ortak seçimini açar. Hazine masrafı aşağıda gösterilir."

 sp_i32_btn_cancel_technical: "Teknik Heyeti Durdur"
 sp_i32_btn_cancel_technical_desc: "Teknik heyeti erken bitir. Ortak bunu hakaret sayar ve aktif etkiler biter. Harcanmış altın iade edilmez."
 sp_i32_btn_cancel_technical_effect_tt: "Teknik heyeti durdurmayı onayla"

 sp_i32_btn_send_education: "Eğitim İşbirliği Başlat"
 sp_i32_btn_send_education_desc: "Avrupa ile mektep ve müessese işbirliğini derinleştir. Okullar yatırımı ve kadrolu üniversite veya yeterli okuryazarlık gerekir. Genişlet, Sınırla veya Entegre et seç — her yol farklı bir siyasi ve idari yolu kilitler.\n\nTanzimat maarif yeniden teşkilatlandırma düzenleyicisi hâlâ aktifken Genişlet engellenir."
 sp_i32_btn_send_education_effect_tt: "Odak ve ortak seçimini açar. Hazine masrafı aşağıda gösterilir."

 sp_i32_btn_cancel_education: "Eğitim İşbirliğini Durdur"
 sp_i32_btn_cancel_education_desc: "Eğitim işbirliğini erken bitir. Ortak bunu hakaret sayar ve aktif etkiler biter. Harcanmış altın iade edilmez."
 sp_i32_btn_cancel_education_effect_tt: "Eğitim işbirliğini durdurmayı onayla"

