 sp_building_topkapi_palace_desc:0 "Sarayburnu'ndaki tarihi saray külliyesi: törensel hanedan merkezi, hazine ve Osmanlı saltanatının kalan idari-sembolik makamı."
 sp_building_dolmabahce_palace:0 "Dolmabahçe Sarayı"
 sp_building_dolmabahce_palace_desc:0 "Boğaziçi'nde modern bir saltanat sarayı. İnşası yalnızca başlangıçtır; divanın Topkapı'dan taşınması gerekir."
 sp_pm_topkapi_imperial_complex:0 "Saray-ı Hümâyun Külliyesi"
