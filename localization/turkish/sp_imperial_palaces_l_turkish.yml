 sp_i27.1.t:0 "Divan Dolmabahçe'de"
 sp_i27.1.d:0 "Saltanat hanedanı ve kalemler Dolmabahçe'ye taşındı. Topkapı Sarayburnu'nda eski saray külliyesi olarak kalır—hâlâ bir hanedan abidesi, artık gündelik divanın makamı değil."
 sp_i27.1.f:0 "Boğaz divanı alır. Burun hatırayı tutar."
 sp_i27.1.a:0 "Emredildi"
