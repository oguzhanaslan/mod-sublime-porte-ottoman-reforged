l_turkish:
 sp_i23.1.t:0 "Trablusgarp'ta Otoritenin İadesi"
 sp_i23.1.d:0 "1835'te Bâb-ı Âli, Karamanlı hanedanının uzun fiilî idaresine son verip [SCOPE.sCountry('sp_i23_tri_scope').GetName] şehrine bir Osmanlı valisi göndermiştir. Kıyıda doğrudan imparatorluk otoritesi yeniden kurulmuştur. Çöl hinterlandı başka meseledir: Fizan henüz yatışmamıştır ve Kirenaika içleri kıyı idaresine bir vilayet gibi boyun eğmez. Sahili tutmak, Sahra'yı hükmetmek değildir."
 sp_i23.1.f:0 "Padişahın valisi Trablus'ta oturur. Çöl yerinde durmaz."
 sp_i23.1.a:0 "Kabul et"
 sp_i23.2.t:0 "Bey ve Bâbıâli"
 sp_i23.2.d:0 "[SCOPE.sCountry('sp_i23_tun_scope').GetName] Hüseyni Beyi cuma hutbesinde hâlâ padişahın adını okutur; buna rağmen hanedan, eyaleti kendi eviymiş gibi yönetir. Trablusgarp'ta doğrudan otoritenin iadesinden sonra vekiller, Tunus'un daha sıkı itaate — haraç, istişare ve Bâb-ı Âli'nin daha açık tanınmasına — mı zorlanacağını, yoksa uzun süredir süren pratik özerkliğinde mi bırakılacağını sorar."
 sp_i23.2.f:0 "Tâbiyet hukuki bir vakıadır. Bey'in hanedanı siyasi bir vakıadır."
 sp_i23.2.a:0 "Bey'e baskı uygula"
 sp_i23.2.b:0 "Bey'in özerkliğini tanı"
 sp_i23.3.t:0 "Tunus'ta Fransız Baskısı"
 sp_i23.3.d:0 "Paris, Tunus'u izler. Hüseyni sarayında zaten tanıdık olan [SCOPE.sCountry('sp_i23_fra_scope').GetAdjective] tavsiyesi, Bâb-ı Âli'den Bey'in hanedanına dokunmamasını ister. Boyun eğmek Fransa ile tartışmayı yatıştırır ve Tunus ile sürtüşmeyi azaltır; Bâb-ı Âli'nin duruşunu korumak hem Paris'e hem Bey'e Osmanlı tâbiyetinin boş bir laf olmadığını hatırlatır."
 sp_i23.3.d.pretension:0 "Paris Tunus'u izler; [SCOPE.sCountry('sp_i23_fra_scope').GetAdjective] emelleri artık söylenti değildir. Paris'ten gelen tavsiye, Bâb-ı Âli'nin kenara çekilmesini ister. Boyun eğmek Fransa'yı idare eder; duruşu korumak Tunus'un bir Fransız meselesi sayılmasını reddeder."
 sp_i23.3.d.pressed:0 "Paris, Tunus'u izler. Bâb-ı Âli Bey'den daha sıkı itaat istemiştir; [SCOPE.sCountry('sp_i23_fra_scope').GetAdjective] elçiler şimdi daha ileri gidilmemesini uyarır. Boyun eğmek Fransa ve Hüseyni sarayı ile kavgayı yatıştırır; duruşu korumak Bâb-ı Âli'nin sözünden dönmediğini gösterir."
 sp_i23.3.d.accommodated:0 "Paris, Tunus'u izler. Bâb-ı Âli Bey'in pratik özerkliğiyle yaşamayı seçmiştir; [SCOPE.sCountry('sp_i23_fra_scope').GetAdjective] tavsiyesi bu müsamahanın siyaset haline gelmesini ister. Boyun eğmek Paris'i ve Hüseyni sarayını memnun eder; duruşu korumak ileride daha sıkı tâbiyete kapı açık bırakır."
 sp_i23.3.f:0 "Paris'ten gelen dostane bir söz, yine de Tunus'ta kimin konuşabileceğine dair bir sözdür."
 sp_i23.3.a:0 "Fransız tavsiyesine uy"
 sp_i23.3.b:0 "Bâbıâli'nin duruşunu koru"
 sp_i23.4.t:0 "Kızıldeniz'de İngiltere"
 sp_i23.4.d:0 "Güney yaklaşımlarından gelen haberler, Hindistan yolunda Aden'de bir [SCOPE.sCountry('sp_i23_gbr_scope').GetAdjective] durağından söz eder. Londra kasabayı şimdiden tutuyor olsun ya da yalnızca arıyor olsun, Kızıldeniz artık sakin bir Osmanlı ufku değildir. Bâb-ı Âli haberdardır; bu, Yemen'de bir sefere çağrı değildir."
 sp_i23.4.d.present:0 "[SCOPE.sCountry('sp_i23_gbr_scope').GetName] Arabistan ve Yemen kıyılarında zaten vardır. Aden, uzak bir kalemden gelen söylenti değil, Hindistan yolundaki bir durak olarak anılır. Kızıldeniz bir İngiliz meselesi olmuştur. Bâb-ı Âli haberdardır; bu, Yemen'i yeniden fethetmeye çağrı değildir."
 sp_i23.4.f:0 "Kızıldeniz kapısındaki bir kömür durağı, henüz haritada görünmese bile bir imparatorluk vakıasıdır."
 sp_i23.4.a:0 "Kabul et"
