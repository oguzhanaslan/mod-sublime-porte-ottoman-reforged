 sp_ct_insp_tanzimat_desc: "Hasta Adam çekirdek ıslahat hedeflerini tamamla. Ayrıntı için gereksinimlerin üzerine gel."
 sp_ct_insp_tanzimat_flavor: "İç Tanzimat ıslahatı sonraki kimlik siyasetini açar. İsteğe bağlı Suriye/Mısır günlükleri çekirdek hedefin yerini tutmaz."
 sp_ct_insp_tanzimat_rewards: "Çekirdek ıslahat günlüğünün tamamlanması Tanzimat'ı bitmiş sayar ve sonraki imparatorluk kampanyalarını açar."

 sp_ct_insp_post_tanzimat_desc: "Bilgilendirici Tanzimat Sonrası Çağ günlüğü ve siyasi lezzet yayı: tartışma, Yeni Osmanlılar, anayasal tanıma, Kanun-i Esasi ilanı ve Hamidiye restorasyonu."
 sp_ct_insp_post_tanzimat_flavor: "Bu yay, iç Tanzimat ıslahatından sonra temsil ve saltanat hakkı tartışmasını izler. Tek başına yeni kanun çıkarmaz."
 sp_ct_insp_post_tanzimat_complete_note: "Yay, Hamidiye restorasyonu gerçekleştiğinde veya Kanun-i Esasi ilan edilip tarih 1886.1.1 veya sonrasındaysa tamamlanır."
 sp_ct_insp_post_tanzimat_rewards: "Olay seçeneklerinden süreli lezzet değiştiricileri; yeni kurum yok. Sunum günlüğü yalnızca durumu izler."

 sp_ct_insp_identity_desc: "Tanzimat Sonrası uygunluktan sonra Bâb-ı Âli yol gösterici bir imparatorluk kimliği seçer: Osmanlıcılık, İslamcılık veya Türkçülük."
 sp_ct_insp_identity_flavor: "Risaleler ve saray muhtıraları aynı üç cevabı dolaştırır. Seçim, devletin sonra hangi büyük hedefleri izleyebileceğini biçimlendirir."
 sp_ct_insp_identity_rewards: "Tek bir imparatorluk kimliğini kilitler. Türkçülük, Pan-Milliyetçilik araştırılınca Turan Ülküsü'nü açabilir."

 sp_ct_insp_ottomanism_desc: "Osmanlı Milleti yol merkezi: tebaa eşitliği, anayasal hükümet, imparatorluk bütünlüğü ve modern büyük güç. Turan fetih iddiası yok."
 sp_ct_insp_ottomanism_flavor: "Aşamalı Osmanlı Milleti günlüğünü açar. Türkçülük→Turan’a paraleldir; Turan Ülküsü’nü açmaz."
 sp_ct_insp_ottomanism_path: "İmparatorluk Kimliği olayında Osmanlıcılık seçeneği alındığında seçilir."
 sp_ct_insp_ottomanism_rewards: "Osmanlı Milleti günlüğünü açar. Aşama IV tamamlanınca Anayasal Osmanlı İmparatorluğu verir."

 sp_ct_insp_islamism_desc: "İttihad-ı İslam yol merkezi: Hilafet'i güçlendir, Arabistan, Nil ve Mağrip, sonra Müslüman jeopolitik küre. Turan fetih iddiası yok."
 sp_ct_insp_islamism_flavor: "Aşamalı İttihad-ı İslam günlüğünü açar. Türkçülük→Turan’a paraleldir; Turan Ülküsü’nü açmaz."
 sp_ct_insp_islamism_path: "İmparatorluk Kimliği olayında İslamcılık seçeneği alındığında seçilir."
 sp_ct_insp_islamism_rewards: "İttihad-ı İslam günlüğünü açar. Aşama IV tamamlanınca Müminlerin Koruyucusu verir."

 sp_ct_insp_turkism_desc: "Yol: Türk milli çizgisi. Pan-Milliyetçilik araştırılınca Turan Ülküsü'nü açar."
 sp_ct_insp_turkism_flavor: "Türkçülük, Azerbaycan, İran, Hazar bozkırı ve Türkistan'a doğru aşamalı hak iddiası kampanyasını açabilen tek kimliktir."
 sp_ct_insp_turkism_path: "İmparatorluk Kimliği olayında Türkçülük seçeneği alındığında seçilir."
 sp_ct_insp_turkism_rewards: "Uygun olduğunda Turan Ülküsü günlüğünü açar."

 sp_ct_insp_turan_desc: "Şemsiye günlük: Azerbaycan, İran hâkimiyeti, Hazar bozkırı ve Türkistan'a doğru aşamalı hak iddiası ve denetim. Turan hedeftir — yeni ülke adı değildir."
 sp_ct_insp_turan_flavor: "Hak iddiaları fethe yardım eder; savaşlar ve tabi denetim yine kazanılmalıdır. Günlük, her aşamada ne kadarının tutulduğunu izler."
 sp_ct_insp_turan_rewards: "Aşama hak iddiaları, aşama prestij değiştiricileri, tamamlamada Turan Birleştiricisi ve Büyük Turan çözüm olayı."

 sp_ct_insp_turan_s1_desc: "Azerbaycan'ın birliği: Azerbaycan, Elizavetpol, Tebriz ve Urmiye'yi (kendi veya tabi üzerinden) denetleyin."
 sp_ct_insp_turan_s1_flavor: "Aşama I, eksik olan bu dört eyalet bölgesine hak iddiası ile açılır."
 sp_ct_insp_turan_s1_rewards: "Tamamlanınca: Aşama II'ye ilerler ve sonraki hak iddiası dalgasını verir."

 sp_ct_insp_turan_s2_desc: "İran Platosu: en az dokuz İran platosu eyaletini fetihle veya Osmanlı tabisi İran üzerinden hâkim olun."
 sp_ct_insp_turan_s2_flavor: "İran, Türk yurdu olarak değil imparatorluk hâkimiyeti olarak çerçevelenir."
 sp_ct_insp_turan_s2_alt_note: "İran Osmanlı tabisiyse, onun toprakları plato hedefine sayılır."
 sp_ct_insp_turan_s2_rewards: "Tamamlanınca: Aşama III'e ilerler ve sonraki hak iddiası dalgasını verir."

 sp_ct_insp_turan_s3_desc: "Hazar'ın ötesi: Türkmenistan, Merz, Hive ve Özbekistan'ı (kendi veya tabi üzerinden) denetleyin."
 sp_ct_insp_turan_s3_flavor: "Aşama III, İran hâkimiyetini Türkistan'a bağlar."
 sp_ct_insp_turan_s3_rewards: "Tamamlanınca: Aşama IV'e ilerler ve daha yakın Türkistan hak iddialarını verir."

 sp_ct_insp_turan_s4_desc: "Türkistan: en az sekiz Orta Asya Türkî toprağını (kendi veya tabi üzerinden) denetleyin."
 sp_ct_insp_turan_s4_flavor: "Aşama IV sırasında denetim ilerledikçe ek hak iddiaları gelebilir."
 sp_ct_insp_turan_s4_claims_note: "Aşama IV'te yeterli Orta Asya denetimi veya süre geçince ikinci bir hak iddiası dalgası gelebilir."
 sp_ct_insp_turan_s4_rewards: "Tamamlanınca: Ülkü'nün tamamlanması ve Büyük Osmanlı ilanı için Büyük Turan çözümünü açar."

 sp_ct_insp_great_ottoman_desc: "Aşama IV sonrası nihai çözüm: Osmanlı İmparatorluğu olarak kalın veya Büyük Osmanlı İmparatorluğu'nu ilan edin. Ülke Turan olarak yeniden adlandırılmaz."
 sp_ct_insp_great_ottoman_flavor: "Turan hedefti. Devlet aynı sancak altında Osmanlı — veya Büyük Osmanlı — olarak kalır."
 sp_ct_insp_great_ottoman_rewards: "Turan Birleştiricisi. İsteğe bağlı Büyük Osmanlı yeniden adlandırması."

