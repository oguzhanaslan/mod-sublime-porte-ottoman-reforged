 sp_ct_tt_ottomanism_s1: "#bold Tebaanın Eşitliği#!\n#I Kapsayıcı vatandaşlık ve vicdan özgürlüğü.#!\n#bold Ödül#! Anayasal Hükümet açılır."
 sp_ct_tt_ottomanism_s2: "#bold Anayasal Hükümet#!\n#I Oy hakkılı monarşi, serbest basın, meşruiyet 50+.#!\n#bold Ödül#! Osmanlı Milleti açılır."
 sp_ct_tt_ottomanism_s3: "#bold Osmanlı Milleti#!\n#I Bütünlük: düşük ayrılık ve sınırlı kargaşa.#!\n#bold Ödül#! Modern İmparatorluk Devleti açılır."
 sp_ct_tt_ottomanism_s4: "#bold Modern İmparatorluk Devleti#!\n#I Büyük Güç modern imparatorluk.#!\n#bold Ödül#! Anayasal Osmanlı İmparatorluğu."
 sp_ct_tt_islamism_s1: "#bold Hilafeti Güçlendir#!\n#I İstanbul ve Hicaz Hilafet düzeninde.#!\n#bold Ödül#! Arabistan açılır."
 sp_ct_tt_islamism_s2: "#bold Arabistan#!\n#I Hicaz, Necid, Hail ve Yemen'i denetleyin.#!\n#bold Ödül#! Nil ve Mağrip açılır."
 sp_ct_tt_islamism_s3: "#bold Nil ve Mağrip#!\n#I Mısır, yeterli Sudan, Trablusgarp ve Tunus.#!\n#bold Ödül#! Müslüman Dünyanın Hamisi açılır."
 sp_ct_tt_islamism_s4: "#bold Müslüman Dünyanın Hamisi#!\n#I Bâb-ı Âli ile hizalanmış en az sekiz Müslüman ülke.#!\n#bold Ödül#! Büyük Hilafet."
 sp_ct_insp_ottomanism_s1_desc: "Kapsayıcı vatandaşlık (Irksal Ayrım, Kültürel Dışlama veya Çokkültürlülük) ile Vicdan Özgürlüğü veya Tam Ayrılık çıkarın."
 sp_ct_insp_ottomanism_s1_flavor: "Gayrimüslim tebaa Osmanlı siyasi cemaatinin parçası olmalıdır. Bu yol fetih iddiası vermez."
 sp_ct_insp_ottomanism_s1_rewards: "Anayasal Hükümet açılır."
 sp_ct_insp_ottomanism_s1_rewards_tt: "Anayasal Hükümet açılır."
 sp_ct_insp_ottomanism_s2_desc: "Monarşiyi oy hakkı ile sürdürün, basını açın (Toplanma Hakkı veya Korunan Konuşma) ve meşruiyeti en az 50 tutun."
 sp_ct_insp_ottomanism_s2_flavor: "Temsili kurumlar yeterli meşruiyet olmadan ayakta kalamaz."
 sp_ct_insp_ottomanism_s2_rewards: "Osmanlı Milleti açılır."
 sp_ct_insp_ottomanism_s2_rewards_tt: "Osmanlı Milleti açılır."
 sp_ct_insp_ottomanism_s3_desc: "Kapsayıcı vatandaşlığı koruyun, ayrılık ilerlemesini %20'nin altında tutun ve dahil edilmiş eyaletlerde yaygın kargaşadan kaçının."
 sp_ct_insp_ottomanism_s3_flavor: "Çok milletli imparatorluk, yalnızca zorla ayakta durmamalıdır."
 sp_ct_insp_ottomanism_s3_rewards: "Modern İmparatorluk Devleti açılır."
 sp_ct_insp_ottomanism_s3_rewards_tt: "Modern İmparatorluk Devleti açılır."
 sp_ct_insp_ottomanism_s4_desc: "Büyük Güç, %35+ okuryazarlık, kilit kurumlar, meşruiyet 60+, kapsayıcı vatandaşlık ve servet, sayım veya evrensel oy hakkı. Yalnız toprak sahibi oyu yetmez."
 sp_ct_insp_ottomanism_s4_flavor: "Bu, anayasal Osmanlı devletinin tamamlanmış hâlidir: ayakta kalan bir monarşi altında modern bir büyük güç."
 sp_ct_insp_ottomanism_s4_rewards: "Modern İmparatorluk Devleti tamamlanınca Anayasal Osmanlı İmparatorluğu unvanı açılır."
 sp_ct_insp_ottomanism_s4_rewards_tt: "Anayasal Osmanlı İmparatorluğu unvanı açılır."
 sp_ct_insp_islamism_s1_desc: "İstanbul ve Hicaz'ı (Mekke ve Medine) tutun, İslami din-devlet düzeninde monarşi kalın ve meşruiyeti en az 50 tutun."
 sp_ct_insp_islamism_s1_flavor: "Kutsal şehirler, Arabistan'a genişlemeden önce Hilafet'in temelidir."
 sp_ct_insp_islamism_s1_rewards: "Arabistan açılır; henüz yoksa Arabistan hak iddiaları verilir."
 sp_ct_insp_islamism_s1_rewards_tt: "Arabistan açılır; eksik hak iddiaları verilir."
 sp_ct_insp_islamism_s2_desc: "Hicaz, Necid, Hail ve Yemen'i doğrudan veya tabi devletler aracılığıyla denetleyin."
 sp_ct_insp_islamism_s2_flavor: "Arabistan eldeyken sıra Nil ve Mağrip'e gelir."
 sp_ct_insp_islamism_s2_rewards: "Nil ve Mağrip açılır; hâlâ gereken yerlerde hak iddiaları verilir."
 sp_ct_insp_islamism_s2_rewards_tt: "Nil ve Mağrip açılır; gereken hak iddiaları verilir."
 sp_ct_insp_islamism_s3_desc: "Aşağı Mısır, Yukarı Mısır ve Sina'yı; Dongola, Kordofan ve Mavi Nil'den en az ikisini; ayrıca Trablusgarp ve Tunus'u doğrudan veya tabi devletler aracılığıyla denetleyin."
 sp_ct_insp_islamism_s3_flavor: "Bu aşama Mısır, Sudan ve Mağrip'i Hilafet'e bağlar."
 sp_ct_insp_islamism_s3_rewards: "Müslüman Dünyanın Hamisi açılır."
 sp_ct_insp_islamism_s3_rewards_tt: "Müslüman Dünyanın Hamisi açılır."
 sp_ct_insp_islamism_s4_desc: "En az sekiz Müslüman ülke Osmanlı tabisi, müttefiki, savunma ortağı veya Osmanlı liderliğindeki bir Güç Bloğu üyesi olsun."
 sp_ct_insp_islamism_s4_flavor: "Büyük Hilafet bir unvandır. Osmanlı devleti mevcut sancağı altında devam eder."
 sp_ct_insp_islamism_s4_rewards: "Müslüman Dünyanın Hamisi tamamlanınca Büyük Hilafet açılır."
 sp_ct_insp_islamism_s4_rewards_tt: "Büyük Hilafet açılır."
