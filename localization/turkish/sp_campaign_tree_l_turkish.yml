 sp_ct_node_placeholder_tt: "Kampanya hedefi"
 sp_ct_tt_tanzimat: "#bold Tanzimat#!\n#I Çekirdek ıslahat hedeflerini tamamla.#!\n#bold Gereksinim#! Bürokrasi, eğitim, ordu, ekonomi ve ayrılıkçılık.\n#bold Ödül#! Tanzimat Sonrası açılır."
 sp_ct_tt_post_tanzimat: "#bold Tanzimat Sonrası#!\n#I Islahattan sonra temsil, anayasa ve saltanat hakkı.#!\n#bold Gereksinim#! Tanzimat tamam.\n#bold Ödül#! Yalnızca siyasi lezzet."
 sp_ct_tt_identity: "#bold İmparatorluk Kimliği#!\n#I Osmanlıcılık, İslamcılık veya Türkçülük seç.#!\n#bold Gereksinim#! Tanzimat Sonrası uygunluğu.\n#bold Ödül#! Yol gösterici kimlik kilitlenir."
 sp_ct_tt_ottomanism: "#bold Osmanlıcılık#!\n#I Turan fethi olmadan sivil imparatorluk ıslahatı.#!\n#bold Gereksinim#! Osmanlıcılık seçildi.\n#bold Ödül#! Osmanlı Milleti; Anayasal Osmanlı."
 sp_ct_tt_islamism: "#bold İslamcılık#!\n#I Hilafet, Arabistan, Nil, Mağrip ve Müslüman hizalanması.#!\n#bold Gereksinim#! İslamcılık seçildi.\n#bold Ödül#! İttihad-ı İslam; Müminlerin Koruyucusu."
 sp_ct_tt_turkism: "#bold Türkçülük#!\n#I Milli yol; Turan'ı açabilen tek kimlik.#!\n#bold Gereksinim#! Türkçülük; Pan-Milliyetçilik.\n#bold Ödül#! Turan Ülküsü."
 sp_ct_tt_turan: "#bold Turan Ülküsü#!\n#I Azerbaycan, İran, Hazar ve Türkistan'a aşamalı iddialar.#!\n#bold Gereksinim#! Türkçülük yolu; Pan-Milliyetçilik.\n#bold Ödül#! Aşama iddiaları; Turan Birleştiricisi."
 sp_ct_tt_turan_s1: "#bold Aşama I — Azerbaycan#!\n#I Azerbaycan, Elizavetpol, Tebriz ve Urmiye'yi denetle.#!\n#bold Ödül#! Sonraki iddialar; Aşama II."
 sp_ct_tt_turan_s2: "#bold Aşama II — İran#!\n#I Dokuz plato eyaleti, veya tabi İran.#!\n#bold Ödül#! Sonraki iddialar; Aşama III."
 sp_ct_tt_turan_s3: "#bold Aşama III — Hazar#!\n#I Türkmenistan, Merz, Hive ve Özbekistan.#!\n#bold Ödül#! Türkistan iddiaları; Aşama IV."
 sp_ct_tt_turan_s4: "#bold Aşama IV — Türkistan#!\n#I En az sekiz Orta Asya Türkî toprağı.#!\n#bold Ödül#! Büyük Turan çözümü."
 sp_ct_tt_great_ottoman: "#bold Büyük Osmanlı İmparatorluğu#!\n#I Osmanlı kal veya Büyük Osmanlı'yı ilan et.#!\n#bold Gereksinim#! Aşama IV tamam.\n#bold Ödül#! Turan Birleştiricisi; isteğe bağlı ad."
 sp_ct_tt_constitutional_ottoman: "#bold Anayasal Osmanlı İmparatorluğu#!\n#I Osmanlıcılık nihai düğümü.#!\n#bold Ödül#! Prestij +15; meşruiyet +5."
 sp_ct_tt_great_caliphate: "#bold Büyük Hilafet#!\n#I İslamcılık nihai düğümü.#!\n#bold Ödül#! Prestij +20; meşruiyet +5."

