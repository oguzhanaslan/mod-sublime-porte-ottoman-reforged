 sp_ct_tt_tanzimat: "#bold Tanzimat#!\n#I Ana ıslahat hedeflerini tamamlayın.#!\n#bold Gereken#! Bürokrasi, eğitim, ordu, ekonomi ve ayrılıkçılık.\n#bold Ödül#! Tanzimat Sonrası açılır."
 sp_ct_tt_post_tanzimat: "#bold Tanzimat Sonrası#!\n#I Islahattan sonra temsil, anayasa ve saltanat hakkı.#!\n#bold Gereken#! İç Tanzimat ıslahatı yeterince ilerledi.\n#bold Ödül#! Siyasi olaylar ve geçici etkiler."
 sp_ct_tt_identity: "#bold İmparatorluk Kimliği#!\n#I Osmanlıcılık, İslamcılık veya Türkçülük seçin.#!\n#bold Gereken#! İç Tanzimat ıslahatı yeterince ilerledi.\n#bold Ödül#! Tek bir kimlik kesinleşir."
 sp_ct_tt_ottomanism: "#bold Osmanlıcılık#!\n#I Turan fethi olmadan anayasal imparatorluk ıslahatı.#!\n#bold Gereken#! Osmanlıcılık seçildi.\n#bold Ödül#! Osmanlı Milleti; Anayasal Osmanlı İmparatorluğu."
 sp_ct_tt_islamism: "#bold İslamcılık#!\n#I Hilafeti güçlendirin; Arabistan, Nil, Mağrip ve Müslüman ülkelerin desteği.#!\n#bold Gereken#! İslamcılık seçildi.\n#bold Ödül#! İttihad-ı İslam; Müminlerin Hamisi."
 sp_ct_tt_turkism: "#bold Türkçülük#!\n#I Milli siyaset; Turan'ı açabilen tek kimlik.#!\n#bold Gereken#! Türkçülük seçildi.\n#bold Ödül#! Pan-Milliyetçilik araştırılınca Turan Ülküsü."
 sp_ct_tt_turan: "#bold Turan Ülküsü#!\n#I Azerbaycan, İran, Hazar ve Türkistan'a doğru doğu seferi.#!\n#bold Gereken#! Türkçülük; Pan-Milliyetçilik.\n#bold Ödül#! Aşama hak iddiaları; Turan'ı Birleştiren."
 sp_ct_tt_turan_s1: "#bold Aşama I — Azerbaycan#!\n#I Azerbaycan, Elizavetpol, Tebriz ve Urmiye'yi denetleyin.#!\n#bold Ödül#! Sonraki hak iddiaları; Aşama II."
 sp_ct_tt_turan_s2: "#bold Aşama II — İran#!\n#I Dokuz yayla eyaleti, ya da tabi İran.#!\n#bold Ödül#! Sonraki hak iddiaları; Aşama III."
 sp_ct_tt_turan_s3: "#bold Aşama III — Hazar#!\n#I Türkmenistan, Merz, Hive ve Özbekistan.#!\n#bold Ödül#! Türkistan hak iddiaları; Aşama IV."
 sp_ct_tt_turan_s4: "#bold Aşama IV — Türkistan#!\n#I En az sekiz Orta Asya Türkî toprağı.#!\n#bold Ödül#! Büyük Turan olayı."
 sp_ct_tt_great_ottoman: "#bold Büyük Osmanlı İmparatorluğu#!\n#I Osmanlı kalın veya Büyük Osmanlı'yı ilan edin.#!\n#bold Gereken#! Aşama IV tamam.\n#bold Ödül#! Turan'ı Birleştiren; isteğe bağlı ad."
 sp_ct_tt_constitutional_ottoman: "#bold Anayasal Osmanlı İmparatorluğu#!\n#I Osmanlıcılığın son ödülü.#!\n#bold Ödül#! Prestij +15; meşruiyet +5."
 sp_ct_tt_great_caliphate: "#bold Büyük Hilafet#!\n#I İslamcılığın son ödülü.#!\n#bold Ödül#! Prestij +20; meşruiyet +5."

