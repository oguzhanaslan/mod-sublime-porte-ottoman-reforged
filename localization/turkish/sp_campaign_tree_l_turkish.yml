 sp_ct_tt_ottomanism_s3: "I-31 Aşama III — bütünlük: düşük ayrılık ve sınırlı entegre kargaşa."
 sp_ct_tt_ottomanism_s4: "I-31 Aşama IV — Büyük Güç modern imparatorluk devleti."
 sp_ct_tt_islamism_s1: "I-31 Aşama I — İstanbul ve Hicaz Hilafet düzeninde."
 sp_ct_tt_islamism_s2: "I-31 Aşama II — Arabistan: Hicaz, Necid, Hail, Yemen."
 sp_ct_tt_islamism_s3: "I-31 Aşama III — Nil ve Mağrip denetimi."
 sp_ct_tt_islamism_s4: "I-31 Aşama IV — Bâbıâli ile hizalanmış en az sekiz Müslüman ülke."
 sp_ct_insp_ottomanism_s1_desc: "Kapsayıcı vatandaşlık (Irksal Ayrım, Kültürel Dışlama veya Çokkültürlülük) ile Vicdan Özgürlüğü veya Tam Ayrılık çıkarın."
 sp_ct_insp_ottomanism_s1_flavor: "Fetih iddiası olmadan gayrimüslim tebaayı Osmanlı siyasi projesine dahil eder."
 sp_ct_insp_ottomanism_s1_rewards: "Anayasal Hükümet’e ilerler."
 sp_ct_insp_ottomanism_s2_desc: "Monarşiyi oy hakkı ile sürdürün, basını açın (Toplanma Hakkı veya Korunan Konuşma) ve meşruiyeti en az 50 tutun."
 sp_ct_insp_ottomanism_s2_flavor: "Temsili kurumlar yeterli meşruiyet olmadan ayakta kalamaz."
 sp_ct_insp_ottomanism_s2_rewards: "Osmanlı Milleti bütünlük sınavına ilerler."
 sp_ct_insp_ottomanism_s3_desc: "Kapsayıcı vatandaşlığı koruyun, ayrılık ilerlemesini %20’nin altında tutun ve yaygın entegre kargaşadan kaçının."
 sp_ct_insp_ottomanism_s3_flavor: "Çok milletli imparatorluğun zorlamasız istikrarını sınar."
 sp_ct_insp_ottomanism_s3_rewards: "Modern İmparatorluk Devleti’ne ilerler."
 sp_ct_insp_ottomanism_s4_desc: "Büyük Güç, %35+ okuryazarlık, kilit kurumlar, meşruiyet 60+, kapsayıcı vatandaşlık ve servet, sayım veya evrensel oy hakkı (yalnız toprak sahibi oyu yetmez)."
 sp_ct_insp_ottomanism_s4_flavor: "Liberal anayasal Osmanlı projesinin son başarısı. Etiket TUR kalır."
 sp_ct_insp_ottomanism_s4_rewards: "Osmanlı Milleti’ni tamamlar; Anayasal Osmanlı İmparatorluğu verir."
 sp_ct_insp_islamism_s1_desc: "İstanbul ve Hicaz’ı (Mekke ve Medine) tutun, İslami kilise-devlet düzeninde monarşi kalın ve meşruiyeti en az 50 tutun."
 sp_ct_insp_islamism_s1_flavor: "Kutsal şehirleri Hilafet’in temeli olarak güvenceye alır."
 sp_ct_insp_islamism_s1_rewards: "Arabistan’a ilerler; eksik Arabistan iddialarını verir."
 sp_ct_insp_islamism_s2_desc: "Hicaz, Necid, Hail ve Yemen’i (kendi veya tabi üzerinden) denetleyin."
 sp_ct_insp_islamism_s2_flavor: "Arabistan güvenceye alınca Nil ve Mağrip hedefleri açılır."
 sp_ct_insp_islamism_s2_rewards: "Nil ve Mağrip’e ilerler; gerektiğinde koşullu iddialar."
 sp_ct_insp_islamism_s3_desc: "Aşağı Mısır, Yukarı Mısır ve Sina’yı; Dongola, Kordofan ve Mavi Nil’den en az ikisini; ayrıca Trablusgarp ve Tunus’u (kendi veya tabi) denetleyin."
 sp_ct_insp_islamism_s3_flavor: "Osmanlı veya tabi denetiminde bitişik bir Afrika-İslam küresi kurar."
 sp_ct_insp_islamism_s3_rewards: "Müslüman Dünyanın Koruyucusu’na ilerler."
 sp_ct_insp_islamism_s4_desc: "En az sekiz Müslüman ülke Osmanlı tabisi, müttefiki, savunma ortağı veya TUR liderliğindeki bir Güç Bloğu üyesi olsun."
 sp_ct_insp_islamism_s4_flavor: "Büyük Hilafet hedef unvanıdır. Ülke etiketi TUR kalır."
 sp_ct_insp_islamism_s4_rewards: "İttihad-ı İslam’ı tamamlar; Müminlerin Koruyucusu verir."
