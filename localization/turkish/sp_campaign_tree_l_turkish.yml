 sp_ct_insp_tanzimat_desc: "Beş ana ıslahatı tamamlayın: bürokrasi, eğitim, ordu, ekonomi ve ayrılıkçılık."
 sp_ct_insp_tanzimat_flavor: "İç ıslahat önce gelir. İsteğe bağlı Suriye ve Mısır günlükleri ana hedeflerin yerini tutmaz."
 sp_ct_insp_tanzimat_rewards: "Ana ıslahatlar tamamlanınca Tanzimat biter ve sonraki imparatorluk kampanyaları açılır."

 sp_ct_insp_post_tanzimat_desc: "Islahattan sonraki siyasi mücadeleyi izleyin: temsil, Yeni Osmanlılar, anayasa, Kanun-i Esasi ve Hamidiye restorasyonu."
 sp_ct_insp_post_tanzimat_flavor: "Bu olaylar, ıslahattan sonra devleti kimin yöneteceğini tartışır. Kendiliğinden yeni kanun çıkarmaz."
 sp_ct_insp_post_tanzimat_complete_note: "Hamidiye restorasyonu gerçekleştiğinde, ya da Kanun-i Esasi ilan edilip tarih 1886.1.1 veya sonrasındaysa tamamlanır."
 sp_ct_insp_post_tanzimat_rewards: "Olay seçimleri geçici siyasi etkiler verir. Yeni kurum açılmaz."

 sp_ct_insp_identity_desc: "İç ıslahat yeterince ilerleyince Bâb-ı Âli üç yoldan birini seçer: Osmanlıcılık, İslamcılık veya Türkçülük."
 sp_ct_insp_identity_flavor: "Sarayda ve basında aynı üç cevap dolaşır. Seçim, imparatorluğun bundan sonra hangi büyük hedefleri güdebileceğini belirler."
 sp_ct_insp_identity_rewards: "Seçilen kimlik kampanya boyunca değişmez. Türkçülük, Pan-Milliyetçilik araştırıldığında Turan Ülküsü'nü açabilir."

 sp_ct_insp_ottomanism_desc: "Osmanlıcılık, imparatorluğu ortak bir Osmanlı kimliği etrafında birleştirmeyi amaçlar. Tebaanın eşitliği, anayasal yönetim ve imparatorluğun bütünlüğü bu yolun temelini oluşturur; Turan fetih iddiası verilmez."
 sp_ct_insp_ottomanism_flavor: "Bu, sivil bir imparatorluk yoludur. Turan Ülküsü bu yolda açılmaz."
 sp_ct_insp_ottomanism_path: "İmparatorluk Kimliği olayında Osmanlıcılık seçilirse bu yol açılır."
 sp_ct_insp_ottomanism_rewards: "Osmanlı Milleti günlüğü açılır. Aşama IV tamamlanınca Anayasal Osmanlı İmparatorluğu unvanı kazanılır."

 sp_ct_insp_islamism_desc: "İslamcılık, Hilafet'in otoritesini güçlendirerek Osmanlı'yı Müslüman dünyanın siyasi merkezi hâline getirmeyi amaçlar. Yol Arabistan'dan Nil ve Mağrip'e uzanır; Turan fetih iddiası verilmez."
 sp_ct_insp_islamism_flavor: "Bu, hilafet temelli bir yoldur. Turan Ülküsü bu yolda açılmaz."
 sp_ct_insp_islamism_path: "İmparatorluk Kimliği olayında İslamcılık seçilirse bu yol açılır."
 sp_ct_insp_islamism_rewards: "İttihad-ı İslam günlüğü açılır. Aşama IV tamamlanınca Müminlerin Hamisi unvanı kazanılır."

 sp_ct_insp_turkism_desc: "Türkçülük milli bir siyaset izler. Turan Ülküsü'nü açabilen tek kimliktir."
 sp_ct_insp_turkism_flavor: "Pan-Milliyetçilik araştırıldığında Azerbaycan, İran, Hazar bozkırı ve Türkistan'a doğru bir sefer açılabilir."
 sp_ct_insp_turkism_path: "İmparatorluk Kimliği olayında Türkçülük seçilirse bu yol açılır."
 sp_ct_insp_turkism_rewards: "Uygun olduğunda Turan Ülküsü günlüğü açılır."

 sp_ct_insp_turan_desc: "Turan Ülküsü, Osmanlı nüfuzunu doğuya taşır: Azerbaycan, İran, Hazar bozkırı ve Türkistan. Turan hedeftir; yeni bir ülke adı değildir."
 sp_ct_insp_turan_flavor: "Hak iddiaları fethe yardım eder; savaşların ve tabi devlet denetiminin kazanılması yine gerekir. Günlük, her aşamada ne kadar toprak tutulduğunu gösterir."
 sp_ct_insp_turan_rewards: "Her aşama hak iddiaları ve prestij verir. Ülkü tamamlanınca Turan'ı Birleştiren kazanılır ve Büyük Turan olayı açılır."

 sp_ct_insp_turan_s1_desc: "Azerbaycan, Elizavetpol, Tebriz ve Urmiye'yi doğrudan veya tabi devletler aracılığıyla denetleyin."
 sp_ct_insp_turan_s1_flavor: "Bu aşama, söz konusu dört eyalet bölgesine hak iddiası ile açılır."
 sp_ct_insp_turan_s1_rewards: "Bu aşama tamamlandığında Aşama II açılır ve sonraki hedef bölgelerde hak iddiaları kazanılır."

 sp_ct_insp_turan_s2_desc: "En az dokuz İran yaylası eyaletini fetihle, ya da Osmanlı'ya tabi bir İran üzerinden hâkimiyet altına alın."
 sp_ct_insp_turan_s2_flavor: "İran Türk yurdu sayılmaz; bölgede Osmanlı hâkimiyeti aranır."
 sp_ct_insp_turan_s2_alt_note: "İran Osmanlı'ya tabi bir devletse, elindeki topraklar yayla hedefine sayılır."
 sp_ct_insp_turan_s2_rewards: "Bu aşama tamamlandığında Aşama III açılır ve sonraki hedef bölgelerde hak iddiaları kazanılır."

 sp_ct_insp_turan_s3_desc: "Türkmenistan, Merz, Hive ve Özbekistan'ı doğrudan veya tabi devletler aracılığıyla denetleyin."
 sp_ct_insp_turan_s3_flavor: "Bu aşama, İran hâkimiyetini Türkistan'a bağlar."
 sp_ct_insp_turan_s3_rewards: "Bu aşama tamamlandığında Aşama IV açılır ve daha yakın Türkistan topraklarında hak iddiaları kazanılır."

 sp_ct_insp_turan_s4_desc: "En az sekiz Orta Asya Türkî toprağını doğrudan veya tabi devletler aracılığıyla denetleyin."
 sp_ct_insp_turan_s4_flavor: "Orta Asya'da tutulan toprak arttıkça ek hak iddiaları verilebilir."
 sp_ct_insp_turan_s4_claims_note: "Aşama IV'te yeterli Orta Asya toprağı tutulunca, ya da yeterli süre geçince ek hak iddiaları verilebilir."
 sp_ct_insp_turan_s4_rewards: "Bu aşama tamamlandığında Büyük Turan olayı açılır: Ülkü biter ve Büyük Osmanlı İmparatorluğu ilan edilip edilmeyeceğine karar verilir."

 sp_ct_insp_great_ottoman_desc: "Aşama IV'ten sonra Osmanlı İmparatorluğu olarak kalın veya Büyük Osmanlı İmparatorluğu'nu ilan edin. Ülkenin adı Turan olmaz."
 sp_ct_insp_great_ottoman_flavor: "Turan hedefti. Devlet aynı sancak altında Osmanlı — veya Büyük Osmanlı — olarak kalır."
 sp_ct_insp_great_ottoman_rewards: "Turan'ı Birleştiren. İsteğe bağlı olarak ülke adı Büyük Osmanlı İmparatorluğu olur."

