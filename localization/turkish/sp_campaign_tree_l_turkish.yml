 sp_ct_insp_tanzimat_desc: "Avrupa'nın Hasta Adamı yayı: idare, eğitim, ordu, ekonomi ve ayrılıkçılık üzerine çekirdek Tanzimat günlük hedeflerini tamamlayın."
 sp_ct_insp_tanzimat_flavor: "İç ıslahat, sonraki siyasi tartışma ve imparatorluk kimliğinin kapısıdır. Suriye/Mısır içeriği yanında görünebilir; çekirdek hedefi değiştirmez."
 sp_ct_insp_tanzimat_rewards: "Hasta Adam ana günlüğünün tamamlanması, Sublime Porte ilerlemesinde Tanzimat'ı bitmiş sayar (`sick_man_complete`)."

 sp_ct_insp_post_tanzimat_desc: "Bilgilendirici Tanzimat Sonrası Çağ günlüğü ve I-18 siyasi lezzet: tartışma, Yeni Osmanlılar, anayasal tanıma, Kanun-i Esasi adlandırma ve Hamidiye askıya alma."
 sp_ct_insp_post_tanzimat_flavor: "Bu yay, iç Tanzimat ıslahatından sonra temsil ve saltanat hakkı tartışmasını izler. Tek başına yeni kanun çıkarmaz."
 sp_ct_insp_post_tanzimat_complete_note: "Yay, Hamidiye restorasyonu ateşlendiğinde veya Kanun-i Esasi ateşlenip tarih 1886.1.1 veya sonrasındaysa tamamlanır."
 sp_ct_insp_post_tanzimat_rewards: "I-18 seçeneklerinden süreli lezzet değiştiricileri; yeni kurum yok. Sunum günlüğü yalnızca durumu izler."

 sp_ct_insp_identity_desc: "Tanzimat Sonrası uygunluktan sonra Bâb-ı Âli yol gösterici bir imparatorluk kimliği seçer: Osmanlıcılık, İslamcılık veya Türkçülük."
 sp_ct_insp_identity_flavor: "Risaleler ve saray muhtıraları aynı üç cevabı dolaştırır. Seçim, devletin sonra hangi büyük hedefleri izleyebileceğini biçimlendirir."
 sp_ct_insp_identity_rewards: "`sp_imperial_identity_chosen` ve bir yol bayrağı koyar. Türkçülük, Pan-Milliyetçilik araştırılınca Turan Ülküsü'nü açabilir."

 sp_ct_insp_ottomanism_desc: "Yol: ortak Osmanlı vatandaşlığı. Turan fetih içeriği yok."
 sp_ct_insp_ottomanism_flavor: "Osmanlıcılık, aşamalı Turan Ülküsü kampanyasını açmadan kimlik sorusunu yanıtlar."
 sp_ct_insp_ottomanism_path: "İmparatorluk Kimliği olayında Osmanlıcılık seçeneği alındığında seçilir."
 sp_ct_insp_ottomanism_rewards: "`sp_ottomanism_selected` koyar. Turan Ülküsü günlüğü yok."

 sp_ct_insp_islamism_desc: "Yol: İslami imparatorluk misyonu. Turan fetih içeriği yok."
 sp_ct_insp_islamism_flavor: "İslamcılık, aşamalı Turan Ülküsü kampanyasını açmadan kimlik sorusunu yanıtlar."
 sp_ct_insp_islamism_path: "İmparatorluk Kimliği olayında İslamcılık seçeneği alındığında seçilir."
 sp_ct_insp_islamism_rewards: "`sp_islamism_selected` koyar. Turan Ülküsü günlüğü yok."

 sp_ct_insp_turkism_desc: "Yol: Türk milli çizgisi. Pan-Milliyetçilik araştırılınca Turan Ülküsü'nü açar."
 sp_ct_insp_turkism_flavor: "Türkçülük, Azerbaycan, İran, Hazar bozkırı ve Türkistan'a doğru aşamalı hak iddiası kampanyasını açabilen tek kimliktir."
 sp_ct_insp_turkism_path: "İmparatorluk Kimliği olayında Türkçülük seçeneği alındığında seçilir."
 sp_ct_insp_turkism_rewards: "`sp_turkism_selected` koyar ve uygunsa Turan Ülküsü günlüğünü eklemeyi dener."

 sp_ct_insp_turan_desc: "Şemsiye günlük: Azerbaycan, İran hâkimiyeti, Hazar bozkırı ve Türkistan'a doğru aşamalı hak iddiası ve denetim. Turan hedeftir — yeni ülke adı değildir."
 sp_ct_insp_turan_flavor: "Hak iddiaları fethe yardım eder; savaşlar ve tabi denetim yine kazanılmalıdır. İlerleme, günlüğün mevcut aşama ilerleme ve hedef değişkenlerini kullanır."
 sp_ct_insp_turan_rewards: "Aşama hak iddiaları, aşama prestij değiştiricileri, tamamlamada Turan Birleştiricisi ve Büyük Turan çözüm olayı."

 sp_ct_insp_turan_s1_desc: "Azerbaycan'ın birliği: Azerbaycan, Elizavetpol, Tebriz ve Urmiye'yi (kendi veya tabi üzerinden) denetleyin."
 sp_ct_insp_turan_s1_flavor: "Aşama I, eksik olan bu dört eyalet bölgesine hak iddiası ile açılır."
 sp_ct_insp_turan_s1_rewards: "Tamamlanınca: Aşama II'ye ilerler ve sonraki hak iddiası dalgasını verir."

 sp_ct_insp_turan_s2_desc: "İran Platosu: en az dokuz İran platosu eyaletini fetihle veya Osmanlı tabisi İran üzerinden hâkim olun. Hedef, günlük ilerleme çubuğunu kullanır (listelenen hedeflerden 9)."
 sp_ct_insp_turan_s2_flavor: "İran, Türk yurdu olarak değil imparatorluk hâkimiyeti olarak çerçevelenir."
 sp_ct_insp_turan_s2_alt_note: "Tabi İran mülkiyeti, günlüğün kullandığı ülke-veya-tabi denetim kontrolleri üzerinden sayılır."
 sp_ct_insp_turan_s2_rewards: "Tamamlanınca: Aşama III'e ilerler ve sonraki hak iddiası dalgasını verir."

 sp_ct_insp_turan_s3_desc: "Hazar'ın ötesi: Türkmenistan, Merz, Hive ve Özbekistan'ı (kendi veya tabi üzerinden) denetleyin."
 sp_ct_insp_turan_s3_flavor: "Aşama III, İran hâkimiyetini Türkistan'a bağlar."
 sp_ct_insp_turan_s3_rewards: "Tamamlanınca: Aşama IV'e ilerler ve daha yakın Türkistan hak iddialarını verir."

 sp_ct_insp_turan_s4_desc: "Türkistan: en az sekiz Orta Asya Türkî toprağını (kendi veya tabi üzerinden) denetleyin. Hedef günlük ilerleme çubuğunu kullanır."
 sp_ct_insp_turan_s4_flavor: "Aşama IV sırasında denetim ilerledikçe ek hak iddiaları gelebilir."
 sp_ct_insp_turan_s4_claims_note: "İkinci Aşama IV hak iddiası dalgası bayrağı: `sp_turan_claims_4b_granted` (yeterli denetim veya ay sonrası, I-28'e göre)."
 sp_ct_insp_turan_s4_rewards: "Tamamlanınca: Ideal tamamlama / Büyük Osmanlı ilanı için Büyük Turan çözümünü açar."

 sp_ct_insp_great_ottoman_desc: "Aşama IV sonrası nihai çözüm: Osmanlı İmparatorluğu olarak kalın veya Büyük Osmanlı İmparatorluğu'nu ilan edin (aynı etiket; Turan ülke yeniden adlandırması yok)."
 sp_ct_insp_great_ottoman_flavor: "Turan hedefti. Devlet, etiket ve sancağın sürekliliği altında Osmanlı — veya Büyük Osmanlı — olarak kalır."
 sp_ct_insp_great_ottoman_rewards: "Turan Birleştiricisi. İsteğe bağlı Büyük Osmanlı yeniden adlandırması ve ilgili sunum; Ideal tamamlama bayrağı."

