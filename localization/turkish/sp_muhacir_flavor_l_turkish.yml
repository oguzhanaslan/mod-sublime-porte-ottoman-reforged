l_turkish:
 sp_muhacir_flavor.1.t:0 "Miri Arazi ve Köy İddiaları"
 sp_muhacir_flavor.1.d:0 "Komisyon kâtipleri muhacir çiftlikleri için miri parselleri işaretler. Yerel köylüler otlak ve nakliyeyi kaybeder; Babiâli iskânın ne kadar sert uygulanacağına karar vermelidir."
 sp_muhacir_flavor.1.f:0 "Toprak devletindir; köy başka türlü hatırlar."
 sp_muhacir_flavor.1.a:0 "Köylülere tazminat ver."
 sp_muhacir_flavor.1.b:0 "Tahsisi uygula."
 sp_muhacir_flavor.1.c:0 "Ölçümü geciktir."
 sp_muhacir_flavor.2.t:0 "Komisyon Defteri"
 sp_muhacir_flavor.2.d:0 "İaşe, çadır ve liman nakliyatı onaylanan muhacir paketini aşmıştır. Komisyon, kamplar ve iç iskân aç kalmadan önce yeni bir ödenek ister."
 sp_muhacir_flavor.2.d.wave_b:0 "Çerkes inişleri her liman hesabını zorlar. Trabzon ve iç yollar son tahsisatı aşan aşımlar bildirir; çadır ve zahire bir şekilde bulunmalıdır."
 sp_muhacir_flavor.2.f:0 "Defter kapanabilir; aç kamp kapanmaz."
 sp_muhacir_flavor.2.a:0 "Hazineden öde."
 sp_muhacir_flavor.2.b:0 "Bağış ve yerel vergi aç."
 sp_muhacir_flavor.2.c:0 "İaşeyi kıs."
 sp_muhacir_flavor.3.t:0 "Yayladaki Köyler"
 sp_muhacir_flavor.3.d:0 "Anadolu yaylasındaki iç muhacir kolonileri kök salmıştır. Siciller, camiler ve tarlalar kusurlu ama kalıcı bir iskândan söz eder."
 sp_muhacir_flavor.3.f:0 "Ne zafer ne yıkım—yalnızca kalan köyler."
 sp_muhacir_flavor.3.a:0 "Köyleri sessizce sicile geçir."
 sp_muhacir_flavor.3.b:0 "Koloniyi duyur."
 sp_muhacir_flavor.3.c:0 "Onları kendi hâllerine bırak."
 sp_muhacir_flavor.4.t:0 "Başkent Uyumuyor"
 sp_muhacir_flavor.4.d:0 "Son kaçıştan sonra Rumeli muhacirleri Doğu Trakya'yı doldurur. Barınma, çadır ve kalabalık başkent yığınınını sıkıştırır; bu bir ikinci iskân değil, sıkışıklıktır."
 sp_muhacir_flavor.4.f:0 "Şehir, kaybedilen eyaletlerden gelen her adımı duyar."
 sp_muhacir_flavor.4.a:0 "Ek çadır ve iaşe gönder."
 sp_muhacir_flavor.4.b:0 "Evleri müsadere et."
 sp_muhacir_flavor.4.c:0 "Kalabalığa katlan."
 sp_i13_land_dispute:0 "Muhacir Arazi Anlaşmazlığı"
 sp_i13_ration_strain:0 "Muhacir İaşe Yükü"
 sp_i13_capital_overcrowding:0 "Başkent Mülteci Sıkışıklığı"
