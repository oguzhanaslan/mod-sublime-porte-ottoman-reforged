l_turkish:
 sp_i25.1.t:0 "Bâb-ı Âli'nin Yeni Adamları"
 sp_i25.1.d:0 "Maaşlı, payitaht mekteplerinde yetişmiş, makamı soydan değil hizmetten bekleyen yeni bir kâtip kuşağı artık Bâb-ı Âli koridorlarını dolduruyor. Defter tutuyor, tahrirat kaleme alıyor, terfi bekliyorlar. Eski hanedanlar taşrada hâlâ ağır basıyor. Bâb-ı Âli bu yeni adamları yükseltecek mi, yoksa eski intisap dengesini mi koruyacak?"
 sp_i25.1.f:0 "Makam henüz bir bakana ait değil. Onu doldurabilene aittir."
 sp_i25.1.a:0 "Yeni adamları yükselt"
 sp_i25.1.b:0 "Eski dengeyi koru"
 sp_i25.2.t:0 "Yeni Mektepler"
 sp_i25.2.d:0 "Payitahtta yeni mektepler artık kâğıt üzerindeki bir ferman değil. Çocuklar sırada oturuyor, duvarda harita asılı, Bâb-ı Âli mektepleri imparatorluğun çoğunu hâlâ okutan cemaat ve dinî tedrisatla yarışıyor. Görünen, daha önceki tercihlerin sonucu; eğitimin ikinci bir kuruluşu değil."
 sp_i25.2.d_maarif:0 "Maarif tanziminden sonra payitahtın yeni mektepleri daha kolay görünüyor: sıralar, haritalar ve devlete ait bir ders programı. Cemaat ve dinî mektepler imparatorluğun çoğunu hâlâ okutuyor. Bâb-ı Âli yeni derslikleri mi genişletecek, yoksa o eski tedrisatı mı merkezde tutacak?"
 sp_i25.2.f:0 "Dershane bir sonuçtur, ikinci bir ferman değil."
 sp_i25.2.a:0 "Yeni mektepleri genişlet"
 sp_i25.2.b:0 "Cemaat tedrisatını merkezde tut"
 sp_i25.3.t:0 "Telgraf Taşraya Ulaşıyor"
 sp_i25.3.d:0 "Bir zamanlar payitaht meraklısı olan elektrik telgrafı artık Boğaz'ın ötesine tahrirat taşıyor. Taşra kalemleri emirleri haftalar değil saatler içinde alıyor. Yerel ileri gelenler trafiği kendi temposunda sindirmeyi hâlâ bekliyor. Bâb-ı Âli teli sıkılaştırabilir ya da kalemlerin idaresine bırakabilir."
 sp_i25.3.f:0 "Tel valinin yerini almaz. Yalnızca bahanesini kısaltır."
 sp_i25.3.a:0 "Tahriratı sıkılaştır"
 sp_i25.3.b:0 "Trafiği yerel kalemlere bırak"
 sp_i25.4.t:0 "Dersaadet Matbuatı"
 sp_i25.4.d:0 "Hususi ve yarı hususi gazeteler artık Dersaadet'te dolaşıyor. Sefer listeleri, mahkeme haberleri ve evvelce salonlarda kalan münazaralar basılıyor. Bâb-ı Âli'nin zaten bir nutuk kanunu var; bu yeni bir nizamname değil. Mesele, mevcut nezaretin mürettip sıralarına ne kadar sık oturacağıdır."
 sp_i25.4.f:0 "Matbuat bir sohbettir. Henüz bir fırka değildir."
 sp_i25.4.a:0 "Münazaraya müsamaha göster"
 sp_i25.4.b:0 "Nezareti sürdür"
 sp_i25.5.t:0 "Ecnebi Mütehassıslar"
 sp_i25.5.d:0 "Avrupalı mühendisler, muallimler ve fennî kâtipler Osmanlı hizmetine alınmış durumda. Plan çiziyor, talimi düzeltiyor, mühür taşımadan nezaret odalarında oturuyorlar. Silahlı hizmetler dışarıdan ders görmekten rahatsız; münevverler uzmanlığın tutulmasını istiyor. Bu, devleti kimin kadrolarının modernleştireceğine dair dahili bir çekişmedir."
 sp_i25.5.f:0 "Mütehassıs bir çizim bırakır. Bir muahede bırakmaz."
 sp_i25.5.a:0 "Mütehassısları tut"
 sp_i25.5.b:0 "Yerli kadroları tercih et"
 sp_i25.6.t:0 "Demiryolu İmtiyazları"
 sp_i25.6.d:0 "Osmanlı toprağında bir demiryolu zaten işliyor. Ecnebihaneler şimdi imtiyazı uzatmak için sermaye teklif ediyor; şartlar hattın kesesini Bâb-ı Âli'nin günlük elinden uzaklaştırır. Sanayiciler demirin döşenmesini, kâtipler ve şehir tüccarları imtiyazın gözetilmesini istiyor. Bugün yeni hat bahşedilmiyor. Mesele bir sonraki mili kimin sahip olacağıdır."
 sp_i25.6.f:0 "Lokomotif zaten burada. Soru imtiyazdır."
 sp_i25.6.a:0 "Ecnebi sermayesini kabul et"
 sp_i25.6.b:0 "Bâb-ı Âli nezaretini sıkı tut"
 sp_i25.7.t:0 "Taşradan Arzuhaller"
 sp_i25.7.d:0 "Mühürlü arzuhaller [SCOPE.sState('sp_i25_petition_state').GetName] vilayetinden Bâb-ı Âli'ye ulaştı. Şikâyetler idaridir: vergi, yol, pek yavaş ya da pek sert cevap veren bir yerel kalem. Bir millet adlandırmaz, yeni kanun istemez. Bâb-ı Âli arzuhali payitahtta dinleyebilir ya da zaten orada oturan valiye iade edebilir."
 sp_i25.7.f:0 "Arzuhal bir taleptir, isyan değil."
 sp_i25.7.a:0 "Arzuhali dinle"
 sp_i25.7.b:0 "Valiye havale et"
 sp_i25.8.t:0 "Liman Kentleri"
 sp_i25.8.d:0 "[SCOPE.sState('sp_i25_port_state').GetCityHubName] rıhtımında ticaret sıklaştı. Vapurlar, balyalar ve gümrük kâtipleri artık eski şehir esnafıyla rıhtımı paylaşıyor. Tüccarhaneler limanın yük için işletilmesini; geleneksel esnaf ve loncalar şehrin eski menfaatlerinin korunmasını istiyor."
 sp_i25.8.d_port:0 "[SCOPE.sState('sp_i25_port_state').GetPortHubName] rıhtımında ticaret sıklaştı. Vapurlar, balyalar ve gümrük kâtipleri artık eski şehir esnafıyla rıhtımı paylaşıyor. Tüccarhaneler limanın yük için işletilmesini; geleneksel esnaf ve loncalar şehrin eski menfaatlerinin korunmasını istiyor."
 sp_i25.8.f:0 "Rıhtım bir şirket beratı değildir. Kendisiyle tartışan bir şehirdir."
 sp_i25.8.a:0 "Tüccarhaneleri kayır"
 sp_i25.8.b:0 "Geleneksel şehir menfaatlerini koru"
 sp_i25.9.t:0 "Yeni Cadde"
 sp_i25.9.d:0 "Pera ve Galata'da Şehremaneti tecrübesi kaldırım, tenvirat ve artık mahalle sokağına benzemeyen ticari bir cadde olarak görünüyor. Bâb-ı Âli yeni caddeyi payitaht ıslahı olarak finanse edebilir ya da işi semti zaten sahiplenen yerel ileri gelenlere bırakabilir."
 sp_i25.9.f:0 "Cadde beledi bir alışkanlıktır, yeni bir müessese değil."
 sp_i25.9.a:0 "Yeni caddeyi finanse et"
 sp_i25.9.b:0 "Yerel ileri gelenlere bırak"
 sp_i25.10.t:0 "Tercüme ve Yeni İlim"
 sp_i25.10.d:0 "Tercüme Odası uzun zamandır muahedeleri çeviriyor. Yeni olan, fennî ve hukukî kitapların kâtipler ve talebeler arasında dolaşmasıdır: elkitapları, kanunlar ve Osmanlıcaya aktarılmış usuller. Bâb-ı Âli bu işi resmi ilim olarak himaye edebilir ya da zaten kendi hesabına çeviren hususi ulemaya bırakabilir."
 sp_i25.10.f:0 "Oda bir ilim icat etmez. Yalnızca birini istinsah eder."
 sp_i25.10.a:0 "Tercümeleri himaye et"
 sp_i25.10.b:0 "Hususi ulemaya bırak"
