 sp_tanzimat_syria_diplomacy: "Doğuda Yenilenen İtibar"
 sp_egyptian_question: "Doğu Meselesi"
 sp_egyptian_question_reason: "Mısır'la mücadele sınırlı bir Avrupa uzlaşmasıyla, pahalı bir azami zaferle veya çözümsüz bir dengeyle bitebilir. Askerî başarı, sağlam Büyük Güç desteği veya toprak kaldıracından herhangi biri tarihsel uzlaşmayı açabilir."
 sp_egyptian_question_status_coalition: "Fiilen katılmış bir Büyük Güç koalisyonu Bâb-ı Âli'ye arabuluculuk için yeterli diplomatik kaldıraç sağlıyor."
 sp_egyptian_question_status_battlefield: "Mısır'ın cephede gerilemesi Bâb-ı Âli'ye arabuluculuk için yeterli askerî kaldıraç sağlıyor."
 sp_egyptian_question_status_territorial: "En az üç ihtilaflı bölgenin tamamen geri alınması Bâb-ı Âli'ye arabuluculuk için yeterli toprak kaldıracı sağlıyor."
 sp_egyptian_question_status_no_leverage: "Tek bir kaldıraç yolu sağla: Mısır'ın cephede gerilemesi, Britanya-Avusturya-Rusya-Prusya arasından en az ikisinin fiilî desteği veya en az üç ihtilaflı bölgede tam Osmanlı denetimi."
 sp_egyptian_question_historical_settlement: "Doğu Meselesi Uzlaşması"
 sp_egyptian_question_maximalist_victory: "Mısır'da Azami Zafer"
 sp_egyptian_question_stalemate: "Doğu Meselesinde Kilitlenme"
 sp_egyptian_question_egyptian_advantage: "Mısır Üstünlüğü"
 sp_egyptian_question_historical_terms_tt: "Halep, Suriye, Lübnan, Filistin, Ürdün ve Adana'daki Mısır'a ait state share'lar Osmanlı İmparatorluğu'na döner. Mısır kendi pazarına sahip bir Osmanlı Protektorası olarak kalır. Girit devredilmez ve Tanzimat hedef puanı verilmez."
 sp_egyptian_question_no_crete_no_tanzimat_tt: "Bu uzlaşma Girit'i devretmez ve Tanzimat hedef puanı kazandırmaz."
 sp_egyptian_question_vanilla_sandbox_tt: "Normal kuklalaştırma, fetih ve barış yolları standart diplomatik oyun sistemi altında kullanılabilir kalır."
 sp_egyptian_question_nizip_flavor_only_tt: "Bu, Mısır'ın gerçek cephe başarısına bağlı bir anlatıdır; tarihsel yenilgiyi veya taht değişimini zorlamaz."
 sp_egyptian_question.1.t: "Levant İçin Bir Uzlaşma"
 sp_egyptian_question.1.d: "Çatışma, Bâb-ı Âli'nin sınırlı bir Avrupa uzlaşması aramasına yetecek kaldıraçla sona erdi. Mısır'ı tamamen boyunduruk altına almadan Levant geri alınabilir."
 sp_egyptian_question.1.d.mahmud: "II. Mahmud, merkezileştirici saltanatının büyüttüğü krizle yüzleşecek kadar yaşadı. Bâb-ı Âli artık Levant'ı sınırlı bir uzlaşmayla geri alabilecek kaldıraca sahip."
 sp_egyptian_question.1.d.abdulmecid: "Genç Abdülmecid döneminde Bâb-ı Âli, Mısır'ın iç idaresini korurken Levant'ı geri veren bir Avrupa uzlaşması arayacak kaldıracı kazandı."
 sp_egyptian_question.1.f: "Güçler arabuluculuğa hazırdır; fakat Mısır'ı sınırsız biçimde İstanbul'a teslim etmeyeceklerdir."
 sp_egyptian_question.1.a: "Sınırlı uzlaşmayı kabul et"
 sp_egyptian_question.1.b: "Uzlaşmayı reddet ve azami şartları izle"
 sp_egyptian_question.2.t: "İstanbul'dan Gelen Şartlar"
 sp_egyptian_question.2.d: "Önerilen uzlaşma Levant'ı ve Adana'nın ihtilaflı kısımlarını Osmanlı idaresine döndürürken Mısır'ı kendi pazarına sahip bir protektora olarak koruyor."
 sp_egyptian_question.2.f: "Mehmed Ali, hanedanını Mısır'da korumanın kuzey fetihlerinden vazgeçmeye değip değmediğine karar vermelidir."
 sp_egyptian_question.2.a: "Uzlaşmayı kabul et"
 sp_egyptian_question.2.b: "Şartları reddet"
 sp_egyptian_question.3.t: "Nizip'in Yankısı"
 sp_egyptian_question.3.d: "Mısır'ın cephe başarısı Osmanlı güvenini sarstı ve Kahire'nin pazarlık konumunu güçlendirdi. Bu bozgun takvimden değil, gerçek seferden doğdu."
 sp_egyptian_question.3.f: "Nizip'in hatırasını takvim değil, sahadaki ordular yazar."
 sp_egyptian_question.3.a: "Sefer aleyhimize döndü"
 sp_egyptian_question.4.t: "Mısır Dize Getirildi"
 sp_egyptian_question.4.d: "Bâb-ı Âli, Avrupa güçlerinin düşündüğü sınırlı uzlaşmanın çok ötesinde şartlar dayattı. Daha büyük kazanımlar savaşın olağan risk ve maliyetleriyle elde edildi."
 sp_egyptian_question.4.f: "Azami zafer mümkündür; fakat diplomasinin hediyesi değildir."
 sp_egyptian_question.4.a: "En güçlü şartlar galip geldi"
 sp_egyptian_question.5.t: "Kriz Yatışıyor"
 sp_egyptian_question.5.d: "Yakın çatışma kalıcı bir Osmanlı uzlaşması için gereken kaldıraç olmadan bitti. Mısır konumunu korurken Bâb-ı Âli sınırlı bir itibar kaybını üstleniyor."
 sp_egyptian_question.5.f: "Doğu Meselesi yalnızca şimdilik cevaplanmış görünüyor."
 sp_egyptian_question.5.a: "Sonuçla yaşamalıyız"
 sp_egyptian_question.6.t: "Kahire Arabuluculuğu Reddediyor"
 sp_egyptian_question.6.d: "Mısır önerilen uzlaşmayı reddetti. Bâb-ı Âli bu şartları yalnız arabuluculukla dayatamaz ve sınırlı bir diplomatik gerileme yaşar."
 sp_egyptian_question.6.f: "Avrupa desteği konferansı açabilir; Kahire'nin imzasını garanti edemez."
 sp_egyptian_question.6.a: "Uzlaşma başarısız oldu"
 sp_sick_man_success_army_doctrine: "Geleceği Erkân-ı Harbiyeye emanet et."
 sp_sick_man_success_army_logistics: "İmparatorluğun cephaneliklerini ve ikmal hatlarını kur."
 sp_sick_man_success_economy_industry: "İmparatorluk atölyeleri gelişsin."
 sp_sick_man_success_economy_public_works: "Vilayetleri imparatorluk bayındırlık eserleriyle birbirine bağla."
 sp_sick_man_success_education_academies: "Islahatı akademilere emanet et."
 sp_sick_man_success_education_access: "Bâb-ı Âli mekteplerini aç."
 sp_sick_man_success_bureaucracy_chancery: "Merkez kalemini güçlendir."
 sp_sick_man_success_bureaucracy_revenue: "Vilayet gelirlerini Bâb-ı Âliye bağla."
 sp_sick_man_success_separatism_reconciliation: "İmparatorluk halklarını uzlaştır."
 sp_sick_man_success_separatism_order: "Vilayetlerde nizamı yeniden kur."
 sp_sick_man_success_syria_diplomacy: "Doğuda yenilenen itibarımızı ilan et."
 sp_sick_man_success_syria_crete: "Girit Meselesini yeniden ileri sür."
 sick_man.3.f: "Bâb-ı Âli sessizliğe gömülür. Islahat fermanları yarım kalırken taşradaki otorite çözülmekte, yabancı devletler fırsat kollamakta ve bir zamanlar imparatorluk itibarının bir arada tuttuğu tâbiler kendi yollarını çizmeye hazırlanmaktadır. İmparatorluk ayaktadır; fakat yeniden teşkilatlanma vaadi yerini bir varoluş mücadelesine bırakmıştır."
