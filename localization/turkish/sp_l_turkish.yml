 sp_egypt_followup_no_tanzimat_point_tt: "Mısır takip hedefi tamamlanır ancak ilave bir Tanzimat hedef puanı kazandırmaz."
 sp_tanzimat_sound_finance_12_months_tt: "Temerrüde düşmeden 12 ay boyunca kesintisiz pozitif sabit millî gelir sürdür."
