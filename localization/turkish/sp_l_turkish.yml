l_turkish:
 sp_mod_name: "Sublime Porte: Ottoman Reforged"
 sp_mod_description: "Osmanlı İmparatorluğu için tarihsel, derin, dengeli ve ilgi çekici bir kapsamlı yenileme ve içerik modu."
 sp_egypt_followup_no_tanzimat_point_tt: "Mısır takip hedefi tamamlanır ancak ilave bir Tanzimat hedef puanı kazandırmaz."
 sp_tanzimat_sound_finance_12_months_tt: "Temerrüde düşmeden 12 ay boyunca kesintisiz pozitif sabit millî gelir sürdür."
 sp_tanzimat_funded_administration_12_months_tt: "Bürokrasi kıtlığına yaklaşmadan 12 ay boyunca kesintisiz pozitif Bürokrasi sürdür."
 je_sick_man_egypt: "Mısır Meselesi"
 je_sick_man_egypt_reason: "Suriye'de hâkimiyet yeniden kurulduktan sonra Mısır, Osmanlı egemenliği açısından isteğe bağlı bir mesele olarak kalır. Bu meselenin çözülmesi ilave bir Tanzimat hedef puanı kazandırmaz."
 sickman_syria_egypt: "Aşağı Mısır, Orta Mısır, Yukarı Mısır ve Sina üzerindeki hak iddiaları yenilendi. Mısır takip hedefinin çözülmesi ilave bir Tanzimat hedef puanı kazandırmaz."
 je_sick_man_economy: "Tanzimat: İktisadi Reform"
 je_sick_man_economy_reason: "Daha güçlü bir Osmanlı ekonomisi sürekli büyüme, sağlam kamu maliyesi ve ilhak edilmiş vilayetlerle millî pazar arasında güvenilir erişim gerektirir."
 je_sick_man_education_goal: "Okuryazarlığı bu hedef başladığındaki seviyesinden 10 yüzde puan artır."
 je_sick_man_separatism_goal: "Ayrılık tehlikesini 10 yıl boyunca düşük tut veya eşitlik ya da zorlayıcı idare yoluyla bunu 5 yıl boyunca sürdür. İçişleri, ayrılık ilerlemesini doğrudan yavaşlatır. Kolluk ise dolaylı bir nizam aracıdır: kargaşanın etkilerini sınırlar; Adanmış ve Askerîleştirilmiş Kolluk, siyasi hareketlerin ürettiği radikalleri azaltır. Hızlandırılmış rota, yeterli Hükûmet İdaresiyle desteklendiğinde iki kurumdan birini kabul eder; mekanik etkileri aynı değildir."
 sp_ottoman_balkan_cohesion_guidance: "Balkan Vilayetlerini Yönetmek"
 sp_ottoman_balkan_cohesion_guidance_reason: "#title Islahat / Bütünleşme#!\nDaha geniş kültürel ve dinî kabul, ayrımcılığı ve azınlık hareketlerinin radikalliğini azaltabilir. Balkan yurtlarında hayat standardını koru, radikal artışını sınırla ve hukuki eşitliği etkin idareye dönüştüren kurumları finanse et. Eğitim Kültürel Harareti de yükseltebilir; dolayısıyla mektepler milliyetçiliğin tek başına devası değildir.\n\n#title Nizam / Merkezîleşme#!\nİçişleri, ihtilal ve ayrılık ilerlemesini doğrudan yavaşlatır. Kolluk ise kargaşanın sonuçlarını sınırlar; Adanmış veya Askerîleştirilmiş Kolluk altında siyasi hareketlerin ürettiği radikalleri azaltır. İdari kapasiteyi ve kurum finansmanını koru, mali çöküşten kaçın ve ayrılıkçılara verilen yabancı desteğini izle.\n\n#title Muhtariyet / Uzlaşma#!\nSırbistan, Boğdan ve Eflak; ilişkiler, özgürlük arzusu, özerklik ve iktisadi bağımlılık yoluyla yönetilebilen mevcut tebaa ilişkilerine zaten sahiptir. Bu rota, ilhak edilmiş Osmanlı topraklarında yeni özerk vilayetler oluşturmaz."
 sp_balkan_cohesion.1.t: "Rumeli'yi Yönetmek"
 sp_balkan_cohesion.1.d: "Bâb-ı Âli, Balkan vilayetlerini ıslahat ve bütünleşme, nizam ve merkezîleşme ya da mevcut tebaasıyla uzlaşma yoluyla yönetebilir. Bunlar birbirini dışlayan yollar değil, birlikte kullanılabilen araçlardır. Sonuçları ayrımcılık, radikaller, siyasi hareketler, kargaşa, ayrılık ve özgürlük arzusu için normal sistemlerde görünür kalır."
 sp_balkan_cohesion.1.f: "Rumeli tek bir fermana indirgenemez. Hukuk, idare, refah, cebir ve diplomasi; imparatorluk hâkimiyetinin iş birliği mi yoksa direniş mi doğuracağını birlikte belirleyecektir."
 sp_balkan_cohesion.1.a: "Bâb-ı Âli araçları arasında denge kurmalı."
 sp_rejuvenated_sublime_porte: "Yeniden Canlanan Bâb-ı Âli"
