l_turkish:
 sp_fi.1.t:0 "Rus Elçisi Bâb-ı Âli'ye Nota Verdi"
 sp_fi.1.d:0 "Rus elçisi, imparatorluğun Ortodoks tebaası hakkında bir nota verdi: kiliseler, mahkemeler ve Petersburg'un onlar adına söz söyleme iddiası. Diplomatik ifadelerin ardında, bir iç meseleyi Avrupa meselesine dönüştürme teşebbüsü yatıyor. Bâbıâli taviz verebilir, müdahaleyi reddedebilir veya kendi ıslahatıyla karşılık verebilir."
 sp_fi.1.f:0 "Nota bir kâğıttır. Ardındaki iddia kâğıt değildir."
 sp_fi.1.a:0 "Sınırlı taviz ver"
 sp_fi.1.b:0 "Dış müdahaleyi reddet"
 sp_fi.1.c:0 "Islahat yoluyla hallet"
 sp_fi.2.t:0 "Çar'ın Himaye Talebi"
 sp_fi.2.d:0 "Petersburg artık imparatorluğun Ortodoks tebaası adına sürekli müdahale hakkı istiyor. Böyle bir himayeyi kabul etmek, Bâbıâli'nin egemenliğinin bir bölümünden vazgeçmesi demek; reddetmek ise anlaşmazlığı çözümsüz bırakacak. Islahat ve diplomasiyle daha sınırlı bir uzlaşmaya varmak hâlâ mümkün."
 sp_fi.2.f:0 "Himaye bir kez kabul edilince nezaket olarak kalmaz."
 sp_fi.2.a:0 "Sınırlı himayeyi kabul et"
 sp_fi.2.b:0 "Çar'ın iddiasını reddet"
 sp_fi.2.c:0 "Daha dar bir uzlaşma ara"
 sp_fi.3.t:0 "Doğu Vilayetlerinde Islahat Talebi"
 sp_fi.3.d:0 "Başta Rusya olmak üzere Avrupa devletleri, doğu vilayetlerinde ıslahat talep ediyor. Ermeni halkının güvenliğini, adaletsiz vergileri ve yozlaşmış taşra idaresini gerekçe gösteriyorlar. Bâbıâli kapsamlı bir ıslahata girişebilir, dış baskıyı reddedebilir veya sınırlı bir idari düzenlemeyle yetinebilir."
 sp_fi.3.f:0 "Vilayet Rus eyaleti değildir. İçindeki şikâyet yine de şikâyettir."
 sp_fi.3.a:0 "Vilayetleri ıslah et"
 sp_fi.3.b:0 "Dış baskıyı reddet"
 sp_fi.3.c:0 "Sınırlı idari ıslahat"
 sp_fi_note_concession:0 "Rus Notasına Taviz"
 sp_fi_note_sovereignty:0 "Bâb-ı Âli Egemenlikte Duruyor"
 sp_fi_note_reform:0 "Notaya Islahat Cevabı"
 sp_fi_prot_concession:0 "Sınırlı Himaye Kabulü"
 sp_fi_prot_refuse:0 "Himaye Reddi"
 sp_fi_prot_negotiate:0 "Rusya ile Dar Uzlaşma"
 sp_fi_arm_reform:0 "Doğu Vilayet Islahatı"
 sp_fi_arm_reject:0 "Ecnebi Islahat Dosyası Reddi"
 sp_fi_arm_limited:0 "Sınırlı Doğu İdaresi"
