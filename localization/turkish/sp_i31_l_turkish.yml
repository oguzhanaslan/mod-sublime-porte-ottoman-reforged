l_turkish:
 sp_je_ottomanism: "Osmanlı Milleti"
 sp_je_ottomanism_reason: "Osmanlıcılık seçildikten sonra Bâbıâli eşit vatandaşlık, anayasal hükümet ve istikrarlı çok milletli bir imparatorluk peşindedir. Fetih hak iddiası verilmez. Reformları oyuncu çıkarmalıdır."
 sp_je_ottomanism_status_stage_1: "Aşama I — Tebaanın Eşitliği: kapsayıcı vatandaşlık (Irksal Ayrım, Kültürel Dışlama veya Çokkültürlülük) ile Vicdan Özgürlüğü veya Tam Ayrılık çıkarın."
 sp_je_ottomanism_status_stage_2: "Aşama II — Anayasal Hükümet: monarşiyi oy hakkı ile sürdürün, basını açın (Toplanma Hakkı veya Korunan Konuşma) ve meşruiyeti en az 50 tutun."
 sp_je_ottomanism_status_stage_3: "Aşama III — Osmanlı Milleti: kapsayıcı vatandaşlığı koruyun, ayrılık ilerlemesini %20'nin altında tutun ve yaygın entegre kargaşadan kaçının."
 sp_je_ottomanism_status_stage_4: "Aşama IV — Modern İmparatorluk Devleti: Büyük Güç, %35+ okuryazarlık, kilit kurumlar, meşruiyet 60+, kapsayıcı vatandaşlık ve servet, sayım veya evrensel oy hakkı (yalnız toprak sahibi oyu yetmez)."
 sp_je_ottomanism_status_final: "Osmanlı Milleti yolu tamamlandı."
 sp_je_ottomanism_complete_tt: "Liberal anayasal bir Osmanlı İmparatorluğu güvence altına alındı."

 sp_je_pan_islamic_unity: "İttihad-ı İslam"
 sp_je_pan_islamic_unity_reason: "İslamcılık seçildikten sonra Bâbıâli Hilafeti güçlendirir; hak iddiası, tabi devletler ve diplomasi ile Müslüman bir jeopolitik küre kurar — serbest ilhak yoktur. Yol ilerledikçe Hıristiyan Büyük Güçler temkinli olur."
 sp_je_pan_islamic_unity_status_stage_1: "Aşama I — Hilafeti Güçlendir: İstanbul ve Hicaz'ı (Mekke ve Medine) tutun, İslami din-devlet düzeninde monarşi kalın, meşruiyeti en az 50 tutun."
 sp_je_pan_islamic_unity_status_stage_2: "Aşama II — Arabistan: Hicaz, Necid, Hail ve Yemen'i (kendi veya tabi üzerinden) denetleyin."
 sp_je_pan_islamic_unity_status_stage_3: "Aşama III — Nil ve Mağrip: Aşağı Mısır, Yukarı Mısır ve Sina; Dongola, Kordofan ve Mavi Nil'den en az ikisi; ayrıca Trablusgarp ve Tunus (kendi veya tabi)."
 sp_je_pan_islamic_unity_status_stage_4: "Aşama IV — Müslüman Dünyanın Hamisi: en az sekiz Müslüman ülke Osmanlı tabisi, müttefiki, savunma ortağı veya TUR liderliğindeki bir Güç Bloğu üyesi olsun."
 sp_je_pan_islamic_unity_status_final: "Büyük Hilafet yolu tamamlandı."
 sp_je_pan_islamic_unity_complete_tt: "Büyük Hilafet hedefi gerçekleşti. Etiket TUR olarak kalır."

 sp_ottoman_constitutional_empire: "Anayasal Osmanlı İmparatorluğu"
 sp_ottoman_constitutional_empire_desc: "Başarılı bir liberal Osmanlı anayasa projesi."
 sp_protector_of_the_faithful: "Müminlerin Hamisi"
 sp_protector_of_the_faithful_desc: "Bâbıâli İttihad-ı İslam kampanyasını Büyük Hilafet olarak tamamladı."
 sp_i31_stage_complete_prestige: "İmparatorluk Yolu İlerlemesi"
 sp_i31_stage_complete_prestige_desc: "Üç Tarz-ı Siyaset büyük yolunun bir aşaması güvenceye alındı."
 sp_i31_isolation_s2: "Pan-İslamcı Şüphe"
 sp_i31_isolation_s2_desc: "Hıristiyan Büyük Güçler Osmanlı Pan-İslamcı ihtirasını hafif şüpheyle görür."
 sp_i31_isolation_s3: "Hilafet Huzursuzluğu"
 sp_i31_isolation_s3_desc: "Hıristiyan Büyük Güçler Osmanlı Pan-İslamcı genişlemeyi diplomatik bakımdan maliyetli bulur."
 sp_i31_isolation_s4: "Pan-İslamcı Hegemon"
 sp_i31_isolation_s4_desc: "Başarılı bir Pan-İslamcı Osmanlı hegemonu ile Hıristiyan Büyük Güçlerin hizalanması zordur."
 sp_i31_muslim_affinity_s2: "Hilafet Prestiji"
 sp_i31_muslim_affinity_s2_desc: "Müslüman yönetimler Bâbıâli'nin hilafet çizgisini fark eder."
 sp_i31_muslim_affinity_s3: "İslami Dayanışma"
 sp_i31_muslim_affinity_s3_desc: "Müslüman hükümetler Osmanlı diplomatik etkisine daha açıktır."
 sp_i31_muslim_affinity_s4: "Müslüman Dünyanın Merkezi"
 sp_i31_muslim_affinity_s4_desc: "Bâbıâli tanınmış bir Pan-İslamcı merkez olarak durur."
 sp_i31_caliph_support_prestige: "Halifenin Çağrısına Cevap"
 sp_i31_caliph_support_prestige_desc: "Bir Müslüman hükümet Hilafete dayanışma gösterdi."

 sp_i31o.2.t: "Osmanlı Milleti"
 sp_i31o.2.d: "Osmanlıcı çevreler iç bir kampanya açar: tebaa eşitliği, anayasal hükümet, imparatorluk uyumu ve modern bir büyük güç devleti."
 sp_i31o.2.f: "Hak iddiası verilmez. Yasalar çıkarılmalı; kargaşa yönetilmelidir. Başarı fetih değil, liberal çok milletli bir imparatorluktur."
 sp_i31o.2.a: "Yolu sabitle"
 sp_i31o.2.a_tt: "Aşama I — Tebaanın Eşitliği başlar."

 sp_i31o.10.t: "Tebaanın Eşitliği"
 sp_i31o.10.d: "Kapsayıcı vatandaşlık ve sivil din hukuku, gayrimüslim tebaayı Osmanlı siyasi projesinin içine alır."
 sp_i31o.10.f: "Dikkat anayasal hükümete ve temsili kurumlara yönelir."
 sp_i31o.10.a: "Anayasaya doğru"

 sp_i31o.11.t: "Anayasal Hükümet"
 sp_i31o.11.d: "Monarşi artık bir oy hakkı ve daha özgür bir basına dayanır; temsili siyaseti sürdürecek meşruiyet vardır."
 sp_i31o.11.f: "Daha zor sınav, çok milletli bir imparatorluğun zorbalık olmadan istikrarını koruyup koruyamayacağıdır."
 sp_i31o.11.a: "Osmanlı Milletini kur"

 sp_i31o.12.t: "Osmanlı Milleti"
 sp_i31o.12.d: "Ayrılık baskısı sınırlıdır ve entegre kargaşa yaygın değildir. İmparatorluk modern bir imparatorluk devletine yönelebilir."
 sp_i31o.12.f: "Nihai başarı hâlâ yalnız toprak sahibi oyunun ötesinde demokratik oy hakkı, okuryazarlık, kurumlar ve Büyük Güç konumunu ister."
 sp_i31o.12.a: "İmparatorluğu modernleştir"

 sp_i31o.20.t: "Liberal bir Osmanlı İmparatorluğu"
 sp_i31o.20.d: "Servet, sayım veya evrensel oy hakkı; Büyük Güç; okuryazarlık ve kurumlar; meşruiyet ve kapsayıcı vatandaşlık — Osmanlıcı proje tamamdır."
 sp_i31o.20.f: "Bu, alternatif tarihli anayasal bir imparatorluktur. Etiket TUR kalır. Ülke yeniden adlandırılmaz."
 sp_i31o.20.a: "Osmanlı Milleti sürer"
 sp_i31o.20.a_tt: "Anayasal Osmanlı İmparatorluğu kazanılır. Osmanlıcılık günlüğü tamamlanır."

 sp_i31i.2.t: "İttihad-ı İslam"
 sp_i31i.2.d: "İslamcı çevreler hilafet kampanyası açar: Kutsal Şehirleri güvenceye al, Arabistan'a hak iddia et, Nil ve Mağrip etkisini pekiştir, sonra Müslüman bir jeopolitik küre topla."
 sp_i31i.2.f: "Hak iddiaları genişlemeye yardım eder; tabi devletler ve diplomasi sayılır. Hiçbir şey bedava ilhak edilmez. Hıristiyan Büyük Güçler temkinli olacaktır."
 sp_i31i.2.a: "İttihad-ı İslam'ı sabitle"
 sp_i31i.2.a_tt: "Aşama I — Hilafeti Güçlendir başlar."

 sp_i31i.10.t: "Hilafet Güçlendi"
 sp_i31i.10.d: "İstanbul ve Hicaz Bâbıâli'ye veya tabilerine cevap verir. Sıradaki hedef Arabistan'dır."
 sp_i31i.10.f: "Eksik olan yerlerde Hicaz, Necid, Hail ve Yemen hak iddiaları verilir."
 sp_i31i.10.a: "Arabistan'a"

 sp_i31i.11.t: "Arabistan Güvence Altında"
 sp_i31i.11.d: "Hicaz, Necid, Hail ve Yemen Osmanlı mülkiyeti veya tabi denetimi altındadır."
 sp_i31i.11.f: "Nil ve Mağrip gelir. Kaybedilmiş Mısır veya Sudan topraklarına hak iddiası, yalnızca Bâbıâli onları tabi üzerinden tutmuyorsa verilir."
 sp_i31i.11.a: "Nil ve Mağrip"
 sp_i31i.11.a_tt: "Gerekirse Darfur hak iddiası ve yalnızca Osmanlı/tabi denetimi dışındaki eyaletler için koşullu Nil/Sudan hak iddiaları verir."

 sp_i31i.12.t: "Nil ve Mağrip Tutuldu"
 sp_i31i.12.d: "Mısır, yeterli Sudan, Trablusgarp ve Tunus Bâbıâli'ye veya tabilerine cevap verir."
 sp_i31i.12.f: "Son sınav gerçek bir Pan-İslamcı küredir: tabiler, ittifaklar, savunma paktları veya TUR liderliğindeki Güç Bloğu — salt iyi ilişkiler değil."
 sp_i31i.12.a: "Müslüman Dünyayı koru"

 sp_i31i.20.t: "Büyük Hilafet"
 sp_i31i.20.d: "En az sekiz Müslüman ülke Bâbıâli ile tabi, müttefik, savunma ortağı veya Osmanlı liderliğindeki Güç Bloğu üyesi olarak durur."
 sp_i31i.20.f: "Büyük Hilafet hedef unvanıdır. Ülke etiketi TUR kalır. Otomatik yeniden adlandırma yoktur."
 sp_i31i.20.a: "Büyük Hilafeti ilan et"
 sp_i31i.20.a_tt: "Müminlerin Hamisi kazanılır. İttihad-ı İslam tamamlanır. Etiket TUR kalır."

 sp_i31i.30.t: "Halife Çağırıyor"
 sp_i31i.30.d: "Bir Hıristiyan Büyük Güç ile savaşırken Bâbıâli bağımsız Müslüman hükümetlere dayanışma çağrısı yapar."
 sp_i31i.30.f: "Destekleyebilir, tarafsız kalabilir veya reddedebilirler. Hiçbir hükümet savaşa zorlanmaz."
 sp_i31i.30.a: "Çağrıyı gönder"
 sp_i31i.30.a_tt: "En fazla beş uygun Müslüman ülke Çağrıyı alır. Küresel bekleme: beş yıl. Zorla savaşa giriş yok."

 sp_i31i.31.t: "Halife Çağırıyor"
 sp_i31i.31.d: "Hıristiyan bir Büyük Güç ile savaşan Osmanlı Hilafeti, bu hükümetten dayanışma ister."
 sp_i31i.31.f: "Destek diplomatik arka plandır; otomatik savaşa giriş değildir."
 sp_i31i.31.a: "Halifeyi destekle"
 sp_i31i.31.a_tt: "Osmanlı İmparatorluğu ile ilişkileri iyileştirir. Zorla savaşa katılım yok."
 sp_i31i.31.b: "Tarafsız kal"
 sp_i31i.31.b_tt: "Diplomatik değişiklik yok."
 sp_i31i.31.c: "Çağrıyı reddet"
 sp_i31i.31.c_tt: "Osmanlı İmparatorluğu ile ilişkileri bozar."
