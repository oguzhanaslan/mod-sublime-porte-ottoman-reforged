l_turkish:
 sp_i21.1.t:0 "Doğu'da Yerel Otorite"
 sp_i21.1.d:0 "Diyarbakır ve Musul boyunca Bab-ı Ali'nin buyruğu hâlâ emirler, aşiret reisleri ve yerel eşraf aracılığıyla yürür; gelir toplar, dava görür ve kendi adlarına asker çıkarırlar. Süleymaniye'deki Baban emirliği bunların yalnızca biridir. Mesele henüz isyan değil; doğu vilayetlerinde fiilî otoritenin kimde olduğudur."
 sp_i21.1.f:0 "Padişahın adı her yerde anılır. Memurları her yerde değil."
 sp_i21.1.a:0 "Doğu yerel ellerle idare edilir"
 sp_i21.2.t:0 "Bab-ı Ali'nin Erişimi"
 sp_i21.2.d:0 "Tanzimat artık yalnızca başkente hapsolmuş değildir. Yeni vergi defterleri, vilayet meclisleri ve hükûmet idaresinin yavaş genişlemesi Diyarbakır ile Musul'a ulaşmaktadır. Bab-ı Ali'nin idarî erişimi — yalnız fermanla değil, imparatorluğun başka yerlerde kurduğu bürokrasi ve kurumlar yoluyla — genişlemektedir."
 sp_i21.2.f:0 "Kâğıt ordudan önce doğuya gider."
 sp_i21.2.a:0 "Islahat vilayetlere ulaşsın"
 sp_i21.3.t:0 "Bedirhan: İşbirliği mi, Emir mi?"
 sp_i21.3.d:0 "Bohtan Bedirhan Bey, Diyarbakır taşrasının en güçlü yerel eşrafından biridir. Tahta karşı ilan edilmiş bir isyancı değildir; ancak yollar, avarız ve yerel adalet üzerindeki otoritesi Bab-ı Ali'nin atayacağı herhangi bir valininkine denktir. Bakanlar, bu tür aracıları sisteme dahil etmek mi yoksa doğrudan imparatorluk buyruğuyla değiştirmek mi gerektiğine karar vermelidir."
 sp_i21.3.f:0 "Bir prens gibi idare eden eşraf, şimdilik hâlâ padişahın tebaasıdır."
 sp_i21.3.a:0 "Yerel aracılara yer aç"
 sp_i21.3.b:0 "Doğrudan Bab-ı Ali otoritesini dayat"
 sp_i21.4.t:0 "Doğrudan Vilayet İdaresi"
 sp_i21.4.d:0 "Devlet, doğu Anadolu'daki hâkimiyetini sıkılaştırmıştır. Tarihçilerin Kürdistan Eyaleti diyeceği düzen, fiilen Diyarbakır'da doğrudan Osmanlı vilayet idaresinin genişlemesidir — Bab-ı Ali'den atanan valiler, imparatorluk kanallarından akan gelir ve yerel emirliklerin vilayet düzenine eklenmesi. Bu merkezî idaredir; özerklik veya halkın kendi kendini yönetmesi değildir."
 sp_i21.4.f:0 "Eyalet eski bir ad taşır. Otorite yenidir."
 sp_i21.4.a:0 "Doğrudan vilayet idaresini kabul et"
 sp_i21_local_accommodation:0 "Yerel Uzlaşma"
