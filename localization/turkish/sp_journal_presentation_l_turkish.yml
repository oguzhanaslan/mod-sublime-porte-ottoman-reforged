l_turkish:
 sp_je_imperial_identity: "Yeniden Osmanlı"
 sp_je_imperial_identity_reason: "Tanzimat mücadelesinden sonra Bâbıâli tek bir imparatorluk yolu seçmelidir: Osmanlıcılık (eşit vatandaşlık ve anayasal hükûmet), İslamcılık (Hilafet ve Müslüman jeopolitikası) veya Türkçülük (Turan Ülküsü'nü açar). Yalnızca bir yol izlenebilir."
 sp_je_hunkar_iskelesi: "Hünkâr İskelesi Antlaşması"
 sp_je_hunkar_iskelesi_reason: "Rusya, Hünkâr İskelesi Antlaşması uyarınca şu anda Osmanlı bağımsızlığını garanti etmektedir. Bu düzen diplomatik, geçici ve Boğazlar dengesine bağlıdır — kalıcı bir ittifak değildir."
 sp_je_hunkar_iskelesi_status_active: "Rus garantisi yürürlüktedir. Tarihsel olarak bağlayıcı süresi 1841'de sona ermeye işaret ediyordu."
 sp_je_hunkar_iskelesi_status_lapse_window: "Antlaşmanın bağlayıcı süresi tarihsel sonuna ulaştı. Sona ermesi otomatik değil, diplomasi meselesidir."

 sp_je_eastern_provinces: "Doğu Vilayetleri"
 sp_je_eastern_provinces_reason: "Diyarbakır ve Musul'da devlet otoritesi hâlâ yerel aracılara dayanıyor. Doğrudan idareyi genişletmek için merkezî hükûmetin köklü taşra güçlerini aşması gerekecek."
 sp_je_eastern_provinces_status_opening: "Doğu vilayetleri yüzyıla merkezî erişimin düzensiz, yerel otoritenin ise kalıcı olduğu bir düzenle girer."
 sp_je_eastern_provinces_status_local_authority: "Doğu vilayetlerinde yerel otorite, imparatorluk yönetiminin görünür bir gerçeği olarak durmaktadır."
 sp_je_eastern_provinces_status_porte_reach: "Bâb-ı Âli, doğu vilayetlerine idari erişimini genişletmektedir."
 sp_je_eastern_provinces_status_bedirhan: "Bedirhan Bey meselesi doğu vilayetlerindeki dengeye girmiştir."
 sp_je_eastern_provinces_status_bedirhan_accommodated: "Bâb-ı Âli, açık çatışma yerine Bedirhan Bey ile uzlaşma yolunu tercih etmiştir."
 sp_je_eastern_provinces_status_bedirhan_enforced: "Bâb-ı Âli, Bedirhan Bey'in yerel gücüne karşı doğrudan otorite uygulamıştır."
 sp_je_eastern_provinces_status_direct_admin: "Doğu vilayetlerinin özünde doğrudan vilayet idaresi tesis edilmektedir."

 sp_je_post_tanzimat_era: "Meşrutiyet Meselesi"
 sp_je_post_tanzimat_era_reason: "Tanzimat'ın iç ıslahatından sonra siyasi tartışmanın odağında temsil, anayasal düzen ve hükümdarın yetkileri vardır. Islahatçılar ile saray, iktidarın nasıl paylaşılacağına karar vermeli."
 sp_je_post_tanzimat_era_status_opening: "Devlet, temsilin ve anayasanın açıkça tartışıldığı bir mevsime girer."
 sp_je_post_tanzimat_era_status_debate: "Islahatçılar ile saray, Tanzimat'tan sonra iktidarın nasıl paylaşılacağını tartışmaktadır."
 sp_je_post_tanzimat_era_status_young_ottomans: "Yeni Osmanlılar hattı, temsil ve anayasal düzen üzerine kamuoyu tartışmasını şekillendirmektedir."
 sp_je_post_tanzimat_era_status_constitution: "Meclis ile hükümdar, birlikte hükmetmenin kurumları olarak tartışılmaktadır."
 sp_je_post_tanzimat_era_status_kanun_i_esasi: "Kanun-i Esasi, monarşi içinde anayasal bir düzeni adlandırmıştır."
 sp_je_post_tanzimat_era_status_palace: "Oy hakkı olmadan Bâb-ı Âli, Meşrutiyet Meselesini saltanat hakkı altında kapatmıştır."
 sp_je_post_tanzimat_era_status_hamidian: "Önceki anayasal denemelerden sonra Hamidian restorasyon siyasi gündeme girmiştir."
 sp_je_post_tanzimat_era_complete_kanun: "Kanun-i Esasi ilan edildi"
 sp_je_post_tanzimat_era_complete_hamidian: "Hamidiye restorasyonu gerçekleşti"
 sp_je_post_tanzimat_era_complete_palace: "Saray yolu, oy hakkı olmadan meseleyi kapattı"
