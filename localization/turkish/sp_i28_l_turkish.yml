l_turkish:
 sp_je_turanian_ideal: "Turan Ülküsü"
 sp_je_turanian_ideal_reason: "Türkçülüğü seçen Bâbıâli, Azerbaycan, İran yaylası, Hazar ötesi ve Türkistan’a doğru aşamalı hak talepleriyle uzun bir seferberlik yürütür. Hak talepleri fethe yardım eder; savaşların ve tâbi kontrolün kazanılması hâlâ gerekir. Turan bir ülküdür — yeni bir ülke adı değildir."
 sp_je_turanian_ideal_status_stage_1: "I. Aşama — Azerbaycan’ın Birliği: Azerbaycan, Elizavetpol, Tebriz ve Urmiye’yi doğrudan veya tâbiler aracılığıyla kontrol edin."
 sp_je_turanian_ideal_status_stage_2: "II. Aşama — İran Yaylası: İran yaylasındaki en az dokuz eyalete fetihle veya Osmanlı tâbisi bir İran üzerinden hâkim olun. İran, Türk yurdu olarak değil imparatorluk hâkimiyeti olarak çerçevelenir."
 sp_je_turanian_ideal_status_stage_3: "III. Aşama — Hazar’ın Ötesi: Türkmenistan, Merz, Hive ve Özbekistan’ı doğrudan veya tâbiler aracılığıyla kontrol edin."
 sp_je_turanian_ideal_status_stage_4: "IV. Aşama — Türkistan: Orta Asya Türkî topraklarından en az sekizini (doğrudan veya tâbi) kontrol edin."
 sp_je_turanian_ideal_status_final: "Aşamalar tamamlandı. Ülküyü bitirmek için Büyük Turan’ı sonuçlandırın."
 sp_je_turanian_ideal_complete_tt: "Turan Ülküsü gerçekleşti."

 sp_unifier_of_turan: "Turan’ı Birleştiren"
 sp_unifier_of_turan_desc: "Bâbıâli Turan Ülküsü seferberliğini tamamladı."
 sp_i28_stage_complete_prestige: "Turan İlerlemesi"
 sp_i28_stage_complete_prestige_desc: "Turan Ülküsü’nün bir aşaması güvenceye alındı."

 dyn_c_sp_great_ottoman_empire: "Büyük Osmanlı"
 dyn_c_sp_great_ottoman_empire_adj: "Büyük Osmanlı"

 sp_i28.1.t: "Üç Tarz-ı Siyaset"
 sp_i28.1.d: "Meşrutiyet Meselesi bir sonuca varmıştır. Bâbıâli'de fraksiyonlar artık net bir siyaset ister: ortak Osmanlı vatandaşlığı, İslami bir imparatorluk misyonu veya Türk millî yolu."
 sp_i28.1.f: "Matbuatta ve saray müzekkerelerinde aynı üç cevap dolaşır. Seçim, devletin ileride hangi büyük emelleri güdebileceğini belirleyecektir."
 sp_i28.1.a: "Osmanlıcılık İmparatorluğa yol göstersin"
 sp_i28.1.a_tt: "Osmanlıcılık seçilir. Turan fetih içeriği açılmaz."
 sp_i28.1.b: "İslamcılık İmparatorluğa yol göstersin"
 sp_i28.1.b_tt: "İslamcılık seçilir. Turan fetih içeriği açılmaz."
 sp_i28.1.c: "Türkçülük İmparatorluğa yol göstersin"
 sp_i28.1.c_tt: "Türkçülük seçilir."

 sp_i28.2.t: "Turan Ülküsü"
 sp_i28.2.d: "Türkçü çevreler uzun bir seferberlik açar: önce Azerbaycan, sonra İran yaylasına hâkimiyet, ardından Hazar’ın ötesi ve nihayet Türkistan."
 sp_i28.2.f: "Hak talepleri aşama aşama verilir. Hiçbir toprak bedava ilhak edilmez; Ülkü bir fırsattır, hile değildir."
 sp_i28.2.a: "Ülküyü sabitle"
 sp_i28.2.a_tt: "Eksik olan I. aşama hak talepleri (Azerbaycan, Elizavetpol, Tebriz, Urmiye) verilir."

 sp_i28.10.t: "Azerbaycan Birleşti"
 sp_i28.10.d: "Azerbaycan toprakları Osmanlı mülkü veya tâbi kontrolü altındadır. Dikkat İran yaylasına çevrilir."
 sp_i28.10.f: "Ülkü İran’ı Selçuklu ve Turco-Pers imparatorluk hâkimiyeti — doğuya giden yol — olarak çerçeveler; etnik Türk toprağı olarak değil."
 sp_i28.10.a: "Yaylaya doğru"

 sp_i28.11.t: "İran’a Hâkimiyet"
 sp_i28.11.d: "İran yaylasında yeterli kontrol fetihle veya tâbi bir İran üzerinden sağlandı."
 sp_i28.11.f: "Hazar’ın ötesinde Türkmen ve Özbek ufukları vardır."
 sp_i28.11.a: "Hazar’ın ötesi"

 sp_i28.12.t: "Hazar’ın Ötesi"
 sp_i28.12.d: "Türkmenistan, Merz, Hive ve Özbekistan Bâbıâli’ye veya tâbilerine bağlıdır. Türkistan kalır."
 sp_i28.12.f: "Yakın Türkistan eyaletlerine hak talepleri çıkarılır; kontrol ilerledikçe diğerleri gelir."
 sp_i28.12.a: "Türkistan’a"

 sp_i28.20.t: "Büyük Turan"
 sp_i28.20.d: "Aşamalı Turan Ülküsü tamamlandı. Bâbıâli Osmanlı üslubunu koruyabilir veya Büyük Osmanlı’yı ilan edebilir — TUR etiketini bırakmadan ve ülkeye Turan adı vermeden."
 sp_i28.20.f: "Turan bir ülküydü. Devlet Osmanlı — veya Büyük Osmanlı — olarak süreklilik bayrağı altında kalır."
 sp_i28.20.a: "Osmanlı İmparatorluğu kalsın"
 sp_i28.20.a_tt: "Osmanlı İmparatorluğu adı korunur. Turan’ı Birleştiren kazanılır."
 sp_i28.20.b: "Büyük Osmanlı'yı İlan Et"
 sp_i28.20.b_tt: "Ad Büyük Osmanlı olur (etiket TUR). İsteğe bağlı harita rengi. Ülke adı Turan olmaz; özel bayrak ertelenir."
