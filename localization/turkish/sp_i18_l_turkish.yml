l_turkish:
 sp_i18.1.t:0 "Tanzimat'tan Sonra"
 sp_i18.1.d:0 "Tanzimat'ın ilk reform hamlesi daireleri, mektepleri veya orduyu şimdiden yeniden biçimlendirdi. Asıl tartışma artık değişip değişmeyeceği değil, bu değişimi kimin yöneteceği: Bâb-ı Âli'nin ıslahatçı vezirleri mi, yoksa paylaşılamayan saltanat hakkı mı."
 sp_i18.1.f:0 "Tanzimat kapıyı açtı. Kapıdan kimin geçeceğine karar vermedi."
 sp_i18.1.a:0 "Bâb-ı Âli ıslahatçılarını dinle"
 sp_i18.1.b:0 "Padişahın hakkını koru"
 sp_i18.2.t:0 "Yeni Osmanlılar"
 sp_i18.2.d:0 "Payitahtta bir yazar ve memur çevresi, gazetelerde ve hususi meclislerde, temsilsiz ıslahatın imparatorluğu yarım bıraktığını savunuyor. Bunlar bir basın ve bir tartışma çevresidir; ne bir nezaret ne de yeni bir saray fırkası. Bâb-ı Âli, gazetelerine müsamaha mı gösterecek, yoksa tahrikin hoş görülmeyeceğini mi hatırlatacak."
 sp_i18.2.f:0 "Mesele iktidarın nasıl kurulacağıdır; bir adamın tayini değil."
 sp_i18.2.a:0 "Yeni basına müsamaha göster"
 sp_i18.2.b:0 "Bâb-ı Âli'yi tahrike karşı uyar"
 sp_i18.3.t:0 "Meclis ve Hükümdar"
 sp_i18.3.d:0 "Devlet, temsilî bir kanun kabul etti. Mebuslar oturacak, hükümdar tahtında kalacak. Bu, ithal bir Avrupa sloganı olmadığı gibi henüz adlı bir anayasa da değildir; iktidarın nasıl paylaşılacağına dair Bâb-ı Âli'nin kendi tanzimidir."
 sp_i18.3.f:0 "Kanun zaten geçti. Kalan, onunla yaşamaktır."
 sp_i18.3.a:0 "Meclis tahtın yanında oturacak"
 sp_i18.4.t:0 "Kanun-i Esasi"
 sp_i18.4.d:0 "Yürürlükteki temsil düzeni artık tarihî adını alabilir. Kanun-i Esasi bugün yeni bir kanun ihdas etmez; padişah tahtında kalırken meclisin hükümete ortaklık iddia ettiği, imparatorluğun zaten seçtiği anayasal düzeni adlandırır."
 sp_i18.4.f:0 "İsim vakıayı izler. Vakıa kanundan doğdu."
 sp_i18.4.a:0 "Kanun-i Esasi'yi ilan et"
 sp_i18.5.t:0 "Meclis Hayatı Askıda"
 sp_i18.5.d:0 "Bir kere temsili kabul etmiş olan Bâb-ı Âli, iktidarı yeniden saraya topluyor. Mebuslar evlerine gönderilir; padişah hükümeti oturan bir meclis olmadan idare edecektir. Bu, denenmiş bir düzenin tersine çevrilmesidir; yeni bir hanedan tesis etmek değil."
 sp_i18.5.f:0 "Meclis kapanır. Saray kapanmaz."
 sp_i18.5.a:0 "Saraydan idare et"
 sp_i18_reform_debate:0 "Islahat Münakaşası"
 sp_i18_palace_prerogative:0 "Saltanat Hakkı"
 sp_i18_young_ottoman_press:0 "Yeni Osmanlı Matbuatı"
 sp_i18_young_ottoman_warning:0 "Tahrike Karşı İhtar"
 sp_i18_hamidian_restoration:0 "Otorite Saraya Döndü"
