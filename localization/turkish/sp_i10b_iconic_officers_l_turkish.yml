 sp_i10b.1.t:0 "Savunma Hattına Hâkim Bir Zihin"
 sp_i10b.1.d:0 "Disiplinli planlaması ve baskı altında orduyu koruma yeteneğiyle genç ve titiz bir kurmay subay dikkat çekti. Fevzi Çakmak, gösterişli kahramanlıktan ziyade sabır ve mesleki ciddiyet vadediyor."
 sp_i10b.1.f:0 "Cesaretin tek başına yetmediği yerde dikkatli hazırlık orduyu korur."
 sp_i10b.1.a:0 "Görevini onayla."
 sp_i10b.2.t:0 "Sıra Dışı İnisiyatif Sahibi Bir Subay"
 sp_i10b.2.d:0 "Genç bir subay, titiz kurmay çalışmasını doktrini yenileme ve fırsatları değerlendirme cesaretiyle birleştiriyor. Mustafa Kemal, komutaya uyarlanabilir ve reformcu bir yaklaşım getiriyor."
 sp_i10b.2.f:0 "Doktrin, değişen şartlara cevap verebildiği ölçüde orduya hizmet eder."
 sp_i10b.2.a:0 "Görevini onayla."
 sp_i10b.3.t:0 "Komutada Sebat"
 sp_i10b.3.d:0 "Raporlar, planlar ve moral çökmeye başladığında birliklerini bir arada tutabilen güvenilir bir teşkilatçıdan söz ediyor. Kâzım Karabekir hazırlık, güvenilirlik ve savunma azmi getiriyor."
 sp_i10b.3.f:0 "En güvenilir komutan çoğu zaman birlikleri ayakta kalandır."
 sp_i10b.3.a:0 "Görevini onayla."
