l_turkish:
 sp_muhacir.1.t:0 "Tatar Büyük Göçü"
 sp_muhacir.1.d:0 "Kırım Tatarları ve Nogay akrabaları Osmanlı himayesine sığınmak ister. Babiâli, kıt toprağın, iaşenin ve vergi ile askerlik muafiyetinin nereye verileceğine karar vermelidir."
 sp_muhacir.1.f:0 "Bozkırı geride bırakırlar; umutları Rumeli veya Anadolu'nun onları tutmasıdır."
 sp_muhacir.1.a:0 "Başta Rumeli'ye iskân et."
 sp_muhacir.1.b:0 "Anadolu içlerine yönlendir."
 sp_muhacir.1.c:0 "Rumeli ile Anadolu arasında dengele."
 sp_muhacir.2.t:0 "Çerkes Sürgünü ve İskân"
 sp_muhacir.2.d:0 "Kuzey Kafkasya Müslüman muhacirleri Osmanlı limanlarına ve sınırlarına baskı yapar. Muhacirin Komisyonu iskân coğrafyasını seçmeli ve iç bölgelere yerleştirmenin hazine maliyetini üstlenmelidir."
 sp_muhacir.2.f:0 "Kafkasya boşalır; Babiâli şoku Balkanların mı Anadolu'nun mu taşıyacağına karar vermelidir."
 sp_muhacir.2.a:0 "İskânı Rumeli'ye yoğunlaştır."
 sp_muhacir.2.b:0 "İskânı Anadolu'ya yoğunlaştır."
 sp_muhacir.2.c:0 "Tarihsel dengeli dağılımı izle."
 sp_muhacir.2.e:0 "İç iskânı geciktir; liman kamplarını bırak."
 sp_muhacir.3.t:0 "Rumeli Mülteci Krizi"
 sp_muhacir.3.d:0 "Savaş ve toprak kaybı Balkanlardaki Müslüman nüfusu kalan Osmanlı topraklarına sürer. Türk, Tatar ve Çerkes muhacirlerin korunması, yeni nüfus uydurmadan yönetilmelidir."
 sp_muhacir.3.f:0 "Bir zamanlar Rumeli'ye iskân edilenler şimdi Rumeli'den kaçar."
 sp_muhacir.3.a:0 "Acil kabulü başkent civarında topla."
 sp_muhacir.3.b:0 "Muhacirleri Anadolu'ya dağıt."
 sp_je_muhacirin_komisyonu:0 "Muhacirin Komisyonu"
 sp_je_muhacirin_komisyonu_desc:0 "Geçici bir Osmanlı komisyonu Müslüman muhacirlerin kabulünü, naklini, vergi muafiyetini ve iç iskânını düzenler. Faal olduğu sürece hazineyi ve bürokrasiyi zorlar."
 sp_je_umum_muhacir:0 "Umûm Muhacir Komisyonu"
 sp_je_umum_muhacir_desc:0 "Acil bir komisyon Rumeli mülteci krizini yönetir: nakil, geçici yardım ve daha güvenli Anadolu vilayetlerine yerleştirme."
 sp_i12_commission_wave_a:0 "Muhacir Kabul Masrafları"
 sp_i12_commission_wave_b_rumelia:0 "Çerkes Rumeli İskân Masrafları"
 sp_i12_commission_wave_b_anatolia:0 "Çerkes Anadolu İskân Masrafları"
 sp_i12_commission_wave_b_balanced:0 "Çerkes İskân Masrafları"
 sp_i12_commission_wave_b_refuse:0 "Liman Kampı Yardım Masrafları"
 sp_i12_commission_wave_c:0 "Rumeli Mülteci Yardımı"
 sp_i12_exemption_rumelia:0 "Muhacir Vergi ve Askerlik Muafiyeti (Rumeli)"
 sp_i12_exemption_anatolia:0 "Muhacir Vergi ve Askerlik Muafiyeti (Anadolu)"
 sp_i12_exemption_wave_c_anatolia:0 "Acil Mülteci İskân Kolaylığı"
 sp_i12_rumelia_settlement_friction:0 "Muhacir İskân Gerilimi"
 sp_i12_landing_camp_modifier:0 "Muhacir Liman Kampları"
 sp_i12_eastern_thrace_refugee_camp:0 "Başkent Mülteci Yoğunluğu"
 sp_je_muhacirin_komisyonu_reason:0 "Muhacirin Komisyonu, muhacir kabulü ve iç iskân düzenlenirken faal kalır."
 sp_je_umum_muhacir_reason:0 "Umûm Muhacir Komisyonu, Rumeli mülteci krizi süresince faal kalır."
