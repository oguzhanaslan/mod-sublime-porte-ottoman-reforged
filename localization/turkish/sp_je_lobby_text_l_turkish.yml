l_turkish:
 sp_ottoman_balkan_cohesion_guidance_lobby: "Rumeli; ıslahat ve bütünleşme, nizam ve merkezîleşme veya mevcut Balkan tâbileriyle uzlaşma yoluyla tutulabilir. Bunlar araçtır, birbirini dışlayan yollar değildir."
 sp_je_tanzimat_reforms_lobby: "Tanzimat sürerken Bâbıâli yeni ıslahat fermanları çıkarabilir. Bunlar ana programı destekler, ancak temel hedeflerini tamamlamaz."
 sp_egyptian_question_lobby: "Mısır mücadelesi sınırlı bir Avrupa uzlaşması, pahalı bir azami zafer veya kilitlenme ile bitebilir. Askerî başarı, Büyük Güç desteği veya toprak kaldıracı arabuluculuğu açabilir."
 sp_je_post_tanzimat_era_lobby: "Tanzimat'tan sonra tartışmanın odağında temsil, anayasal düzen ve hükümdarın yetkileri vardır. Sonucu siyaset ve yasama belirleyecek."
 sp_je_imperial_identity_lobby: "Meşrutiyet Meselesi sonuçlandıktan sonra tek yol seçilir: Osmanlıcılık (vatandaşlık ve anayasa), İslamcılık (Hilafet ve Müslüman jeopolitikası) veya Türkçülük (Turan Ülküsü). Yalnızca bir yol izlenebilir."
 sp_je_learning_from_europe_lobby: "Bâbıâli Avrupa'ya talebe gönderebilir; askerî, teknik, eğitim, sanayi veya bahriye heyetleri davet edebilir. Bu programlar maliyetlidir, sınırlı kapasite kullanır ve Tanzimat'tan bağımsız yürür."
